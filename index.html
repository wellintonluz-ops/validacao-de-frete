// tabela inteira do parceiro — tarifas/abrangência ficam de fora, não são usadas na tela).
function trimResultadoParaHistorico(r) {
  return {
    cte: {
      nCT: r.cte.nCT, chave: r.cte.chave, dhEmi: r.cte.dhEmi,
      destMun: r.cte.destMun, destUF: r.cte.destUF, destCEP: r.cte.destCEP,
      xMunIni: r.cte.xMunIni, UFIni: r.cte.UFIni,
      remNome: r.cte.remNome, remCEP: r.cte.remCEP, remMun: r.cte.remMun, remUF: r.cte.remUF,
      vTPrest: r.cte.vTPrest, vCarga: r.cte.vCarga, pesoBC: r.cte.pesoBC, pesoReal: r.cte.pesoReal,
      pICMS: r.cte.pICMS, vICMS: r.cte.vICMS,
      comps: r.cte.comps, compsBrutos: r.cte.compsBrutos,
      notasFiscais: r.cte.notasFiscais,
    },
    parceiro: { id: r.parceiro.id, nome: r.parceiro.nome },
    calc: {
      status: r.calc.status,
      regiaoEncontrada: r.calc.regiaoEncontrada,
      abrRow: r.calc.abrRow,
      componentes: r.calc.componentes,
      subtotalCalculado: r.calc.subtotalCalculado,
      totalCalculado: r.calc.totalCalculado,
    },
    cobrado: r.cobrado,
    calculado: r.calculado,
    divergencia: r.divergencia,
    tipoOperacao: r.tipoOperacao,
    valorFreteCliente: r.valorFreteCliente,
    divergenciaCliente: r.divergenciaCliente,
    nfeVinculada: r.nfeVinculada,
    canal: r.canal ?? null,
    pedido: r.pedido ?? null,
    tabelaAlternativa: r.tabelaAlternativa || null,
    reposicao: !!r.reposicao,
    reposicaoCte: !!r.reposicaoCte,
    freteNfOriginal: r.freteNfOriginal ?? null,
    obsFluxo: r.obsFluxo ?? null,
  };
}
function trimSemParceiroParaHistorico(c) {
  return { nCT: c.nCT, dhEmi: c.dhEmi, emitCNPJ: c.emitCNPJ, emitNome: c.emitNome, destMun: c.destMun, destUF: c.destUF, vTPrest: c.vTPrest };
}
// reentregas e trajetos atípicos têm o mesmo formato { cte, parceiro } — trim enxuto,
// só o que as telas realmente usam pra exibir
function trimForaFluxoParaHistorico(x) {
  return {
    cte: { nCT: x.cte.nCT, chave: x.cte.chave || null, dhEmi: x.cte.dhEmi, destMun: x.cte.destMun, destUF: x.cte.destUF, xMunIni: x.cte.xMunIni, UFIni: x.cte.UFIni, xMunFim: x.cte.xMunFim, UFFim: x.cte.UFFim, vTPrest: x.cte.vTPrest, notasFiscais: x.cte.notasFiscais || [] },
    parceiro: { id: x.parceiro.id, nome: x.parceiro.nome },
    canal: x.canal ?? null,
  };
}

// Resumo + detalhe enxuto de um lote, no formato gravado em 'validacoes' (Histórico).
// Usado ao validar um lote novo e ao recalcular um lote já importado.
function montarRegistroHistorico(nomeLote, v) {
  const { resultados, semParceiro = [], outrosFluxos = [], reentregas = [], duplicadosIgnorados = 0 } = v;
  const tol = 0.05;
  // devolução/reentrega ficam só na aba própria delas — não contam aqui, pra não duplicar
  const maior = resultados.filter(r => !ehPrejuizoTotal(r) && divergenciaEfetiva(r) !== null && divergenciaEfetiva(r) > tol);
  const menor = resultados.filter(r => !ehPrejuizoTotal(r) && divergenciaEfetiva(r) !== null && divergenciaEfetiva(r) < -tol);
  const devolucoesResultados = resultados.filter(r => r.tipoOperacao === 'devolucao');
  const reposicoesResultados = resultados.filter(ehReposicao);
  const resumoFin = calcularResumoFinanceiro(resultados, reentregas, semParceiro, outrosFluxos);
  const resumo = {
    total: resultados.length + semParceiro.length + outrosFluxos.length + reentregas.length,
    qtdDivergenciaMaior: maior.length,
    qtdDivergenciaMenor: menor.length,
    valorDivergenteMaior: clamp2(maior.reduce((a,r) => a + divergenciaEfetiva(r), 0)),
    valorDivergenteMenor: clamp2(menor.reduce((a,r) => a + divergenciaEfetiva(r), 0)),
    parceiros: Array.from(new Set(resultados.map(r => r.parceiro.nome))),
    semParceiro: semParceiro.length,
    devolucoes: devolucoesResultados.length,
    valorDevolucoes: clamp2(devolucoesResultados.reduce((a,r) => a + (r.cobrado||0), 0)),
    outrosFluxos: outrosFluxos.length,
    reentregas: reentregas.length,
    valorReentregas: clamp2(reentregas.reduce((a,x) => a + (x.cte.vTPrest||0), 0)),
    reposicoes: reposicoesResultados.length,
    valorReposicoes: clamp2(reposicoesResultados.reduce((a,r) => a + (r.cobrado||0), 0)),
    duplicadosIgnorados,
    totalCobrado: resumoFin.totalCobrado,
    totalClientePagou: resumoFin.totalClientePagou,
    ajusteSemErro: resumoFin.ajusteSemErro,
    faturado: resumoFin.faturado,
  };
  return {
    nomeArquivo: nomeLote, numeroFatura: v.numeroFatura || null, resumo,
    resultados: resultados.map(trimResultadoParaHistorico),
    semParceiro: semParceiro.map(trimSemParceiroParaHistorico),
    outrosFluxos: outrosFluxos.map(trimForaFluxoParaHistorico),
    reentregas: reentregas.map(trimForaFluxoParaHistorico),
    detalheDisponivel: true,
  };
}

// Recalcula o lote que está aberto na tela (recém-validado ou reaberto pelo Histórico)
// com o cadastro ATUAL dos parceiros — sem precisar subir os XMLs de novo (que agora
// seriam bloqueados como duplicados). Atualiza a tela, o Histórico e os CT-es salvos.
// Recalcula o resumo (divergências, Faturado…) do lote aberto e grava no Histórico se mudou —
// usado quando uma análise "Sem erro" muda o que conta como diferença.
async function atualizarResumoDoLoteNoHistorico() {
  const v = STATE.ultimaValidacao;
  if (!v || !v.historicoId || !v.resultados?.length) return;
  // sem as análises carregadas não dá pra saber quem é "Sem erro" — não mexe no Histórico
  if (!STATE._revisoesCarregadas) return;
  const novo = montarRegistroHistorico(v.nomeArquivo, v).resumo;
  const campos = ['qtdDivergenciaMaior', 'qtdDivergenciaMenor', 'valorDivergenteMaior', 'valorDivergenteMenor', 'totalCobrado', 'totalClientePagou', 'faturado', 'ajusteSemErro'];
  const anterior = v._resumoGravado || {};
  if (campos.every(k => anterior[k] === novo[k])) return;
  const patch = {}; campos.forEach(k => { patch[k] = novo[k] ?? null; });
  try {
    await comTimeout(DataLayer.atualizarResumoHistorico(v.historicoId, patch), 20000, 'atualizar o Histórico');
    v._resumoGravado = { ...anterior, ...patch };
  } catch (e) {
    console.error('[Histórico] falha ao atualizar resumo:', e);
    toast(mensagemErroFirebase(e, 'atualizar o Faturado no Histórico'), 'warn');
  }
}

async function recalcularLoteAtual() {
  const v = STATE.ultimaValidacao;
  if (!v || !v.resultados?.length) { toast('Nenhum lote aberto pra recalcular.', 'warn'); return; }
  const btn = $('#btnRecalcular');
  if (btn) { btn.disabled = true; btn.textContent = 'Recalculando…'; }
  try {
    const parceiros = await DataLayer.listParceiros().catch(() => STATE.parceiros);
    if (parceiros?.length) STATE.parceiros = parceiros;
    const indices = {};
    let recalculados = 0, semCadastro = 0;
    v.resultados.forEach(r => {
      const nomeOrig = nomeOriginalParceiro(r.parceiro);
      const p = STATE.parceiros.find(x => !x.rascunho && x.id === r.parceiro.id)
        || STATE.parceiros.find(x => !x.rascunho && normalizaNomeParceiro(x.nome) === normalizaNomeParceiro(nomeOrig))
        || STATE.parceiros.find(x => x.id === r.parceiro.id);
      if (!p) { semCadastro++; return; }
      r.parceiro = p;
      const pCalc = parceiroCalculo(r); // mantém a tabela em rascunho escolhida na análise, se houver
      if (!indices[pCalc.id]) indices[pCalc.id] = buildAbrangenciaIndex(pCalc.abrangencia || []);
      const enderecoConsulta = r.tipoOperacao === 'devolucao' ? { uf: r.cte.remUF, cep: r.cte.remCEP } : null;
      r.calc = calcularParceiro(r.cte, pCalc, indices[pCalc.id], enderecoConsulta);
      r.calculado = r.calc.totalCalculado;
      r.divergencia = (r.calculado !== null) ? clamp2(r.cobrado - r.calculado) : null;
      delete r.pesoCubadoInfo;
      recalculados++;
    });

    // casa de novo com as NF-es salvas (inclusive as importadas depois) e refaz a cubagem
    const chaves = v.resultados.flatMap(r => (r.cte.notasFiscais || []).map(n => n.chave));
    const nfes = await DataLayer.listNfesPorChaves(chaves).catch(() => []);
    if (nfes.length) enriquecerComNotasFiscais(v.resultados, nfes);
    await aplicarPlanilhaAoLote(v).catch(e => console.error(e));
    if (v.resultados.some(r => r._itensNFe)) {
      const produtosMap = await carregarMapaProdutosAtivo().catch(() => null);
      if (produtosMap) recalcularComCubagem(v.resultados, produtosMap);
    }

    renderResultadosValidacao();

    const registro = montarRegistroHistorico(v.nomeArquivo, v);
    if (v.historicoId) {
      await DataLayer.substituirValidacao(v.historicoId, registro).catch(e => { console.error(e); toast('Recalculado na tela, mas não consegui atualizar o Histórico. Detalhe no console (F12).', 'error'); });
    }
    // (se ainda não foi salva, o recálculo fica só na tela até clicar em "Salvar validação")
    // (os CT-es em 'ctes' servem só pro bloqueio de duplicados — não precisam ser regravados
    //  a cada recálculo; o detalhe atualizado fica no Histórico. Economiza centenas de gravações.)

    toast(`${recalculados} CT-e(s) recalculado(s) com o cadastro atual${semCadastro ? ` · ${semCadastro} sem parceiro cadastrado (mantidos como estavam)` : ''}.`, 'success');
  } catch (e) {
    console.error(e);
    toast('Erro ao recalcular o lote. Detalhe no console (F12).', 'error');
  } finally {
    const b = $('#btnRecalcular');
    if (b) { b.disabled = false; b.textContent = 'Recalcular com cadastro atual'; }
  }
}

// ----- Salvar a validação manualmente -----
function temValidacaoNaoSalva() {
  const v = STATE.ultimaValidacao;
  return !!(v && v.naoSalvo && !v.historicoId && (v.resultados?.length || v.semParceiro?.length || v.reentregas?.length || v.outrosFluxos?.length));
}

async function salvarValidacaoAtual() {
  const v = STATE.ultimaValidacao;
  if (!v) return false;
  if (v.historicoId) { toast('Essa validação já está salva no Histórico.', 'info'); return true; }
  const inpF = $('#numeroFatura');
  if (inpF) v.numeroFatura = inpF.value.trim();
  if (!v.numeroFatura) {
    toast('Preencha o Nº da fatura antes de salvar a validação.', 'error');
    if (inpF) { inpF.focus(); inpF.classList.add('ring-2', 'ring-red-300'); }
    return false;
  }
  if (STATE._salvandoValidacao) return false;
  STATE._salvandoValidacao = true;
  const btn = $('#btnSalvarValidacao');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando…'; }
  const { resultados, semParceiro = [], outrosFluxos = [], reentregas = [] } = v;
  const nomeLote = v.nomeArquivo;
  try {
    // confere de novo quem já está no banco (alguém da equipe pode ter salvo o mesmo CT-e
    // enquanto esta validação estava aberta) — mantém sempre o primeiro registro
    const todasChaves = [...resultados.map(r => r.cte.chave), ...semParceiro.map(c => c.chave), ...outrosFluxos.map(x => x.cte.chave), ...reentregas.map(x => x.cte.chave)];
    const jaNoBanco = await comTimeout(DataLayer.chavesExistentes('ctes', todasChaves), 30000, 'conferir duplicados');
    const agora = new Date().toISOString();
    const paraSalvarGlobal = [
      ...resultados.filter(r => r.cte.chave).map(r => ({ chave: r.cte.chave, ...trimResultadoParaHistorico(r), categoria: 'validado' })),
      ...semParceiro.filter(c => c.chave).map(c => ({ chave: c.chave, nCT: c.nCT, dhEmi: c.dhEmi, emitNome: c.emitNome, emitCNPJ: c.emitCNPJ, destMun: c.destMun, destUF: c.destUF, vTPrest: c.vTPrest, categoria: 'sem_parceiro' })),
      ...outrosFluxos.filter(x => x.cte.chave).map(x => ({ chave: x.cte.chave, nCT: x.cte.nCT, dhEmi: x.cte.dhEmi, parceiroNome: x.parceiro.nome, xMunIni: x.cte.xMunIni, UFIni: x.cte.UFIni, xMunFim: x.cte.xMunFim, UFFim: x.cte.UFFim, vTPrest: x.cte.vTPrest, categoria: 'trajeto_atipico' })),
      ...reentregas.filter(x => x.cte.chave).map(x => ({ chave: x.cte.chave, nCT: x.cte.nCT, dhEmi: x.cte.dhEmi, parceiroNome: x.parceiro.nome, destMun: x.cte.destMun, destUF: x.cte.destUF, vTPrest: x.cte.vTPrest, categoria: 'reentrega' })),
    ].filter(o => !jaNoBanco.has(o.chave)).map(o => ({ ...o, arquivoOrigem: nomeLote, importadoEm: agora }));

    const registro = montarRegistroHistorico(nomeLote, v);
    if (!OFFLINE_MODE && !v._idHistorico) v._idHistorico = db.collection('validacoes').doc().id;
    registro._idFixo = v._idHistorico;
    let salvo;
    try {
      salvo = await comTimeout(DataLayer.saveValidacao(registro), 60000, 'salvar no Histórico');
    } catch (e) {
      console.error(e);
      if (/resource-exhausted|quota|timeout|permission/i.test((e.code || '') + (e.message || ''))) throw e;
      // falha por outro motivo (ex: tamanho) — tenta só com o resumo
      salvo = await comTimeout(DataLayer.saveValidacao({ _idFixo: v._idHistorico, nomeArquivo: nomeLote, numeroFatura: v.numeroFatura, resumo: registro.resumo, detalheDisponivel: false }), 30000, 'salvar no Histórico');
      toast('Salvo no Histórico só com o resumo (o detalhe linha a linha não coube). Detalhe no console (F12).', 'warn');
    }
    v.historicoId = salvo?.id || null;
    v.naoSalvo = false;
    v._resumoGravado = { ...registro.resumo };
    const ignorados = todasChaves.filter(Boolean).length - paraSalvarGlobal.length;
    try {
      await comTimeout(DataLayer.registrarChavesLote(v.historicoId || v._idHistorico || uid(), nomeLote, paraSalvarGlobal.map(o => o.chave)), 60000, 'registrar os CT-es');
      toast(`Validação salva no Histórico${ignorados > 0 ? ` (${ignorados} CT-e(s) já estavam registrados por outra validação — mantido o primeiro)` : ''}.`, 'success');
    } catch (e) {
      console.error('[CT-e global] falha ao salvar:', e);
      toast('Validação salva no Histórico, mas não consegui registrar os CT-es pro bloqueio de duplicados. ' + mensagemErroFirebase(e, 'registrar os CT-es'), 'warn');
    }
    renderResultadosValidacao();
    return true;
  } catch (e) {
    console.error(e);
    toast(mensagemErroFirebase(e, 'salvar a validação'), 'error');
    const b = $('#btnSalvarValidacao');
    if (b) { b.disabled = false; b.textContent = 'Salvar validação'; }
    return false;
  } finally {
    STATE._salvandoValidacao = false;
  }
}

// Pergunta o que fazer com a validação não salva. Resolve 'salvar' | 'descartar' | 'cancelar'.
function perguntarSobreValidacaoNaoSalva(texto, rotuloDescartar = 'Sair sem salvar') {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'fixed inset-0 z-[60] bg-ink-900/40 flex items-center justify-center p-4';
    wrap.innerHTML = `
      <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6">
        <div class="text-base font-semibold text-ink-900 mb-1">Validação não salva</div>
        <p class="text-sm text-ink-500 mb-5">${escapeHtml(texto)}</p>
        <div class="flex flex-wrap justify-end gap-2">
          <button data-r="cancelar" class="px-3 py-2 rounded-lg text-sm text-ink-600 hover:bg-ink-50">Cancelar</button>
          <button data-r="descartar" class="px-3 py-2 rounded-lg text-sm font-medium text-red-600 border border-red-200 hover:bg-red-50">${escapeHtml(rotuloDescartar)}</button>
          <button data-r="salvar" class="px-3 py-2 rounded-lg text-sm font-medium text-white bg-ink-900 hover:bg-ink-800">Salvar e continuar</button>
        </div>
      </div>`;
    const fim = (r) => { wrap.remove(); document.removeEventListener('keydown', esc); resolve(r); };
    const esc = (e) => { if (e.key === 'Escape') fim('cancelar'); };
    wrap.addEventListener('click', (e) => { const b = e.target.closest('[data-r]'); if (b) fim(b.dataset.r); else if (e.target === wrap) fim('cancelar'); });
    document.addEventListener('keydown', esc);
    document.body.appendChild(wrap);
  });
}

// true = pode seguir (salvou, descartou ou não tinha nada pendente); false = ficar na tela
async function podeSairDaValidacao(texto = 'Deseja sair sem salvar a validação?', rotuloDescartar) {
  if (!temValidacaoNaoSalva()) return true;
  const resp = await perguntarSobreValidacaoNaoSalva(texto, rotuloDescartar);
  if (resp === 'cancelar') return false;
  if (resp === 'salvar') return await salvarValidacaoAtual();
  STATE.ultimaValidacao = null; // descartou
  return true;
}

window.addEventListener('beforeunload', (e) => {
  if (STATE._gravandoNfes) { e.preventDefault(); e.returnValue = 'As notas fiscais ainda estão sendo gravadas.'; return e.returnValue; }
  if (temValidacaoNaoSalva()) { e.preventDefault(); e.returnValue = 'Deseja sair sem salvar a validação?'; return e.returnValue; }
});

async function processarZip(entrada) {
  const nomeLote = nomeDoLote(entrada);
  if (!(await podeSairDaValidacao('Existe uma validação que ainda não foi salva. Deseja descartá-la e importar os novos arquivos?', 'Descartar e importar'))) return;
  if (STATE.parceiros.length === 0) {
    toast('Cadastre pelo menos um parceiro antes de validar.', 'warn');
    return;
  }
  $('#progressBox').classList.remove('hidden');
  $('#resultadosBox').innerHTML = '';
  $('#progressLabel').textContent = 'Lendo XMLs…';

  try {
    const { ctes: todosCtes, falhas, totalArquivos } = await readCtesFromZip(entrada, (done, total) => {
      const pct = Math.round((done/total)*100);
      $('#progressBar').style.width = pct + '%';
      $('#progressPct').textContent = pct + '%';
      $('#progressLabel').textContent = `Lendo XMLs… ${done}/${total}`;
    });

    if (falhas.length) toast(`${falhas.length} arquivo(s) não puderam ser lidos como CT-e.`, 'warn');
    if (todosCtes.length === 0) { toast(totalArquivos === 0 ? 'Nenhum arquivo .xml encontrado (nem solto, nem dentro de .zip).' : 'Nenhum CT-e válido encontrado nos arquivos enviados.', 'error'); $('#progressBox').classList.add('hidden'); return; }

    // bloqueia CT-es cuja chave de acesso já foi importada antes — mantém só o primeiro
    // registro, não deixa duplicar mesmo que o mesmo .zip (ou lotes sobrepostos) seja
    // subido de novo por engano
    $('#progressLabel').textContent = 'Conferindo CT-es já importados antes…';
    const chavesExistentes = await DataLayer.chavesExistentes('ctes', todosCtes.map(c => c.chave)).catch(e => { console.error(e); return new Set(); });
    const ctesDuplicados = todosCtes.filter(c => c.chave && chavesExistentes.has(c.chave));
    const ctes = todosCtes.filter(c => !c.chave || !chavesExistentes.has(c.chave));

    if (ctesDuplicados.length > 0) {
      toast(`${ctesDuplicados.length} CT-e(s) ignorado(s) por já terem sido importados antes (mesma chave de acesso) — mantido só o registro original.`, 'warn');
    }
    if (ctes.length === 0) {
      $('#progressBox').classList.add('hidden');
      toast('Todos os CT-es desse arquivo já tinham sido importados antes — nada novo pra validar.', 'warn');
      return;
    }

    $('#progressLabel').textContent = 'Comparando com as tabelas negociadas…';
    await new Promise(r => setTimeout(r, 50)); // deixa o navegador pintar o texto

    const { resultados, semParceiro, outrosFluxos, reentregas } = validarLoteCtes(ctes, STATE.parceiros);

    // casa automaticamente com notas fiscais que já foram importadas antes (por qualquer
    // pessoa da equipe) — só precisa subir o .zip de NF-e manualmente pra notas que ainda
    // nunca passaram pelo site
    $('#progressLabel').textContent = 'Casando com notas fiscais já salvas…';
    const chavesNfeReferenciadas = resultados.flatMap(r => (r.cte.notasFiscais || []).map(n => n.chave));
    const nfesJaSalvas = await DataLayer.listNfesPorChaves(chavesNfeReferenciadas).catch(() => []);
    let resumoMatchAutomatico = null;
    if (nfesJaSalvas.length > 0) resumoMatchAutomatico = enriquecerComNotasFiscais(resultados, nfesJaSalvas);
    // planilha de notas (canal + frete/itens quando não tem XML da NF-e)
    const resumoPlanilha = await aplicarPlanilhaAoLote({ resultados, reentregas, outrosFluxos }).catch(e => { console.error(e); return null; });
    if (resultados.some(r => r._itensNFe)) {
      const produtosMapAuto = await carregarMapaProdutosAtivo().catch(() => null);
      if (produtosMapAuto) recalcularComCubagem(resultados, produtosMapAuto);
    }
    $('#progressBox').classList.add('hidden');

    STATE.ultimaValidacao = { nomeArquivo: nomeLote, resultados, semParceiro, outrosFluxos, reentregas, duplicadosIgnorados: ctesDuplicados.length };
    STATE._filtrosRes = {}; STATE._filtroAtual = 'todos'; STATE._selecionados = new Set();
    renderResultadosValidacao();
    if ((resumoMatchAutomatico && resumoMatchAutomatico.casados > 0) || (resumoPlanilha && resumoPlanilha.comCanal > 0)) {
      const partes = [];
      if (resumoMatchAutomatico?.casados) partes.push(`${resumoMatchAutomatico.casados} com XML de NF-e`);
      if (resumoPlanilha?.comCanal) partes.push(`${resumoPlanilha.comCanal} com canal da planilha${resumoPlanilha.freteDaPlanilha ? ` (${resumoPlanilha.freteDaPlanilha} com frete do cliente vindo da planilha)` : ''}`);
      toast(`CT-es casados automaticamente com notas já salvas: ${partes.join(' · ')}.`, 'success');
    }

    // NÃO grava mais sozinho: a validação fica pendente até clicar em "Salvar validação"
    // (e só então os CT-es entram no bloqueio de duplicados e o lote vai pro Histórico).
    STATE.ultimaValidacao.naoSalvo = true;
    renderResultadosValidacao();
  } catch (e) {
    console.error(e);
    $('#progressBox').classList.add('hidden');
    toast('Erro ao processar os arquivos. Confira se são XMLs (ou .zip) válidos de CT-e.', 'error');
  }
}

async function processarNotasFiscais(entrada, progressBoxId = 'progressNFeBox') {
  const nomeLote = nomeDoLote(entrada);
  const temValidacaoAtiva = STATE.ultimaValidacao && STATE.ultimaValidacao.resultados?.length > 0;
  const progressBox = $('#' + progressBoxId);
  progressBox.classList.remove('hidden');
  progressBox.textContent = 'Lendo XMLs de NF-e…';

  try {
    const { nfes, falhas, totalArquivos } = await readNFesFromZip(entrada, (done, total) => {
      progressBox.textContent = `Lendo XMLs de NF-e… ${done}/${total}`;
    });
    if (falhas.length) toast(`${falhas.length} arquivo(s) não puderam ser lidos como NF-e.`, 'warn');
    if (nfes.length === 0) { toast(totalArquivos === 0 ? 'Nenhum arquivo .xml encontrado (nem solto, nem dentro de .zip).' : 'Nenhuma NF-e válida encontrada nos arquivos enviados.', 'error'); progressBox.classList.add('hidden'); return; }

    // usa TODAS as NF-es lidas pra casar com os CT-es dessa sessão, se tiver alguma
    // validação carregada agora (mesmo as já vistas antes — isso é só leitura); só a
    // gravação global no banco é que ignora duplicata
    const semFrete = nfes.filter(n => n.vFrete === null || n.vFrete === undefined).length;
    // memória da sessão: vale na hora pro Recalcular, mesmo que a gravação no banco demore/falhe
    STATE._fluxoPorChave = STATE._fluxoPorChave || {};
    const cacheSessao = STATE._nfesCache = STATE._nfesCache || {};
    nfes.forEach(n => {
      if (!n.chave) return;
      if (n.fluxo) STATE._fluxoPorChave[n.chave] = n.obsFluxo || 'FLUXO';
      cacheSessao[n.chave] = { ...(cacheSessao[n.chave] || {}), ...n, fluxo: !!(n.fluxo || (cacheSessao[n.chave] && cacheSessao[n.chave].fluxo)) };
    });
    // casa com as NF-es lidas agora + as já salvas antes (senão, importar só parte das notas
    // "descasaria" os CT-es cujas notas vieram numa importação anterior)
    let nfesParaCasar = nfes;
    if (temValidacaoAtiva) {
      const chavesLote = STATE.ultimaValidacao.resultados.flatMap(r => (r.cte.notasFiscais || []).map(n => n.chave));
      const jaSalvas = await DataLayer.listNfesPorChaves(chavesLote).catch(() => []);
      nfesParaCasar = [...jaSalvas, ...nfes];
    }
    const resumoMatch = temValidacaoAtiva ? enriquecerComNotasFiscais(STATE.ultimaValidacao.resultados, nfesParaCasar) : null;
    // o XML reseta quem não casou — reaplica a planilha como segunda fonte (canal + frete)
    if (temValidacaoAtiva) await aplicarPlanilhaAoLote(STATE.ultimaValidacao).catch(e => console.error(e));

    progressBox.textContent = 'Guardando notas fiscais novas…';
    const chavesExistentesNfe = await DataLayer.chavesExistentes('notasFiscais', nfes.map(n => n.chave)).catch(e => { console.error(e); return new Set(); });
    const nfesNovas = nfes.filter(n => n.chave && !chavesExistentesNfe.has(n.chave));
    const nfesDuplicadas = nfes.length - nfesNovas.length;
    const agoraNfe = new Date().toISOString();
    let gravacaoNfe = null;
    STATE._gravandoNfes = true;
    try {
      gravacaoNfe = await DataLayer.salvarNfesEmLote(nfes.map(n => ({ ...n, arquivoOrigem: nomeLote, importadoEm: agoraNfe })), (feitos, total, falhas) => {
        progressBox.classList.remove('hidden');
        progressBox.textContent = `Gravando as notas no banco… ${feitos}/${total} grupo(s)${falhas ? ` (${falhas} com erro)` : ''} — não feche nem recarregue a página até terminar.`;
      });
    } catch (e) {
      console.error('[NF-e global] falha ao salvar:', e);
      toast(/resource-exhausted|quota/i.test((e.code || '') + e.message) ? mensagemErroFirebase(e, 'salvar todas as notas fiscais') : 'Não foi possível salvar todas as notas: ' + e.message, 'error');
      gravacaoNfe = e.parcial || null;
    } finally {
      STATE._gravandoNfes = false;
    }
    const qtdFluxoLidas = nfes.filter(n => n.fluxo).length;
    const txtGravacao = gravacaoNfe
      ? ` Salvas automaticamente: ${gravacaoNfe.novas} nova(s)${gravacaoNfe.completadas ? `, ${gravacaoNfe.completadas} já existente(s) atualizada(s) com as observações` : ''}${gravacaoNfe.jaExistiam ? `, ${gravacaoNfe.jaExistiam} já estavam salvas` : ''}.`
      : '';
    const numsLidos = nfes.map(n => parseInt(n.nNF, 10)).filter(n => !isNaN(n)).sort((a, b) => a - b);
    const txtFluxo = ` ${qtdFluxoLidas} com "FLUXO" ou "REPOSIÇÃO" nas observações (reposição).${numsLidos.length ? ` Notas lidas: NF ${numsLidos[0]} a ${numsLidos[numsLidos.length - 1]}.` : ''}`;

    let resumoCubagem = null;
    if (temValidacaoAtiva) {
      // se houver planilha de produtos configurada, já recalcula o peso cubado e o valor
      // esperado de cada CT-e que tiver parceiro com fator de cubagem cadastrado
      progressBox.textContent = 'Verificando cubagem dos produtos…';
      const produtosMap = await carregarMapaProdutosAtivo();
      if (produtosMap) resumoCubagem = recalcularComCubagem(STATE.ultimaValidacao.resultados, produtosMap);
    }
    progressBox.classList.add('hidden');

    let msg;
    if (temValidacaoAtiva) {
      msg = `${resumoMatch.casados} de ${resumoMatch.total} CT-es casados com nota fiscal (${nfes.length} NF-e lida(s)${semFrete ? `, ${semFrete} sem vFrete preenchido` : ''}${nfesDuplicadas ? `, ${nfesDuplicadas} já importada(s) antes` : ''}).`;
      if (resumoCubagem && resumoCubagem.recalculados > 0) msg += ` ${resumoCubagem.recalculados} recalculado(s) com peso cubado próprio.`;
      else if (resumoCubagem && resumoCubagem.semFator > 0) msg += ` ${resumoCubagem.semFator} CT-e(s) sem fator de cubagem cadastrado no parceiro.`;
      const qtdRepos = STATE.ultimaValidacao.resultados.filter(r => r.reposicao).length;
      msg += txtGravacao + txtFluxo + (qtdRepos ? ` ${qtdRepos} CT-e(s) deste lote marcado(s) como reposição.` : '');
      renderResultadosValidacao();
      // atualiza o resumo financeiro do lote já salvo no histórico, se houver
      const resumoFinAtualizado = calcularResumoFinanceiro(STATE.ultimaValidacao.resultados, STATE.ultimaValidacao.reentregas || [], STATE.ultimaValidacao.semParceiro || [], STATE.ultimaValidacao.outrosFluxos || []);
      if (STATE.ultimaValidacao.historicoId) {
        // lote já salvo: atualiza o registro inteiro (reposições, frete do cliente, Faturado)
        const vH = STATE.ultimaValidacao;
        DataLayer.substituirValidacao(vH.historicoId, montarRegistroHistorico(vH.nomeArquivo, vH))
          .then(() => { vH._resumoGravado = { ...montarRegistroHistorico(vH.nomeArquivo, vH).resumo }; })
          .catch(e => console.error('[Histórico] falha ao atualizar:', e));
      }
    } else {
      // sem validação carregada agora — só guarda pra casar automaticamente depois,
      // quando algum CT-e referenciando essas NF-es for validado
      msg = `${nfes.length} NF-e(s) lida(s)${semFrete ? ` (${semFrete} sem vFrete preenchido)` : ''}.${txtGravacao}${txtFluxo} Vão casar sozinhas quando você validar os CT-es correspondentes (ou use "Recalcular" num lote aberto pelo Histórico).`;
    }
    toast(msg, gravacaoNfe || (temValidacaoAtiva && resumoMatch.casados > 0) ? 'success' : 'warn');
  } catch (e) {
    console.error(e);
    progressBox.classList.add('hidden');
    toast('Erro ao processar as notas fiscais. Confira se são XMLs (ou .zip) válidos de NF-e.', 'error');
  }
}

async function processarPlanilhaNotas(file, progressBoxId = 'progressNFeBox') {
  const progressBox = $('#' + progressBoxId);
  if (progressBox) { progressBox.classList.remove('hidden'); progressBox.textContent = 'Lendo planilha de notas…'; }
  const esconder = () => progressBox && progressBox.classList.add('hidden');
  try {
    const { notas, linhas, aba, colunasEncontradas } = await lerPlanilhaNotas(file);
    const qtdNotas = Object.keys(notas).length;
    if (!qtdNotas) { esconder(); toast('Nenhuma nota encontrada na planilha (coluna NF vazia?).', 'error'); return; }
    if (!colunasEncontradas.includes('canal') && !colunasEncontradas.includes('frete')) {
      toast('A planilha não tem coluna "Canal" nem "Frete da NF" — só o número da nota foi reconhecido.', 'warn');
    }
    if (progressBox) progressBox.textContent = `Guardando ${qtdNotas} nota(s)…`;
    const { novas, jaExistiam } = await DataLayer.salvarPlanilhaNotas(notas, file.name);

    let msg = `Planilha "${aba}": ${linhas} linha(s), ${qtdNotas} nota(s) — ${novas} nova(s) salva(s)${jaExistiam ? `, ${jaExistiam} já importada(s) antes (mantido o primeiro registro)` : ''}.`;
    const v = STATE.ultimaValidacao;
    if (v && v.resultados?.length) {
      if (progressBox) progressBox.textContent = 'Casando com os CT-es do lote aberto…';
      // usa o que acabou de ser lido + o que já estava salvo (inclusive notas já importadas antes)
      const todos = [...v.resultados, ...(v.reentregas || []), ...(v.outrosFluxos || [])];
      const r1 = aplicarPlanilhaNosItens(todos, notas);
      const r2 = await aplicarPlanilhaAoLote(v);
      const produtosMap = await carregarMapaProdutosAtivo().catch(() => null);
      if (produtosMap) recalcularComCubagem(v.resultados, produtosMap);
      renderResultadosValidacao();
      if (v.historicoId) {
        DataLayer.substituirValidacao(v.historicoId, montarRegistroHistorico(v.nomeArquivo, v)).catch(e => console.error('[Histórico] falha ao atualizar:', e));
      }
      msg += ` ${Math.max(r1.comCanal, r2.comCanal)} CT-e(s) do lote aberto com canal identificado.`;
    } else {
      msg += ' Vão casar sozinhas quando os CT-es dessas notas forem validados.';
    }
    esconder();
    toast(msg, novas > 0 || (v && v.resultados?.length) ? 'success' : 'warn');
  } catch (e) {
    console.error(e);
    esconder();
    toast('Erro ao ler a planilha de notas: ' + (e.message || e), 'error');
  }
}

// Separa o que é planilha (.xlsx/.xls/.csv) do que é XML/.zip de NF-e e manda cada um pro lugar certo
function processarArquivosNotas(arquivos, progressBoxId) {
  const planilhas = arquivos.filter(f => /\.(xlsx|xls|xlsm|csv)$/i.test(f.name));
  const xmls = arquivos.filter(f => !/\.(xlsx|xls|xlsm|csv)$/i.test(f.name));
  (async () => {
    if (xmls.length) await processarNotasFiscais(xmls, progressBoxId);
    for (const pl of planilhas) await processarPlanilhaNotas(pl, progressBoxId);
  })();
}

            <div class="text-xl font-bold num text-emerald-700">${fmtBRL(Math.abs(r.ajusteSemErro))}</div>

// CT-e analisado como "Sem erro": a diferença (e a margem do cliente) contam como ZERO nos
// cards e na tabela — a diferença original continua no detalhe/tooltip só como referência.
function analisadoSemErro(r) {
  const rev = r && r.cte && STATE.revisoes ? STATE.revisoes[r.cte.chave] : null;
  return !!(rev && rev.classificacao === 'sem_erro');
}
function divergenciaEfetiva(r) { return analisadoSemErro(r) && r.divergencia !== null && r.divergencia !== undefined ? 0 : r.divergencia; }
function margemClienteEfetiva(r) { if (ehReposicao(r)) return r.divergenciaCliente; return analisadoSemErro(r) && r.divergenciaCliente !== null && r.divergenciaCliente !== undefined ? 0 : r.divergenciaCliente; }

// ----- Filtros da tela de resultados (canal, parceiro, UF, busca livre) -----
function normBusca(s) { return (s ?? '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase(); }
function passaFiltrosResultado(x, f, ehSemParceiro) {
  const cte = ehSemParceiro ? x : x.cte;
  const parceiroNome = ehSemParceiro ? null : x.parceiro?.nome;
  const canal = ehSemParceiro ? null : (x.canal || null);
  if (f.canal) { if (f.canal === '__sem__' ? !!canal : canal !== f.canal) return false; }
  if (f.parceiro && parceiroNome !== f.parceiro) return false;
  if (f.uf && (cte.destUF || '') !== f.uf) return false;
  if (f.busca) {
    const alvo = normBusca([cte.nCT, cte.destMun, cte.destUF, ...(cte.notasFiscais || []).map(n => n.numero), x.pedido, canal, parceiroNome, ehSemParceiro ? cte.emitNome : ''].join(' '));
    if (!normBusca(f.busca).trim().split(/\s+/).every(t => alvo.includes(t))) return false;
  }
  return true;
}
function filtrarLote(v, f) {
  const ativo = !!(f.canal || f.parceiro || f.uf || f.busca);
  if (!ativo) return { resultados: v.resultados, semParceiro: v.semParceiro || [], outrosFluxos: v.outrosFluxos || [], reentregas: v.reentregas || [], ativo };
  return {
    ativo,
    resultados: v.resultados.filter(x => passaFiltrosResultado(x, f, false)),
    outrosFluxos: (v.outrosFluxos || []).filter(x => passaFiltrosResultado(x, f, false)),
    reentregas: (v.reentregas || []).filter(x => passaFiltrosResultado(x, f, false)),
    // sem parceiro não tem canal nem parceiro — some quando esses filtros estão ligados
    semParceiro: (f.canal || f.parceiro) ? [] : (v.semParceiro || []).filter(x => passaFiltrosResultado(x, f, true)),
  };
}
function renderBarraFiltros(v, f, qtdFiltrada, qtdTotal) {
  const itens = [...v.resultados, ...(v.reentregas || []), ...(v.outrosFluxos || [])];
  const canais = Array.from(new Set(itens.map(x => x.canal).filter(Boolean))).sort();
  const temSemCanal = itens.some(x => !x.canal);
  const parceiros = Array.from(new Set(itens.map(x => x.parceiro?.nome).filter(Boolean))).sort();
  const ufs = Array.from(new Set([...itens.map(x => x.cte.destUF), ...(v.semParceiro || []).map(c => c.destUF)].filter(Boolean))).sort();
  const opt = (val, label, atual) => `<option value="${escapeHtml(val)}" ${atual === val ? 'selected' : ''}>${escapeHtml(label)}</option>`;
  const ativo = !!(f.canal || f.parceiro || f.uf || f.busca);
  return `
    <div class="mb-4 bg-white rounded-2xl border border-ink-100 px-4 py-3 flex flex-wrap items-center gap-3 text-xs">
      <span class="font-semibold text-ink-500 uppercase tracking-wide text-[11px]">Filtros</span>
      <select data-filtro-res="canal" class="border border-ink-200 rounded-lg px-2 py-1.5 max-w-[200px]">
        ${opt('', 'Todos os canais', f.canal || '')}
        ${canais.map(c => opt(c, c, f.canal)).join('')}
        ${temSemCanal ? opt('__sem__', 'Sem canal identificado', f.canal) : ''}
      </select>
      <select data-filtro-res="parceiro" class="border border-ink-200 rounded-lg px-2 py-1.5 max-w-[200px]">
        ${opt('', 'Todos os parceiros', f.parceiro || '')}
        ${parceiros.map(c => opt(c, c, f.parceiro)).join('')}
      </select>
      <select data-filtro-res="uf" class="border border-ink-200 rounded-lg px-2 py-1.5">
        ${opt('', 'Todas as UFs', f.uf || '')}
        ${ufs.map(c => opt(c, c, f.uf)).join('')}
      </select>
      <input id="filtroBuscaRes" value="${escapeHtml(f.busca || '')}" placeholder="Buscar CT-e, NF, pedido, cidade…" class="border border-ink-200 rounded-lg px-2.5 py-1.5 w-56">
      ${ativo ? `<button id="btnLimparFiltrosRes" class="text-brand-600 hover:text-brand-700 font-medium">Limpar filtros</button>` : ''}
      <span class="ml-auto text-ink-400">${ativo ? `Mostrando <strong class="text-ink-700">${qtdFiltrada}</strong> de ${qtdTotal} CT-e(s)` : `${qtdTotal} CT-e(s) no lote`}${canais.length === 0 ? ' · importe a planilha de notas (Excel) pra identificar o canal' : ''}</span>
    </div>`;
}

function renderResultadosValidacao() {
  const vAtual = STATE.ultimaValidacao;
  const { nomeArquivo, duplicadosIgnorados = 0 } = vAtual;
  STATE._filtrosRes = STATE._filtrosRes || {};
  const filtrosRes = STATE._filtrosRes;
  const { resultados, semParceiro, outrosFluxos, reentregas } = filtrarLote(vAtual, filtrosRes);
  const qtdTotalLote = vAtual.resultados.length + (vAtual.semParceiro || []).length + (vAtual.outrosFluxos || []).length + (vAtual.reentregas || []).length;
  const qtdFiltrada = resultados.length + semParceiro.length + outrosFluxos.length + reentregas.length;
  const cobradoFiltrado = resultados.reduce((a, r) => a + (r.cobrado || 0), 0) + reentregas.reduce((a, x) => a + (x.cte.vTPrest || 0), 0) + outrosFluxos.reduce((a, x) => a + (x.cte.vTPrest || 0), 0) + semParceiro.reduce((a, c) => a + (c.vTPrest || 0), 0);
  const tol = 0.05;
  // devolução/reversa tem aba própria (prejuízo total) — não conta em nenhuma outra, pra
  // não aparecer duplicada em "cobrado a maior/menor" etc. (reentrega já nem entra em
  // "resultados", então nunca aparecia nessas abas mesmo)
  const maior = resultados.filter(r => !ehPrejuizoTotal(r) && divergenciaEfetiva(r) !== null && divergenciaEfetiva(r) > tol);
  const menor = resultados.filter(r => !ehPrejuizoTotal(r) && divergenciaEfetiva(r) !== null && divergenciaEfetiva(r) < -tol);
  const revisao = resultados.filter(r => !ehPrejuizoTotal(r) && (r.calc.status === 'REVISAO_MANUAL' || r.calc.status === 'SEM_TARIFA' || r.calc.status === 'SEM_ABRANGENCIA'));
  const ok = resultados.filter(r => !ehPrejuizoTotal(r) && divergenciaEfetiva(r) !== null && Math.abs(divergenciaEfetiva(r)) <= tol && (r.calc.status === 'OK' || analisadoSemErro(r)));
  const devolucoes = resultados.filter(r => r.tipoOperacao === 'devolucao');
  const reposicoes = resultados.filter(ehReposicao);
  const nfeImportada = resultados.some(r => r.valorFreteCliente !== undefined);
  const margemNegativa = resultados.filter(r => !ehPrejuizoTotal(r) && margemClienteEfetiva(r) !== null && margemClienteEfetiva(r) !== undefined && margemClienteEfetiva(r) < -tol);
  const comNfe = resultados.filter(r => r.valorFreteCliente !== null && r.valorFreteCliente !== undefined);
  const resumoFin = calcularResumoFinanceiro(resultados, reentregas, semParceiro, outrosFluxos);

  STATE._filtroAtual = STATE._filtroAtual || 'todos';

  const box = $('#resultadosBox');
  box.innerHTML = `
    <div class="flex items-center justify-between mb-4">
      <div class="text-sm text-ink-500">
        <span class="font-medium text-ink-800">${escapeHtml(nomeArquivo)}</span> ·

      </div>
      <div class="flex items-center gap-4">
        ${vAtual.historicoId
          ? `<span class="text-sm font-medium text-emerald-700 flex items-center gap-1" title="Esta validação está no Histórico — análises, notas e recálculos feitos agora atualizam o registro salvo">✓ Salvo no Histórico${vAtual.numeroFatura ? ` · fatura <strong>${escapeHtml(vAtual.numeroFatura)}</strong>` : ''}</span>`

        <button id="btnImportarNFe" class="text-sm font-medium text-ink-600 hover:text-ink-800 flex items-center gap-1.5">

        </button>
        <input type="file" id="fileNFe" accept=".zip,.xml,.xlsx,.xls,.csv" multiple class="hidden">
        <input type="file" id="folderNFeRes" webkitdirectory directory multiple class="hidden">

        <button id="btnRecalcular" title="Refaz o cálculo deste lote com o cadastro atual dos parceiros (tabelas, taxas, abrangência) e atualiza o Histórico — sem precisar subir os XMLs de novo" class="text-sm font-medium text-ink-600 hover:text-ink-800">Recalcular com cadastro atual</button>
        <button id="btnExportar" class="text-sm font-medium text-brand-600 hover:text-brand-700 flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H8a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          Exportar Excel

      </div>
    </div>
    <div id="progressNFeBox" class="hidden mb-4 bg-white rounded-xl border border-ink-100 p-3 text-xs text-ink-500"></div>

    ${(() => {
      const semObs = vAtual.resultados.filter(r => r.notaSemObs && !r.reposicao);
      if (!semObs.length) return '';
      const nums = Array.from(new Set(semObs.flatMap(r => (r.cte.notasFiscais || []).map(n => n.numero)))).sort((a, b) => a - b);
      STATE._nfsSemObs = nums;

    })()}

    ${renderBarraFiltros(vAtual, filtrosRes, qtdFiltrada, qtdTotalLote)}

    ${renderResumoFinanceiro(resumoFin)}

    <div class="grid grid-cols-5 gap-3 mb-3">
      ${filtroCard('todos', 'Todos os CT-es', qtdFiltrada, fmtBRL(cobradoFiltrado) + ' cobrado', 'ink')}
      ${filtroCard('maior', 'Cobrado a maior', maior.length, fmtBRL(maior.reduce((a,r)=>a+divergenciaEfetiva(r),0)), 'red')}
      ${filtroCard('menor', 'Cobrado a menor', menor.length, fmtBRL(menor.reduce((a,r)=>a+divergenciaEfetiva(r),0)), 'amber')}
      ${filtroCard('ok', 'Conferem / analisados sem erro', ok.length, (() => { const q = resultados.filter(analisadoSemErro).length; return q ? `${q} analisado(s) sem erro` : ''; })(), 'emerald')}
      ${filtroCard('revisao', 'Revisão manual / sem cobertura', revisao.length, '', 'ink')}
    </div>
    <div class="grid ${nfeImportada ? 'grid-cols-4' : 'grid-cols-3'} gap-3 mb-5">
      ${filtroCard('devolucao', 'Devolução (prejuízo total)', devolucoes.length, fmtBRL(devolucoes.reduce((a,r)=>a+(r.cobrado||0),0)), 'brand')}
      ${filtroCard('reposicao', 'Reposição (prejuízo total)', reposicoes.length, fmtBRL(reposicoes.reduce((a,r)=>a+(r.cobrado||0),0)), 'amber')}
      ${filtroCard('reentrega', 'Reentrega (prejuízo total)', reentregas.length, fmtBRL(reentregas.reduce((a,x)=>a+(x.cte.vTPrest||0),0)), 'purple')}
      ${nfeImportada ? filtroCard('margem_negativa', 'Cliente pagou menos que o frete', margemNegativa.length, fmtBRL(margemNegativa.reduce((a,r)=>a+margemClienteEfetiva(r),0)), 'red') : ''}
    </div>

    <div id="tabelaResultados"></div>

    ${outrosFluxos.length ? `
      <div class="mt-6 bg-blue-50 border border-blue-200 rounded-2xl p-5">
        <div class="text-sm font-semibold text-blue-800 mb-1">${outrosFluxos.length} CT-e(s) com trajeto atípico — fora da validação</div>
        <p class="text-xs text-blue-700 mb-3">Esses CT-es não saem nem voltam pra origem cadastrada do parceiro (não é um envio normal nem uma devolução reconhecível) — não dá pra saber qual tabela usar, então ficam de fora do cálculo. Listados aqui só pra controle.</p>
        <div class="text-xs">${renderGrupoForaFluxo('Trajeto atípico', outrosFluxos, 'ink')}</div>
      </div>
    ` : ''}

    ${semParceiro.length ? `
      <div class="mt-6 bg-amber-50 border border-amber-200 rounded-2xl p-5">
        <div class="text-sm font-semibold text-amber-800 mb-2">${semParceiro.length} CT-e(s) de emitente não cadastrado</div>
        <p class="text-xs text-amber-700 mb-3">Não conseguimos casar estes CT-es a nenhum parceiro (nome do emitente não bate com nenhum parceiro cadastrado).</p>
        <div class="text-xs text-amber-800 space-y-1 max-h-32 overflow-y-auto">
          ${Array.from(new Set(semParceiro.map(c => `${c.emitNome} · ${fmtCNPJ(c.emitCNPJ)}`))).map(s => `<div>• ${escapeHtml(s)}</div>`).join('')}
        </div>
      </div>
    ` : ''}
  `;

  $$('[data-filtro-res]').forEach(sel => sel.addEventListener('change', () => {
    STATE._filtrosRes[sel.dataset.filtroRes] = sel.value;
    renderResultadosValidacao();
  }));
  const inpBusca = $('#filtroBuscaRes');
  if (inpBusca) {
    if (STATE._focarBuscaRes) {
      inpBusca.focus(); const L = inpBusca.value.length; inpBusca.setSelectionRange(L, L);
      STATE._focarBuscaRes = false;
    }
    inpBusca.addEventListener('input', () => {
      clearTimeout(STATE._timerBuscaRes);
      STATE._timerBuscaRes = setTimeout(() => { STATE._filtrosRes.busca = inpBusca.value; STATE._focarBuscaRes = true; renderResultadosValidacao(); }, 350);
    });
  }
  const btnLimpar = $('#btnLimparFiltrosRes');
  if (btnLimpar) btnLimpar.addEventListener('click', () => { STATE._filtrosRes = {}; renderResultadosValidacao(); });

  $('#btnRecalcular').addEventListener('click', recalcularLoteAtual);
  const btnCopiarNfs = $('#btnCopiarNfsSemObs');
  if (btnCopiarNfs) btnCopiarNfs.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText((STATE._nfsSemObs || []).join('\n')); toast(`${(STATE._nfsSemObs || []).length} número(s) de NF copiado(s).`, 'success'); }
    catch (e) { toast('Não consegui copiar — veja a lista no console (F12).', 'warn'); console.log((STATE._nfsSemObs || []).join('\n')); }
  });
  const btnSalvarVal = $('#btnSalvarValidacao');
  if (btnSalvarVal) btnSalvarVal.addEventListener('click', salvarValidacaoAtual);
  const inpFatura = $('#numeroFatura');
  if (inpFatura) {
    inpFatura.addEventListener('input', () => {
      vAtual.numeroFatura = inpFatura.value.trim();
      inpFatura.classList.toggle('border-amber-300', !vAtual.numeroFatura);
      inpFatura.classList.toggle('bg-amber-50/50', !vAtual.numeroFatura);
      inpFatura.classList.remove('ring-2', 'ring-red-300');
    });
    inpFatura.addEventListener('keydown', (e) => { if (e.key === 'Enter') salvarValidacaoAtual(); });
  }
  $('#btnExportar').addEventListener('click', () => {
    const blob = exportResultadosParaXlsx(resultados, semParceiro, STATE.parceiros, outrosFluxos, reentregas);
    downloadBlob(blob, `Validacao_Fretes_${String(nomeArquivo).replace(/\.zip$/i,'').replace(/[\\/:*?"<>|]+/g,'_')}.xlsx`);
  });

  $('#btnImportarNFe').addEventListener('click', () => $('#fileNFe').click());
  $('#btnImportarNFePasta').addEventListener('click', () => $('#folderNFeRes').click());
  ['#fileNFe', '#folderNFeRes'].forEach(sel => $(sel).addEventListener('change', (e) => {
    const arquivos = Array.from(e.target.files || []);
    e.target.value = '';
    if (arquivos.length) processarArquivosNotas(arquivos, 'progressNFeBox');
  }));

  $$('.filtro-card').forEach(c => c.addEventListener('click', () => {
    STATE._filtroAtual = c.dataset.filtro;
    renderResultadosValidacao();
  }));

  const grupos = { todos: resultados, maior, menor, ok, revisao, devolucao: devolucoes, reposicao: reposicoes, margem_negativa: margemNegativa };
  if (STATE._filtroAtual === 'reentrega') {
    renderTabelaInformativa(reentregas, 'reentrega');
  } else {
    renderTabelaResultados(grupos[STATE._filtroAtual] || resultados, STATE._filtroAtual);
    if (STATE._filtroAtual === 'todos' && (reentregas.length || outrosFluxos.length || semParceiro.length)) {
      $('#tabelaResultados').insertAdjacentHTML('beforeend', `<p class="text-xs text-ink-400 mt-2">A lista acima tem os ${resultados.length} CT-e(s) calculados (saídas e devoluções). ${[reentregas.length ? `${reentregas.length} reentrega(s) no card "Reentrega"` : '', outrosFluxos.length ? `${outrosFluxos.length} trajeto(s) atípico(s)` : '', semParceiro.length ? `${semParceiro.length} sem parceiro cadastrado` : ''].filter(Boolean).join(', ')} também estão no total do card e listados nas seções próprias.</p>`);
    }
  }
}

// Tabela pra categorias sem cálculo (hoje só reentrega) — mostra só o cobrado, com um
// aviso explicando por que não tem coluna de calculado/divergência.
function renderTabelaInformativa(lista, tipo) {
  const el = $('#tabelaResultados');
  if (lista.length === 0) {
    el.innerHTML = emptyState('Nada por aqui', 'Nenhum CT-e nesta categoria.');
    return;
  }
  const total = lista.reduce((a, x) => a + (x.cte.vTPrest || 0), 0);
  el.innerHTML = `
    <div class="mb-4 text-xs px-3 py-2.5 rounded-lg bg-purple-50 text-purple-800 border border-purple-200">
      <strong>Reentrega é prejuízo direto, igual devolução</strong> — o Grupo TBX paga essa tentativa extra de entrega do próprio bolso, sem repasse pro cliente. Não existe tabela pra reentrega, então não calculamos valor esperado — o que importa aqui é o <strong>valor total cobrado</strong>, que já é o prejuízo em si. Total: <strong>${fmtBRL(total)}</strong>.
    </div>
    <div class="bg-white rounded-2xl shadow-panel border border-ink-100 overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-ink-50 text-ink-500 text-[11px] uppercase tracking-wide">
            <th class="text-left font-semibold px-4 py-3">CT-e</th>
            <th class="text-left font-semibold px-4 py-3">Emissão</th>
            <th class="text-left font-semibold px-4 py-3">Parceiro</th>
            <th class="text-left font-semibold px-4 py-3">Destino</th>
            <th class="text-right font-semibold px-4 py-3">Cobrado</th>
            <th class="text-right font-semibold px-4 py-3">Prejuízo (total cobrado)</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-ink-100">
          ${lista.slice(0, 300).map(x => `
            <tr class="hover:bg-ink-50/60">
              <td class="px-4 py-3 num text-ink-700">${escapeHtml(x.cte.nCT || '—')}</td>
              <td class="px-4 py-3 num text-ink-500 text-xs whitespace-nowrap">${fmtDia(x.cte.dhEmi)}</td>
              <td class="px-4 py-3 text-ink-700">${escapeHtml(x.parceiro.nome)}${x.canal ? ` <span class="text-[11px] text-ink-400">· ${escapeHtml(x.canal)}</span>` : ''}</td>
              <td class="px-4 py-3 text-ink-600">${escapeHtml(x.cte.destMun)} <span class="text-ink-300">/</span> ${escapeHtml(x.cte.destUF)}</td>
              <td class="px-4 py-3 text-right num text-ink-700">${fmtBRL(x.cte.vTPrest)}</td>
              <td class="px-4 py-3 text-right num font-semibold text-purple-700">${fmtBRL(x.cte.vTPrest)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderGrupoForaFluxo(titulo, lista, cor) {
  const cores = { blue:'text-blue-700 bg-blue-100', purple:'text-purple-700 bg-purple-100', ink:'text-ink-600 bg-ink-100' };
  return `
    <div>
      <div class="font-semibold ${cores[cor]?.split(' ')[0] || 'text-ink-700'} mb-1">${titulo} <span class="${cores[cor] || 'text-ink-600 bg-ink-100'} rounded-full px-1.5 py-0.5 text-[10px] font-bold">${lista.length}</span></div>
      <div class="space-y-0.5 max-h-28 overflow-y-auto text-blue-900/80">
        ${lista.length === 0 ? '<div class="text-ink-300 italic">nenhum</div>' : lista.map(x => `<div>• CT-e ${escapeHtml(x.cte.nCT)} — ${escapeHtml(x.cte.xMunIni)}/${escapeHtml(x.cte.UFIni)} → ${escapeHtml(x.cte.xMunFim)}/${escapeHtml(x.cte.UFFim)} (${fmtBRL(x.cte.vTPrest)})</div>`).join('')}
      </div>
    </div>`;
}

function filtroCard(key, label, count, sub, color) {
  const active = STATE._filtroAtual === key;
  const colorMap = { red:'text-red-600 bg-red-50 border-red-200', amber:'text-amber-700 bg-amber-50 border-amber-200', emerald:'text-emerald-700 bg-emerald-50 border-emerald-200', ink:'text-ink-600 bg-ink-50 border-ink-200', brand:'text-brand-700 bg-brand-50 border-brand-200', purple:'text-purple-700 bg-purple-50 border-purple-200' };
  const ringMap = { red:'red-300', amber:'amber-300', emerald:'emerald-300', ink:'ink-300', brand:'brand-300', purple:'purple-300' };
  return `
    <button data-filtro="${key}" class="filtro-card text-left rounded-2xl border p-4 transition-all ${active ? colorMap[color] + ' ring-2 ring-offset-1 ring-' + (ringMap[color] || 'ink-300') : 'bg-white border-ink-100 hover:border-ink-200'}">
      <div class="text-xs text-ink-400 font-medium mb-1">${label}</div>
      <div class="text-xl font-bold num ${active ? '' : 'text-ink-800'}">${count}</div>
      ${sub ? `<div class="text-[11px] mt-0.5 num opacity-80">${sub}</div>` : ''}
    </button>
  `;
}

const LABEL_CLASSIFICACAO = {
  plataforma: { label: 'Plataforma', cls: 'bg-purple-50 text-purple-700 border-purple-200' },
  intelipost: { label: 'Intelipost', cls: 'bg-blue-50 text-blue-700 border-blue-200' },
  tabela: { label: 'Tabela', cls: 'bg-amber-50 text-amber-700 border-amber-200' },
  transportadora: { label: 'Transportadora', cls: 'bg-red-50 text-red-700 border-red-200' },
  sem_erro: { label: 'Sem erro', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
};
function badgeAnalise(r) {
  const revisao = STATE.revisoes[r.cte.chave];
  if (!revisao || !revisao.classificacao) return '';
  const info = LABEL_CLASSIFICACAO[revisao.classificacao];
  if (!info) return '';
  const quando = revisao.atualizadoEm ? ` em ${fmtDate(revisao.atualizadoEm)}` : '';
  const extra = revisao.classificacao === 'sem_erro' && revisao.diferencaApurada ? ` — diferença original ${fmtBRL(revisao.diferencaApurada)} considerada R$ 0,00` : '';
  return ` <span title="Analisado${quando} por ${escapeHtml(revisao.atualizadoPor || '—')}: ${escapeHtml(info.label)}${extra}" class="text-[11px] font-medium px-1.5 py-0.5 rounded-full border ${info.cls}">✓ ${info.label}</span>`;
}

function statusBadge(status) {
  const map = {
    OK: { label:'Confere', cls:'bg-emerald-50 text-emerald-700 border-emerald-200' },
    REVISAO_MANUAL: { label:'Revisão manual', cls:'bg-amber-50 text-amber-700 border-amber-200' },
    SEM_TARIFA: { label:'Sem tarifa p/ região', cls:'bg-ink-100 text-ink-600 border-ink-200' },
    SEM_ABRANGENCIA: { label:'CEP fora da abrangência', cls:'bg-ink-100 text-ink-600 border-ink-200' },
  };
  const s = map[status] || map.OK;
  return `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full border ${s.cls}">${s.label}</span>`;
}

function renderTabelaResultados(lista, filtro) {
  const el = $('#tabelaResultados');
  if (lista.length === 0) {
    el.innerHTML = emptyState('Nada por aqui', 'Nenhum CT-e nesta categoria.');
    return;
  }
  const ehDevolucao = filtro === 'devolucao' || filtro === 'reposicao';
  const mostrarDivergencia = filtro === 'maior' || filtro === 'menor' || ehDevolucao || filtro === 'todos';
  const mostrarCanal = [...(STATE.ultimaValidacao?.resultados || []), ...(STATE.ultimaValidacao?.reentregas || [])].some(x => x.canal);
  const mostrarMargem = filtro === 'margem_negativa' || lista.some(r => r.valorFreteCliente !== null && r.valorFreteCliente !== undefined);
  const nfsTxt = (r) => (r.cte.notasFiscais || []).map(n => n.numero).join(', ') || '—';
  const bannerDevolucao = filtro === 'reposicao' ? `
    <div class="mb-4 text-xs px-3 py-2.5 rounded-lg bg-amber-50 text-amber-800 border border-amber-200">
      <strong>Reposição é prejuízo direto, igual devolução</strong> — a nota fiscal do cliente tem "FLUXO" ou "REPOSIÇÃO" (em qualquer grafia) nas observações — produto reenviado por conta da TBX. O cliente não paga esse frete, então a coluna "Prejuízo" mostra o <strong>valor total cobrado</strong> pela transportadora e ele não entra no "Cliente pagou" do Faturado. O cálculo contra a tabela continua disponível em "Detalhes".
    </div>` : ehDevolucao ? `
    <div class="mb-4 text-xs px-3 py-2.5 rounded-lg bg-brand-50 text-brand-800 border border-brand-200">
      <strong>Devolução/reversa é prejuízo direto</strong> — o Grupo TBX paga esse frete do próprio bolso, sem repasse pro cliente. Por isso, a coluna "Prejuízo" abaixo mostra o <strong>valor total cobrado</strong> pela transportadora, não a diferença contra a tabela. O "Calculado" continua útil só pra conferir se a transportadora está cobrando certo (e não a mais) — não é o valor do prejuízo em si.
    </div>` : '';
  const sel = selecionadosSet();
  const barraMassa = `
    <div id="barraMassa" class="mb-3 bg-white rounded-2xl border border-ink-100 ring-brand-300 px-4 py-2.5 flex flex-wrap items-center gap-3 text-xs">
      <span class="text-ink-500"><strong id="qtdSelecionados" class="text-ink-800">${sel.size}</strong> selecionado(s)</span>
      <select id="selMassaClassificacao" class="border border-ink-200 rounded-lg px-2 py-1.5 max-w-[300px]">
        <option value="">Classificar como…</option>
        ${CLASSIFICACOES_DIVERGENCIA.map(c => `<option value="${c.valor}">${c.label}</option>`).join('')}
      </select>
      <input id="obsMassa" placeholder="Observação (opcional — vazio mantém a de cada CT-e)" class="border border-ink-200 rounded-lg px-2.5 py-1.5 flex-1 min-w-[220px]">
      <button id="btnAplicarMassa" ${sel.size ? '' : 'disabled'} class="bg-ink-900 hover:bg-ink-800 disabled:opacity-40 text-white font-medium rounded-lg px-3 py-1.5">Aplicar aos selecionados</button>
      <button id="btnLimparSelecao" class="text-ink-500 hover:text-ink-700">Limpar seleção</button>
      ${(() => {
        const rasc = (STATE.parceiros || []).filter(p => p.rascunho);
        if (!rasc.length) return '';
        return `<span class="w-full"></span>
          <span class="text-ink-500">Calcular os selecionados com:</span>

// Nomes que, na prática do setor de transporte, significam a mesma taxa mas aparecem
// escritos de formas totalmente diferentes (sem nenhuma palavra em comum) — por isso não
// bastam as tentativas de "nome igual" ou "um contém o outro". Ex: "ADV" e "FRETE VALOR"
// são a mesma coisa (ad valorem), mas nenhuma tentativa anterior enxerga isso sozinha.
const GRUPOS_SINONIMOS_COMPONENTE = [
  ['ADV', 'FRETE VALOR', 'AD VALOREM', 'ADVALOREM', 'AD-VALOREM'],
  ['TDA', 'ENTREGA', 'DIFICIL ACESSO', 'TAXA DE DIFICIL ACESSO', 'TAXA DIFICIL ACESSO'],
  ['TDE', 'TAXA DE DIFICIL ENTREGA', 'TAXA DIFICIL ENTREGA', 'DIFICIL ENTREGA'],
  ['DESPACHO', 'TAXA DE DESPACHO', 'TX DESPACHO', 'TAXA DESPACHO'],
  ['TAS', 'TAXA ADICIONAL DE SERVICO', 'TAXA ADICIONAL SERVICO'],
  ['TEC', 'TAXA EMERGENCIAL', 'TAXA EMERGENCIAL DE COMBUSTIVEL'],
  ['GRIS', 'GERENCIAMENTO DE RISCO'],
  ['PEDAGIO', 'VALE PEDAGIO'],
];
function encontrarGrupoSinonimo(nomeNormalizado) {
  return GRUPOS_SINONIMOS_COMPONENTE.find(g =>
    g.some(termo => nomeNormalizado.includes(termo) || termo.includes(nomeNormalizado))
  );
}

// Procura o valor cobrado de uma regra dentro dos componentes (Comp) do XML do CT-e.
// 1ª tentativa: nome igual (ignorando acento/caixa/espaço). 2ª tentativa: um nome contém
// o outro (ex: regra "PEDÁGIO" casa com componente do XML "PEDAGIO FRACAO 100KG").
// 3ª tentativa: grupo de sinônimos conhecidos do setor (ex: "ADV" casa com "FRETE VALOR").
// Isso é necessário porque cada transportadora descreve a mesma taxa com um texto diferente
// no XML, que não necessariamente é igual ao nome usado na tabela negociada.
function encontrarComponenteCobrado(cte, nomeRegra) {
  const alvo = normalizaNomeComponente(nomeRegra);
  if (!alvo || !cte.comps) return { valor: undefined, nomeXml: null, tipo: null };
  if (cte.comps[alvo] !== undefined) return { valor: cte.comps[alvo], nomeXml: nomeRegra, tipo: 'exato' };
  for (const c of (cte.compsBrutos || [])) {
    const nx = normalizaNomeComponente(c.nome);
    if (nx.includes(alvo) || alvo.includes(nx)) {
      return { valor: c.valor, nomeXml: c.nome, tipo: 'aproximado' };
    }
  }
  const grupo = encontrarGrupoSinonimo(alvo);
  if (grupo) {
    for (const c of (cte.compsBrutos || [])) {
      const nx = normalizaNomeComponente(c.nome);
      if (grupo.some(termo => nx.includes(termo) || termo.includes(nx))) {
        return { valor: c.valor, nomeXml: c.nome, tipo: 'sinonimo' };
      }
    }
  }
  return { valor: undefined, nomeXml: null, tipo: null };
}

// Verifica se sobrou alguma cobrança no XML que nenhuma regra cadastrada reconheceu.
// O componente de imposto (ICMS repassado) nunca precisa de regra própria — ele é
// identificado pelo valor batendo com o vICMS declarado no XML e sempre excluído da
// lista de pendências, mesmo quando outras cobranças reais também ficaram de fora.
function calcularReconciliacaoXml(r) {
  const nomesCasados = new Set();
  r.calc.componentes.forEach(c => {
    const achado = encontrarComponenteCobrado(r.cte, c.nome);
    if (achado.valor !== undefined) nomesCasados.add(normalizaNomeComponente(achado.nomeXml));
  });
  let residuais = (r.cte.compsBrutos || []).filter(c => !nomesCasados.has(normalizaNomeComponente(c.nome)));

  const vICMS = r.cte.vICMS;
  let componenteImposto = null;
  if (vICMS !== null && vICMS !== undefined) {
    const i = residuais.findIndex(c => Math.abs((c.valor || 0) - vICMS) <= 0.05);
    if (i >= 0) { componenteImposto = residuais[i]; residuais = residuais.filter((_, idx) => idx !== i); }
  }

  const somaResidual = residuais.reduce((a, c) => a + (c.valor || 0), 0);
  return { residuais, somaResidual, componenteImposto, temPendencia: residuais.length > 0 };
}
