function initFirebase() {
  if (!FIREBASE_READY) {
    OFFLINE_MODE = true;
    console.warn('[Validador de Fretes] Firebase não configurado — rodando em modo local (sem login, sem sincronização entre usuários). Edite FIREBASE_CONFIG no topo do app.js.');
    return;
  }
  app = firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();
  // cache local no navegador: ao recarregar a página (ou abrir outra aba) em até 30 min,
  // o Firebase só cobra os documentos que MUDARAM, não a coleção inteira de novo
  try { db.enablePersistence({ synchronizeTabs: true }).catch(e => console.warn('[Firebase] cache local indisponível:', e.code || e)); }
  catch (e) { console.warn('[Firebase] cache local indisponível:', e); }
}

// ---------------------------------------------------------------------
// 5b. SINCRONIZAÇÃO EM TEMPO REAL (economia de leituras)
//     Parceiros, análises e a lista do Histórico ficam "assinados": a primeira carga lê os
//     documentos uma vez, e depois o Firebase só manda (e só cobra) o que mudou. Antes, cada
//     visita ao Painel/Análises/Histórico relia tudo de novo — cada análise era uma leitura
//     a cada clique de tela.
// ---------------------------------------------------------------------
const SYNC = { unsubs: [], prontos: {}, dados: {}, falhou: {} };
function iniciarSincronizacao() {
  if (OFFLINE_MODE || SYNC.unsubs.length) return;
  const assinar = (nome, query, mapear) => {
    SYNC.prontos[nome] = new Promise((resolve) => {
      let resolvido = false;
      const pronto = () => { if (!resolvido) { resolvido = true; resolve(); } };
      setTimeout(pronto, 8000); // sem resposta do servidor (offline) — segue com o que tiver em cache
      const unsub = query.onSnapshot({ includeMetadataChanges: false }, snap => {
        SYNC.dados[nome] = mapear(snap);
        SYNC.falhou[nome] = false;
        if (!snap.metadata.fromCache) pronto();
        else if (snap.size > 0) setTimeout(pronto, 1500); // cache local: dá um tempinho pro servidor confirmar
        aoMudarDadosSincronizados(nome);
      }, err => {
        console.error(`[Sync ${nome}]`, err);
        SYNC.falhou[nome] = true;
        pronto();
      });
      SYNC.unsubs.push(unsub);
    });
  };
  assinar('parceiros', db.collection('parceiros').orderBy('nome'), snap => snap.docs.map(d => ({ id: d.id, ...d.data() })));
  assinar('revisoes', db.collection('revisoes'), snap => snap.docs.map(d => ({ chave: d.id, ...d.data() })));
  assinar('historico', db.collection('validacoes').orderBy('criadoEm', 'desc').limit(30), snap => snap.docs.map(d => ({ id: d.id, ...d.data() })));
}
function pararSincronizacao() {
  SYNC.unsubs.forEach(u => { try { u(); } catch (e) {} });
  SYNC.unsubs = []; SYNC.prontos = {}; SYNC.dados = {}; SYNC.falhou = {};
}
async function dadosSincronizados(nome) {
  if (OFFLINE_MODE || !SYNC.prontos[nome]) return null;
  await SYNC.prontos[nome];
  if (SYNC.falhou[nome] || !SYNC.dados[nome]) return null;
  return JSON.parse(JSON.stringify(SYNC.dados[nome])); // cópia — quem chama pode alterar à vontade
}
function aoMudarDadosSincronizados(nome) {
  if (nome === 'revisoes') {
    const mapa = {};
    SYNC.dados.revisoes.forEach(r => { mapa[r.chave] = r; });
    STATE.revisoes = mapa;
    STATE._revisoesCarregadas = true;
    if (typeof atualizarBadgeTratativas === 'function') atualizarBadgeTratativas();
  } else if (nome === 'parceiros' && !STATE._parceiroDraft) {
    STATE.parceiros = JSON.parse(JSON.stringify(SYNC.dados.parceiros));
  }
}

function showConnBanner() {
  if (!OFFLINE_MODE) return;
  const b = $('#connBanner');
  b.classList.remove('hidden');
  b.innerHTML = `⚠️ Firebase não configurado — os dados estão sendo salvos apenas neste navegador (modo local de teste). Edite <code class="font-mono">FIREBASE_CONFIG</code> em <code class="font-mono">app.js</code> para habilitar login e sincronização entre a equipe.`;
}

async function doLogin() {
  if (OFFLINE_MODE) {
    currentUser = { email: 'local@grupotbx.com.br', displayName: 'Modo Local', photoURL: '' };
    onAuthed();
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ hd: ALLOWED_DOMAIN });
  try {
    const result = await auth.signInWithPopup(provider);
    const email = result.user.email || '';
    if (!emailAutorizado(email)) {
      await auth.signOut();
      $('#loginError').textContent = `A conta ${email} não tem acesso a este sistema. Fala com quem administra o Validador de Fretes pra liberar.`;
      $('#loginError').classList.remove('hidden');
    }
  } catch (e) {
    console.error(e);
    $('#loginError').textContent = 'Não foi possível entrar. Tente novamente.';
    $('#loginError').classList.remove('hidden');
  }
}

function doLogout() {
  if (OFFLINE_MODE) { location.reload(); return; }
  pararSincronizacao();
  auth.signOut();
}

function onAuthed() {
  $('#loginScreen').classList.add('hidden');
  $('#appShell').classList.remove('hidden');
  $('#userName').textContent = currentUser.displayName || currentUser.email;
  $('#userEmail').textContent = currentUser.email;
  if (currentUser.photoURL) $('#userPhoto').src = currentUser.photoURL;
  else $('#userPhoto').src = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="%23374754"/><text x="16" y="21" font-size="14" fill="white" text-anchor="middle" font-family="Arial">${(currentUser.displayName||currentUser.email||'?')[0].toUpperCase()}</text></svg>`);
  showConnBanner();
  boot();
}

function watchAuth() {
  if (OFFLINE_MODE) return;
  auth.onAuthStateChanged(user => {
    if (user && emailAutorizado(user.email)) {
      currentUser = user;
      onAuthed();
    } else {
      currentUser = null;
      pararSincronizacao();
      $('#appShell').classList.add('hidden');
      $('#loginScreen').classList.remove('hidden');
    }
  });
}

// ---------------------------------------------------------------------
// 6. PARSER DE CT-e (XML) — extrai os campos necessários para a validação
// ---------------------------------------------------------------------
function xmlText(el, tag) {
  if (!el) return null;
  const node = el.getElementsByTagName(tag)[0];
  return node ? node.textContent.trim() : null;
}
function xmlNum(el, tag) {
  const t = xmlText(el, tag);
  return t !== null && t !== '' ? parseFloat(t) : null;
}

// Reforço: procura a tag em qualquer lugar dentro de um elemento, ignorando em que nível
// está aninhada. Usado como último recurso pra pICMS/vICMS/vBC quando a busca pelo
// subtipo específico de ICMS não encontra nada (estrutura de imposto fora do comum).
function buscarTagEmQualquerLugar(root, tag) {
  if (!root) return null;
  const els = root.getElementsByTagName(tag);
  if (!els.length) return null;
  const t = els[0].textContent;
  return t !== null && t !== undefined && t !== '' ? parseFloat(t) : null;
}

// Alguns subtipos de ICMS usam sufixo no nome dos campos em vez do nome padrão —
// ex: ICMSOutraUF tem "pICMSOutraUF"/"vICMSOutraUF"/"vBCOutraUF" em vez de
// "pICMS"/"vICMS"/"vBC". Busca por PREFIXO (não precisa ser o nome exato) dentro do
// elemento indicado, ou em qualquer lugar do documento se `root` for null.
function buscarTagPorPrefixo(root, prefixo) {
  if (!root) return null;
  const todos = root.getElementsByTagName('*');
  for (let i = 0; i < todos.length; i++) {
    const nome = todos[i].tagName || todos[i].nodeName || '';
    if (nome.indexOf(prefixo) === 0) {
      const t = todos[i].textContent;
      return (t !== null && t !== undefined && t !== '') ? parseFloat(t) : null;
    }
  }
  return null;
}

function parseCteXml(xmlString, fileName) {
  const doc = new DOMParser().parseFromString(xmlString, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) return null;

  const infCte = doc.getElementsByTagName('infCte')[0];
  if (!infCte) return null;

  const ide = infCte.getElementsByTagName('ide')[0];
  const emit = infCte.getElementsByTagName('emit')[0];
  const dest = infCte.getElementsByTagName('dest')[0];
  const enderDest = dest ? dest.getElementsByTagName('enderDest')[0] : null;
  const rem = infCte.getElementsByTagName('rem')[0];
  const enderReme = rem ? rem.getElementsByTagName('enderReme')[0] : null;
  const vPrest = infCte.getElementsByTagName('vPrest')[0];
  // o grupo <ICMS> do CT-e tem um único filho cujo nome varia (ICMS00, ICMS20, ICMS45,
  // ICMS60, ICMS90, ICMSOutraUF, ICMSSN...) dependendo do CST/regime tributário — pega
  // qualquer um deles, em vez de só ICMS00, senão pICMS/vICMS ficam vazios pra CT-es que
  // não usam exatamente ICMS00 (isso quebrava o cálculo do imposto e o total com ICMS)
  const icmsWrapper = infCte.getElementsByTagName('ICMS')[0];
  let icms00 = null;
  if (icmsWrapper) {
    for (const filho of Array.from(icmsWrapper.children || [])) {
      if (filho.tagName && filho.tagName.indexOf('ICMS') === 0) { icms00 = filho; break; }
    }
  }
  const infCarga = infCte.getElementsByTagName('infCarga')[0];
  const infDoc = infCte.getElementsByTagName('infDoc')[0];

  // componentes de valor (Comp) — guarda tanto o dicionário normalizado (p/ casar com as
  // regras cadastradas) quanto a lista bruta (p/ exibir exatamente como veio no XML)
  const comps = {};
  const compsBrutos = [];
  if (vPrest) {
    Array.from(vPrest.getElementsByTagName('Comp')).forEach(c => {
      const nome = xmlText(c, 'xNome');
      const valor = xmlNum(c, 'vComp');
      if (nome) {
        comps[normalizaNomeComponente(nome)] = valor;
        compsBrutos.push({ nome, valor });
      }
    });
  }

  // nota(s) fiscal(is) vinculada(s) ao CT-e (infDoc/infNFe/chave — 44 dígitos, de onde dá
  // pra extrair o número da NF-e nas posições 26 a 34)
  const notasFiscais = [];
  if (infDoc) {
    Array.from(infDoc.getElementsByTagName('infNFe')).forEach(n => {
      const chaveNFe = xmlText(n, 'chave');
      if (chaveNFe && chaveNFe.length === 44) {
        notasFiscais.push({ chave: chaveNFe, numero: parseInt(chaveNFe.slice(25, 34), 10) });
      }
    });
  }

  // pesos / cubagem
  const qtds = {};
  if (infCarga) {
    Array.from(infCarga.getElementsByTagName('infQ')).forEach(q => {
      const tp = xmlText(q, 'tpMed');
      const val = xmlNum(q, 'qCarga');
      if (tp) qtds[tp.trim().toUpperCase()] = val;
    });
  }

  const idAttr = infCte.getAttribute('Id') || '';
  const compl = infCte.getElementsByTagName('compl')[0];
  const xObs = xmlText(compl, 'xObs');
  const obsContTextos = Array.from(infCte.getElementsByTagName('ObsCont')).map(o => xmlText(o, 'xTexto')).filter(Boolean).join(' | ');

  return {
    arquivo: fileName,
    chave: idAttr.replace('CTe', ''),
    nCT: xmlText(ide, 'nCT'),
    serie: xmlText(ide, 'serie'),
    dhEmi: xmlText(ide, 'dhEmi'),
    UFIni: xmlText(ide, 'UFIni'),
    xMunIni: xmlText(ide, 'xMunIni'),
    UFFim: xmlText(ide, 'UFFim'),
    xMunFim: xmlText(ide, 'xMunFim'),
    xObs: xObs || null,
    obsContTextos: obsContTextos || null,
    notasFiscais,

    emitCNPJ: onlyDigits(xmlText(emit, 'CNPJ')),
    emitNome: xmlText(emit, 'xNome'),

    destCNPJ: onlyDigits(xmlText(dest, 'CNPJ')),
    destCPF: onlyDigits(xmlText(dest, 'CPF')),
    destNome: xmlText(dest, 'xNome'),
    destCEP: onlyDigits(xmlText(enderDest, 'CEP')),
    destMun: xmlText(enderDest, 'xMun'),
    destUF: xmlText(enderDest, 'UF'),

    remNome: xmlText(rem, 'xNome'),
    remCEP: onlyDigits(xmlText(enderReme, 'CEP')),
    remMun: xmlText(enderReme, 'xMun'),
    remUF: xmlText(enderReme, 'UF'),

    vTPrest: xmlNum(vPrest, 'vTPrest'),
    vRec: xmlNum(vPrest, 'vRec'),
    comps,
    compsBrutos,

    vCarga: xmlNum(infCarga, 'vCarga'),
    pesoReal: qtds['PESO REAL'] ?? null,
    pesoBC: qtds['PESO BASE DE CALCULO'] ?? qtds['PESO BASE DE CÁLCULO'] ?? null,
    m3: qtds['M3'] ?? null,

    pICMS: xmlNum(icms00, 'pICMS') ?? buscarTagPorPrefixo(icms00, 'pICMS') ?? buscarTagEmQualquerLugar(infCte, 'pICMS') ?? buscarTagPorPrefixo(icmsWrapper, 'pICMS'),
    vICMS: xmlNum(icms00, 'vICMS') ?? buscarTagPorPrefixo(icms00, 'vICMS') ?? buscarTagEmQualquerLugar(infCte, 'vICMS') ?? buscarTagPorPrefixo(icmsWrapper, 'vICMS'),
    vBC_ICMS: xmlNum(icms00, 'vBC') ?? buscarTagPorPrefixo(icms00, 'vBC') ?? buscarTagEmQualquerLugar(infCte, 'vBC') ?? buscarTagPorPrefixo(icmsWrapper, 'vBC'),
  };
}

// ---------------------------------------------------------------------
// 7. LEITURA DO .ZIP DE CT-es
// ---------------------------------------------------------------------
// Aceita qualquer combinação de: .zip (com XMLs dentro, inclusive em subpastas), XMLs
// soltos e pastas inteiras (via seletor de pasta ou arrastando). Tudo vira uma lista
// única de "fontes" { nome, lerTexto } — o resto do fluxo não precisa saber de onde veio.
function listaDeArquivos(entrada) {
  if (!entrada) return [];
  if (entrada instanceof File || entrada instanceof Blob) return [entrada];
  return Array.from(entrada);
}

async function coletarFontesXml(entrada) {
  const arquivos = listaDeArquivos(entrada);
  const fontes = [];
  const falhas = [];
  for (const f of arquivos) {
    const nome = f.webkitRelativePath || f._caminho || f.name;
    if (/\.zip$/i.test(f.name)) {
      try {
        const zip = await JSZip.loadAsync(f);
        Object.values(zip.files)
          .filter(e => !e.dir && /\.xml$/i.test(e.name) && !/(^|\/)__MACOSX\//.test(e.name))
          .forEach(e => fontes.push({ nome: e.name.split('/').pop(), origem: `${f.name}/${e.name}`, lerTexto: () => e.async('text') }));
      } catch (e) {
        falhas.push(nome);
      }
    } else if (/\.xml$/i.test(f.name)) {
      fontes.push({ nome: f.name, origem: nome, lerTexto: () => f.text() });
    }
    // outros tipos (pdf, txt, desktop.ini…) dentro da pasta são simplesmente ignorados
  }
  return { fontes, falhas };
}

async function lerXmlsGenerico(entrada, parser, onProgress) {
  const { fontes, falhas } = await coletarFontesXml(entrada);
  const itens = [];
  const chavesVistas = new Set();
  let duplicadosNoLote = 0;
  let done = 0;
  for (const fonte of fontes) {
    try {
      const text = await fonte.lerTexto();
      const doc = parser(text, fonte.nome);
      if (!doc) falhas.push(fonte.origem);
      else if (doc.chave && chavesVistas.has(doc.chave)) duplicadosNoLote++; // mesmo XML 2x na pasta/zip: fica só o primeiro
      else { if (doc.chave) chavesVistas.add(doc.chave); itens.push(doc); }
    } catch (e) {
      falhas.push(fonte.origem);
    }
    done++;
    if (onProgress) onProgress(done, fontes.length);
  }
  return { itens, falhas, duplicadosNoLote, totalArquivos: fontes.length };
}

async function readCtesFromZip(entrada, onProgress) {
  const r = await lerXmlsGenerico(entrada, parseCteXml, onProgress);
  return { ctes: r.itens, falhas: r.falhas, duplicadosNoLote: r.duplicadosNoLote, totalArquivos: r.totalArquivos };
}

// Nome amigável do lote pro histórico/Excel: nome do .zip, nome da pasta, ou "N arquivos XML"
function nomeDoLote(entrada) {
  const arquivos = listaDeArquivos(entrada);
  if (arquivos.length === 0) return 'lote';
  const caminhos = arquivos.map(f => f.webkitRelativePath || f._caminho || '').filter(Boolean);
  if (caminhos.length === arquivos.length) {
    const pastas = Array.from(new Set(caminhos.map(c => c.split('/')[0])));
    if (pastas.length === 1 && caminhos.some(c => c.includes('/'))) return pastas[0];
  }
  if (arquivos.length === 1) return arquivos[0].name;
  const zips = arquivos.filter(f => /\.zip$/i.test(f.name));
  if (zips.length === arquivos.length) return zips.map(z => z.name).join(' + ');
  const xmls = arquivos.filter(f => /\.xml$/i.test(f.name)).length;
  return `${xmls} arquivos XML${zips.length ? ` + ${zips.length} zip` : ''}`;
}

// Arrastar e soltar: pega arquivos soltos E pastas inteiras (lendo subpastas também).
// Sem suporte a webkitGetAsEntry (navegador antigo), cai no dataTransfer.files normal.
async function arquivosDoDrop(dataTransfer) {
  const items = Array.from(dataTransfer.items || []);
  const entries = items.map(it => it.webkitGetAsEntry ? it.webkitGetAsEntry() : null).filter(Boolean);
  if (entries.length === 0) return Array.from(dataTransfer.files || []);
  const arquivos = [];
  const lerArquivo = (entry) => new Promise((res, rej) => entry.file(res, rej));
  const lerDiretorio = (dirEntry) => new Promise((res, rej) => {
    const reader = dirEntry.createReader();
    const todos = [];
    const lote = () => reader.readEntries(batch => {
      if (batch.length === 0) res(todos);
      else { todos.push(...batch); lote(); } // readEntries devolve no máx. ~100 por vez
    }, rej);
    lote();
  });
  async function percorrer(entry, caminho) {
    if (entry.isFile) {
      if (!/\.(xml|zip|xlsx|xls|xlsm|csv)$/i.test(entry.name)) return;
      const f = await lerArquivo(entry);
      if (caminho) { try { Object.defineProperty(f, '_caminho', { value: caminho + entry.name }); } catch (e) {} }
      arquivos.push(f);
    } else if (entry.isDirectory) {
      const filhos = await lerDiretorio(entry);
      for (const filho of filhos) await percorrer(filho, (caminho || '') + entry.name + '/');
    }
  }
  for (const e of entries) await percorrer(e, '');
  return arquivos;
}

// ---------------------------------------------------------------------
// 7b. NOTA FISCAL (NF-e) — só pro campo que interessa aqui: o valor de frete que o
//     Grupo TBX cobrou do CLIENTE final (vFrete, dentro de total/ICMSTot), pra comparar
//     com o que a transportadora cobrou (CT-e) e enxergar a margem/perda no frete.
// ---------------------------------------------------------------------
function parseNFeXml(xmlString, fileName) {
  const doc = new DOMParser().parseFromString(xmlString, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) return null;

  const infNFe = doc.getElementsByTagName('infNFe')[0];
  if (!infNFe) return null;

  const ide = infNFe.getElementsByTagName('ide')[0];
  const dest = infNFe.getElementsByTagName('dest')[0];
  const total = infNFe.getElementsByTagName('total')[0];
  const icmsTot = total ? total.getElementsByTagName('ICMSTot')[0] : null;

  const idAttr = infNFe.getAttribute('Id') || '';

  // itens da nota (código do produto/SKU + quantidade) — usados pra recalcular a cubagem
  // a partir da nossa própria base de dimensões, em vez de confiar no peso que a
  // transportadora declarou no CT-e
  const itens = Array.from(infNFe.getElementsByTagName('det')).map(det => {
    const prod = det.getElementsByTagName('prod')[0];
    return {
      cProd: xmlText(prod, 'cProd'),
      xProd: xmlText(prod, 'xProd'),
      qCom: xmlNum(prod, 'qCom'),
    };
  }).filter(it => it.cProd);

  return {
    arquivo: fileName,
    chave: idAttr.replace('NFe', ''),
    nNF: xmlText(ide, 'nNF'),
    serie: xmlText(ide, 'serie'),
    dhEmi: xmlText(ide, 'dhEmi') || xmlText(ide, 'dEmi'),
    destNome: xmlText(dest, 'xNome'),
    vNF: xmlNum(icmsTot, 'vNF'),
    vFrete: xmlNum(icmsTot, 'vFrete'),
    itens,
    ...(() => {
      // observações da nota (infAdic: infCpl, infAdFisco, obsCont) — "FLUXO" = reposição
      const infAdic = infNFe.getElementsByTagName('infAdic')[0];
      const obsNota = infAdic ? [xmlText(infAdic, 'infCpl'), xmlText(infAdic, 'infAdFisco'), ...Array.from(infAdic.getElementsByTagName('xTexto')).map(n => n.textContent)] : [];
      const obsItens = Array.from(infNFe.getElementsByTagName('infAdProd')).map(n => n.textContent);
      const obs = [...obsNota, ...obsItens].filter(Boolean).join(' | ');
      return { fluxo: textoTemFluxo(obs), obsFluxo: trechoFluxo(obs) };
    })(),
  };
}

async function readNFesFromZip(entrada, onProgress) {
  const r = await lerXmlsGenerico(entrada, parseNFeXml, onProgress);
  return { nfes: r.itens, falhas: r.falhas, duplicadosNoLote: r.duplicadosNoLote, totalArquivos: r.totalArquivos };
}

// ---------------------------------------------------------------------
// 7b-2. PLANILHA DE NOTAS (Excel exportado do ERP/e-commerce) — alternativa ao XML da NF-e.
//     Uma linha por ITEM da nota (NF, Canal, SKU, Qtd, Frete da NF, Valor da NF...). Não tem
//     a chave de 44 dígitos, então casa com o CT-e pelo NÚMERO da nota (que o CT-e traz
//     dentro da chave da NF-e vinculada). Traz o CANAL de venda, que o XML não tem.
// ---------------------------------------------------------------------
function normNumeroNF(v) {
  const d = onlyDigits(v == null ? '' : String(v).replace(/\.0+$/, ''));
  if (!d) return null;
  const n = parseInt(d, 10);
  return isNaN(n) || n <= 0 ? null : String(n);
}

function detectarColunasPlanilhaNotas(headerVals) {
  const norm = headerVals.map(v => normalizaCabecalho(v));
  const acha = (...preds) => { for (const pr of preds) { const i = norm.findIndex(pr); if (i >= 0) return i; } return -1; };
  return {
    nf: acha(h => h === 'NF' || h === 'NF-E' || h === 'NFE', h => h === 'NOTA FISCAL' || h === 'NUMERO NF' || h === 'NUMERO DA NF' || h === 'N NF' || h === 'NO NF', h => /^(N[º°O]?\s*)?(DA\s+)?(NF|NOTA)\b/.test(h) && !h.includes('VALOR') && !h.includes('FRETE') && !h.includes('SAIDA') && !h.includes('TRANSPORT') && !h.includes('PRAZO')),
    canal: acha(h => h === 'CANAL', h => h.includes('CANAL')),
    frete: acha(h => h === 'FRETE DA NF', h => h.includes('FRETE') && !h.includes('TRANSPORT')),
    valorNF: acha(h => h === 'VALOR DA NF', h => h.includes('VALOR') && (h.includes(' NF') || h.includes('NOTA')) && !h.includes('ITEM') && !h.includes('UNIT')),
    sku: acha(h => h === 'SKU', h => h.includes('SKU') || h === 'CODIGO' || h.includes('COD PRODUTO') || h.includes('CODIGO DO PRODUTO')),
    qtd: acha(h => h === 'QTD' || h === 'QUANTIDADE', h => h.startsWith('QTD') || h.startsWith('QUANT')),
    pedido: acha(h => h === 'PEDIDO', h => h.includes('PEDIDO') && !h.includes('DATA')),
    cidade: acha(h => h === 'CIDADE ENTREGA', h => h.includes('CIDADE') && h.includes('ENTREGA'), h => h.includes('CIDADE')),
    uf: acha(h => h === 'UF ENTREGA', h => h.includes('UF') && h.includes('ENTREGA'), h => h === 'UF'),
    dataPedido: acha(h => h === 'DATA DO PEDIDO', h => h.includes('DATA') && h.includes('PEDIDO')),
    transportadora: acha(h => h === 'TRANSPORTADORA DA NF', h => h.includes('TRANSPORTADORA')),
  };
}

// Lê a planilha e agrupa por nota: { "962663": { canal, frete, valorNF, pedido, cidade, uf, itens:[{cProd,qCom}] } }
async function lerPlanilhaNotas(file) {
  const wb = await readWorkbookFile(file);
  let melhor = null;
  for (const nome of wb.SheetNames) {
    const grid = sheetToGrid(wb, nome);
    for (let hr = 0; hr < Math.min(grid.length, 15); hr++) {
      const cols = detectarColunasPlanilhaNotas(grid[hr] || []);
      const pontos = (cols.nf >= 0 ? 3 : 0) + (cols.canal >= 0 ? 2 : 0) + (cols.frete >= 0 ? 2 : 0) + (cols.sku >= 0 ? 1 : 0);
      if (cols.nf >= 0 && (!melhor || pontos > melhor.pontos)) melhor = { nome, grid, hr, cols, pontos };
    }
  }
  if (!melhor) throw new Error('Não encontrei a coluna do número da nota (NF) em nenhuma aba da planilha.');
  const { grid, hr, cols } = melhor;
  const colsObs = (grid[hr] || []).map((v, i) => normalizaCabecalho(v).includes('OBSERV') ? i : -1).filter(i => i >= 0);
  const val = (row, c) => (c >= 0 ? row[c] : null);
  const texto = (v) => (v === null || v === undefined) ? null : String(v).trim() || null;
  const notas = {};
  let linhas = 0;
  for (let r = hr + 1; r < grid.length; r++) {
    const row = grid[r] || [];
    const nNF = normNumeroNF(val(row, cols.nf));
    if (!nNF) continue;
    linhas++;
    const n = notas[nNF] || (notas[nNF] = { nNF, itens: [] });
    const canal = texto(val(row, cols.canal)); if (canal && !n.canal) n.canal = canal;
    const frete = parseNumeroPlanilha(val(row, cols.frete)); if (!isNaN(frete) && n.frete == null) n.frete = frete;
    const vNF = parseNumeroPlanilha(val(row, cols.valorNF)); if (!isNaN(vNF) && n.valorNF == null) n.valorNF = vNF;
    const pedido = texto(val(row, cols.pedido)); if (pedido && !n.pedido) n.pedido = pedido;
    const cidade = texto(val(row, cols.cidade)); if (cidade && !n.cidade) n.cidade = cidade;
    const uf = texto(val(row, cols.uf)); if (uf && !n.uf) n.uf = uf.toUpperCase();
    const dataPedido = texto(val(row, cols.dataPedido)); if (dataPedido && !n.dataPedido) n.dataPedido = dataPedido;
    const transp = texto(val(row, cols.transportadora)); if (transp && !n.transportadora) n.transportadora = transp;
    const obsLinha = colsObs.map(c => texto(row[c])).filter(Boolean).join(' | ');
    if (!('fluxo' in n)) { n.fluxo = false; n.obsFluxo = null; }
    if (obsLinha && textoTemFluxo(obsLinha)) { n.fluxo = true; n.obsFluxo = n.obsFluxo || trechoFluxo(obsLinha); }
    const sku = texto(val(row, cols.sku));
    if (sku) {
      const q = parseNumeroPlanilha(val(row, cols.qtd));
      const qtd = isNaN(q) ? 1 : q;
      const ex = n.itens.find(i => i.cProd === sku);
      if (ex) ex.qCom += qtd; else n.itens.push({ cProd: sku, qCom: qtd });
    }
  }
  return { notas, linhas, aba: melhor.nome, colunasEncontradas: Object.entries(cols).filter(([, i]) => i >= 0).map(([k]) => k) };
}

function numerosNFDoItem(x) {
  return ((x.cte && x.cte.notasFiscais) || []).map(n => normNumeroNF(n.numero)).filter(Boolean);
}

// Aplica os dados da planilha a um lote (resultados + reentregas + trajetos atípicos):
// sempre preenche o CANAL; o frete do cliente e os itens (cubagem) só entram quando o
// XML da NF-e não trouxe — o XML, quando existe, continua sendo a fonte principal.
function aplicarPlanilhaNosItens(itens, mapa) {
  let comCanal = 0, freteDaPlanilha = 0;
  itens.forEach(x => {
    const nota = numerosNFDoItem(x).map(n => mapa[n]).find(Boolean);
    if (!nota) return;
    if (nota.canal) { x.canal = nota.canal; comCanal++; }
    if (nota.pedido) x.pedido = nota.pedido;
    if (nota.fluxo && 'cobrado' in x) { x.reposicao = true; x.obsFluxo = x.obsFluxo || nota.obsFluxo || 'FLUXO (planilha de notas)'; }
    if ('fluxo' in nota && 'cobrado' in x) x.notaSemObs = false; // planilha com observações lidas também vale como conferida
    aplicarRegraReposicao(x);
    if ('cobrado' in x) {
      if ((x.valorFreteCliente === null || x.valorFreteCliente === undefined) && nota.frete !== null && nota.frete !== undefined) {
        x.valorFreteCliente = nota.frete;
        x.nfeVinculada = { nNF: nota.nNF, chave: null, vNF: nota.valorNF ?? null, fonte: 'planilha' };
        x.divergenciaCliente = clamp2(nota.frete - x.cobrado);
        freteDaPlanilha++;
      }
      if (!x._itensNFe && nota.itens && nota.itens.length) x._itensNFe = nota.itens;
    }
  });
  return { comCanal, freteDaPlanilha };
}

async function aplicarPlanilhaAoLote(v) {
  if (!v) return { comCanal: 0, freteDaPlanilha: 0 };
  const todos = [...(v.resultados || []), ...(v.reentregas || []), ...(v.outrosFluxos || [])];
  const numeros = Array.from(new Set(todos.flatMap(numerosNFDoItem)));
  if (!numeros.length) return { comCanal: 0, freteDaPlanilha: 0 };
  const mapa = await DataLayer.buscarPlanilhaNotas(numeros).catch(e => { console.error('[Planilha de notas] falha ao buscar:', e); return {}; });
  return aplicarPlanilhaNosItens(todos, mapa);
}

// Cruza os resultados já validados com as notas fiscais importadas, pela CHAVE da NF-e
// (44 dígitos) que o próprio CT-e já declara vinculada. Preenche valorFreteCliente e a
// divergência entre o que o cliente pagou de frete e o que a transportadora cobrou.
// Resumo financeiro do lote inteiro: quanto a transportadora cobrou no total vs. quanto
// o cliente pagou de frete no total. Devolução/reversa e reentrega NUNCA entram no "cliente
// pagou" (o cliente não paga nada nesses casos) — só entram no "cobrado", virando prejuízo puro.
// "Sem parceiro" e "trajeto atípico" também entram no cobrado: a transportadora cobrou de
// verdade por eles, só não conseguimos validar contra uma tabela — mas o dinheiro saiu.
function calcularResumoFinanceiro(resultados, reentregas, semParceiro, outrosFluxos) {
  let totalCobrado = 0;
  let totalClientePagou = 0;
  let temAlgumaNfe = false;
  // CT-e analisado como "Sem erro": a diferença entre o que o cliente pagou e o que a
  // transportadora cobrou já está explicada (desconto, custo previsto…) -> neutraliza no
  // Faturado, pra mais ou pra menos. Em devolução (cliente não paga nada) neutraliza o cobrado.
  let ajusteSemErro = 0;
  let qtdSemErro = 0;
  resultados.forEach(r => {
    totalCobrado += r.cobrado || 0;
    if (!ehPrejuizoTotal(r) && r.valorFreteCliente != null) {
      totalClientePagou += r.valorFreteCliente;
      temAlgumaNfe = true;
    }
    if (typeof analisadoSemErro === 'function' && analisadoSemErro(r)) {
      if (ehReposicao(r)) { /* reposição é sempre prejuízo — "Sem erro" não neutraliza */ }
      else if (ehPrejuizoTotal(r)) { ajusteSemErro += r.cobrado || 0; qtdSemErro++; }
      else if (r.valorFreteCliente != null) { ajusteSemErro += (r.cobrado || 0) - r.valorFreteCliente; qtdSemErro++; }
    }
  });
  (reentregas || []).forEach(x => { totalCobrado += x.cte.vTPrest || 0; });
  (semParceiro || []).forEach(c => { totalCobrado += c.vTPrest || 0; });
  (outrosFluxos || []).forEach(x => { totalCobrado += x.cte.vTPrest || 0; });
  return {
    totalCobrado: clamp2(totalCobrado),
    totalClientePagou: clamp2(totalClientePagou),
    ajusteSemErro: clamp2(ajusteSemErro),
    qtdSemErro,
    faturado: clamp2(totalClientePagou - totalCobrado + ajusteSemErro),
    temAlgumaNfe,
  };
}

function enriquecerComNotasFiscais(resultados, nfes) {
  const porChave = {};
  nfes.forEach(n => { if (n.chave) porChave[n.chave] = n; });

  let casados = 0;
  resultados.forEach(r => {
    const notas = r.cte.notasFiscais || [];
    let nfeEncontrada = null;
    for (const nf of notas) {
      if (nf.chave && porChave[nf.chave]) { nfeEncontrada = porChave[nf.chave]; break; }
    }
    // "FLUXO" em QUALQUER nota do CT-e (um CT-e pode levar várias NF-es) — inclusive notas
    // lidas nesta sessão cuja gravação no banco ainda não terminou
    const memFluxo = STATE._fluxoPorChave || {};
    const notaComFluxo = notas.map(nf => nf.chave && (porChave[nf.chave] || null)).find(n => n && (n.fluxo || memFluxo[n.chave]))
      || (notas.find(nf => nf.chave && memFluxo[nf.chave]) ? { obsFluxo: memFluxo[notas.find(nf => nf.chave && memFluxo[nf.chave]).chave] } : null);
    if (nfeEncontrada && nfeEncontrada.vFrete !== null && nfeEncontrada.vFrete !== undefined) {
      r.valorFreteCliente = nfeEncontrada.vFrete;
      r.nfeVinculada = { nNF: nfeEncontrada.nNF, chave: nfeEncontrada.chave, vNF: nfeEncontrada.vNF };
      // divergência do TOTAL: o que o cliente pagou de frete vs o que a transportadora cobrou
      // (positivo = cliente pagou mais que o custo do frete = margem; negativo = TBX perde no frete)
      r.divergenciaCliente = clamp2(r.valorFreteCliente - r.cobrado);
      casados++;
    } else {
      r.valorFreteCliente = null;
      r.nfeVinculada = null;
      r.divergenciaCliente = null;
    }
    // guarda os itens (mesmo sem vFrete) pra eventualmente recalcular a cubagem
    r._itensNFe = nfeEncontrada ? nfeEncontrada.itens : null;
    // "FLUXO" nas observações da NF-e -> reposição (prejuízo total, igual devolução)
    const fluxoNota = !!notaComFluxo;
    // nota importada antes da leitura das observações existir: não dá pra saber se tem FLUXO
    r.notaSemObs = !fluxoNota && !!nfeEncontrada && !('fluxo' in nfeEncontrada) && !(nfeEncontrada.chave in memFluxo);
    r.reposicao = fluxoNota || !!r.reposicaoCte;
    r.obsFluxo = fluxoNota ? (notaComFluxo.obsFluxo || memFluxo[notaComFluxo.chave] || 'FLUXO') : (r.reposicaoCte ? r.obsFluxo : null);
    if (!r.reposicao) r.freteNfOriginal = null;
    aplicarRegraReposicao(r);
  });
  return { casados, total: resultados.length, nfesLidas: nfes.length };
}

// ---------------------------------------------------------------------
// 7c. CUBAGEM — peso cubado recalculado a partir da nossa própria base de dimensões de
//     produto (Google Sheets), independente do peso que a transportadora declarou no CT-e.
//     Prevalece sempre o maior entre peso real e peso cubado, como no cálculo de frete
//     padrão do mercado.
// ---------------------------------------------------------------------
function calcularPesoCubado(itensNFe, produtosMap, fatorCubagem) {
  if (!itensNFe || !itensNFe.length || !fatorCubagem || !produtosMap) return null;
  let volumeTotalM3 = 0;
  let itensComDimensao = 0;
  const semDimensao = [];
  itensNFe.forEach(item => {
    const dim = produtosMap[normalizaSku(item.cProd)];
    if (!dim || dim.volumeM3 == null || isNaN(dim.volumeM3)) { semDimensao.push(item.cProd); return; }
    volumeTotalM3 += dim.volumeM3 * (item.qCom || 1);
    itensComDimensao++;
  });
  if (itensComDimensao === 0) return { pesoCubado: null, volumeTotalM3: 0, semDimensao, itensComDimensao: 0, totalItens: itensNFe.length, fatorCubagem };
  return {
    pesoCubado: clamp2(volumeTotalM3 * fatorCubagem),
    volumeTotalM3: Math.round(volumeTotalM3 * 1000) / 1000,
    semDimensao, itensComDimensao, totalItens: itensNFe.length, fatorCubagem,
  };
}

function normalizaSku(s) {
  return (s || '').toString().trim().toUpperCase();
}

// Recalcula o peso base de cálculo (e, por tabela, o valor esperado inteiro) usando o peso
// cubado das dimensões reais dos produtos, quando maior que o peso real — em vez de confiar
// cegamente no peso que a transportadora declarou no CT-e.
function recalcularComCubagem(resultados, produtosMap) {
  if (!produtosMap) return { recalculados: 0, semFator: 0 };
  const indicesPorParceiro = {};
  let recalculados = 0, semFator = 0;
  resultados.forEach(r => {
    if (!r._itensNFe) return; // precisa da NF-e já casada (mesmo passo de importação)
    const pCalc = parceiroCalculo(r);
    const fator = pCalc.fatorCubagem;
    if (!fator) { semFator++; return; }
    const infoCubagem = calcularPesoCubado(r._itensNFe, produtosMap, fator);
    if (!infoCubagem || infoCubagem.pesoCubado == null) return;
    const pesoReal = r.cte.pesoReal || 0;
    const pesoFinal = Math.max(pesoReal, infoCubagem.pesoCubado);
    r.pesoCubadoInfo = { ...infoCubagem, pesoFinal, pesoDeclaradoCte: r.cte.pesoBC };

    if (!indicesPorParceiro[pCalc.id]) indicesPorParceiro[pCalc.id] = buildAbrangenciaIndex(pCalc.abrangencia || []);
    const enderecoConsulta = r.tipoOperacao === 'devolucao' ? { uf: r.cte.remUF, cep: r.cte.remCEP } : null;
    const calcCorrigido = calcularParceiro(r.cte, pCalc, indicesPorParceiro[pCalc.id], enderecoConsulta, pesoFinal);
    r.calc = calcCorrigido;
    r.calculado = calcCorrigido.totalCalculado;
    r.divergencia = (r.calculado !== null) ? clamp2(r.cobrado - r.calculado) : null;
    recalculados++;
  });
  return { recalculados, semFator };
}

// Extrai o ID da planilha de qualquer link do Google Sheets (edição, com ou sem gid)
function extrairIdPlanilha(urlOriginal) {
  const idMatch = urlOriginal.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if (!idMatch) throw new Error('Não reconheci essa URL como uma planilha do Google Sheets — cole o link normal que aparece na barra de endereço quando você abre a planilha.');
  return idMatch[1];
}

// Busca a planilha pela API OFICIAL do Google Sheets (v4), que tem CORS liberado de
// verdade pra uso via JavaScript de qualquer site — diferente dos links de exportação
// CSV/gviz do próprio Docs, que só funcionam abrindo direto no navegador, não quando é
// o JavaScript de outro site que busca (por isso as tentativas anteriores falharam).
// Precisa de uma chave de API do Google Cloud (gratuita, só de leitura).
async function buscarGridProdutos(url, apiKey) {
  if (!apiKey) throw new Error('Falta a chave de API do Google (veja as instruções abaixo de como conseguir uma).');
  const id = extrairIdPlanilha(url);
  const range = 'A1:Z5000'; // cobre a primeira aba inteira, mesmo com várias seções empilhadas
  const apiUrl = `https://sheets.googleapis.com/v4/spreadsheets/${id}/values/${range}?key=${encodeURIComponent(apiKey)}`;
  let resp;
  try {
    resp = await fetch(apiUrl);
  } catch (e) {
    throw new Error('Falha de rede ao chamar a API do Google Sheets. Confira sua conexão e tente de novo.');
  }
  if (!resp.ok) {
    const corpo = await resp.json().catch(() => null);
    const msg = corpo?.error?.message || `HTTP ${resp.status}`;
    throw new Error(`API do Google recusou o pedido: ${msg}. Confira se a chave de API está certa, se a "Google Sheets API" está ativada no projeto, e se a planilha está compartilhada como "Qualquer pessoa com o link".`);
  }
  const dados = await resp.json();
  return dados.values || [];
}

// Monta o mapa SKU -> dimensões a partir do grid bruto + mapeamento de colunas configurado
// Números podem vir com vírgula decimal (formato BR, comum quando a planilha tem
// configuração regional pt-BR) ou ponto — aceita os dois de forma tolerante.
function parseNumeroFlexivel(v) {
  if (v === null || v === undefined || v === '') return NaN;
  if (typeof v === 'number') return v;
  let s = v.toString().trim();
  if (s.includes(',') && !s.includes('.')) s = s.replace(',', '.');
  else if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  return parseFloat(s);
}

// Número vindo de planilha/tela, em qualquer formato comum: 0.003, "0,30%", "0.30 %",
// "R$ 3,00", "1.234,56". Com `percentual: true`, um texto com "%" é dividido por 100
// ("0,30%" -> 0.003). Antes, parseFloat("0,30%") dava 0 e o ADV caía sempre no mínimo.
function parseNumeroPlanilha(v, opts = {}) {
  if (v === null || v === undefined || v === '') return NaN;
  if (typeof v === 'number') return v;
  let s = v.toString().trim();
  const temPct = s.includes('%');
  s = s.replace(/R\$/gi, '').replace(/%/g, '').replace(/\s+/g, '');
  if (s === '' || s === '-') return NaN;
  const n = parseNumeroFlexivel(s);
  if (isNaN(n)) return NaN;
  return (opts.percentual && temPct) ? n / 100 : n;
}

// ADV/GRIS nunca passam de 5% do valor da carga. Se o percentual chegou como 0,30 (quem
// digitou quis dizer 0,30%, não 30%), converte pra fração. Sem isso o cálculo sai
// absurdo (30% da nota) ou, no caso do texto, zerado (e cai no mínimo).
function normalizaPercentualCarga(n) {
  if (n === null || n === undefined || isNaN(n)) return n;
  return n > 0.05 ? n / 100 : n;
}

// Planilhas de produto costumam ter VÁRIAS seções empilhadas (uma por categoria), cada
// uma com seu próprio cabeçalho repetido no meio dos dados — por isso não dá pra usar
// "uma linha de cabeçalho" única. Em vez disso, cada linha é reconhecida como dado (não
// cabeçalho de seção) checando se a coluna de referência (cubagem ou comprimento) tem um
// número de verdade; linhas de cabeçalho de seção têm texto ali e são puladas sozinhas.
function montarMapaProdutos(grid, config) {
  const mapa = {};
  let semSku = 0, semDim = 0, linhasSecao = 0;
  const fatorUnidade = config.unidade === 'cm' ? 100 : 1; // divide por isso pra converter a dimensão pra metro
  const colAncora = config.colCubagem != null ? config.colCubagem : config.colComprimento;

  for (let r = 0; r < grid.length; r++) {
    const row = grid[r] || [];
    if (row.every(v => v === null || v === undefined || v === '')) continue;
    const sku = normalizaSku(row[config.colSku]);
    if (!sku) { semSku++; continue; }

    const valorAncora = parseNumeroFlexivel(row[colAncora]);
    if (isNaN(valorAncora)) { linhasSecao++; continue; } // linha de cabeçalho de seção — ignora

    const comprimento = config.colComprimento != null ? parseNumeroFlexivel(row[config.colComprimento]) : NaN;
    const largura = config.colLargura != null ? parseNumeroFlexivel(row[config.colLargura]) : NaN;
    const altura = config.colAltura != null ? parseNumeroFlexivel(row[config.colAltura]) : NaN;
    const peso = config.colPeso != null ? parseNumeroFlexivel(row[config.colPeso]) : NaN;

    let volumeM3 = config.colCubagem != null ? parseNumeroFlexivel(row[config.colCubagem]) : NaN;
    if (isNaN(volumeM3)) {
      if (isNaN(comprimento) || isNaN(largura) || isNaN(altura)) { semDim++; continue; }
      volumeM3 = (comprimento / fatorUnidade) * (largura / fatorUnidade) * (altura / fatorUnidade);
    }
    mapa[sku] = { comprimento, largura, altura, volumeM3, peso: isNaN(peso) ? null : peso };
  }
  return { mapa, total: Object.keys(mapa).length, semSku, semDim, linhasSecao };
}

// ---------------------------------------------------------------------
// 8. ÍNDICE DE ABRANGÊNCIA (CEP → UF/Região/TDA) por parceiro
// ---------------------------------------------------------------------
function buildAbrangenciaIndex(abrangenciaRows) {
  // abrangenciaRows: [{uf, cidade, cepIni, cepFim, regiao, tda, prazo}, ...]
  const porUF = {};
  for (const row of (abrangenciaRows || [])) {
    const uf = (row.uf || '').toUpperCase().trim();
    if (!uf) continue;
    (porUF[uf] = porUF[uf] || []).push(row);
  }
  Object.values(porUF).forEach(list => list.sort((a,b) => a.cepIni - b.cepIni));
  return porUF;
}
function lookupAbrangencia(index, uf, cepStr) {
  const list = index[(uf || '').toUpperCase().trim()];
  if (!list || !list.length) return null;
  const cep = parseInt(onlyDigits(cepStr), 10);
  if (isNaN(cep)) return null;
  // busca linear (listas de algumas centenas/milhares de linhas — ok no navegador)
  for (const row of list) {
    if (cep >= row.cepIni && cep <= row.cepFim) return row;
  }
  return null;
}

// ---------------------------------------------------------------------
// 9. MOTOR DE CÁLCULO GENÉRICO
// ---------------------------------------------------------------------
// Cada PARCEIRO tem uma "receita" de cálculo (parceiro.motor / parceiro.regrasAdicionais).
// Isso permite cadastrar transportadoras com estruturas de tarifa bem diferentes
// entre si sem precisar alterar código — só configurar pela tela de Parceiros.
//
// Tipos de regra adicional suportados:
//   percentual_com_minimo   -> max(percentual * base, minimo)          (ex: ADV, GRIS)
//   fixo_por_cte            -> valor fixo por CT-e                      (ex: Despacho, TAS fixo)
//   por_fracao_100kg        -> valor * ceil(peso/100)                   (ex: Pedágio)
//   percentual_sobre_subtotal -> percentual * subtotal já calculado     (ex: TEC, Taxa Emergencial)
//   lista_abrangencia       -> valor fixo, só se a região tiver o flag  (ex: TDA)
//   manual                  -> não é calculado automaticamente (exibido para conferência manual)
// Percentual, mínimo e valor podem vir de um número global OU de uma coluna
// extra na grade de tarifas (variando por UF/Região) — flag *PorLinha.

function normalizaNomeComponente(s) {
  return (s || '').toString().trim().toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ');
}

function normalizaRegiao(s) {
  return (s || '').toString().trim().toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ')
    .replace(/\bIII\b/, '3').replace(/\bII\b/, '2').replace(/\bI\b/, '1');
}

// Algumas transportadoras usam nomes diferentes para a mesma região na aba de
// abrangência (CEP) e na aba de tarifas — ex: abrangência diz "CAPITAL" mas a
// tabela de tarifas usa o nome da cidade ("CUIABÁ"). O parceiro pode cadastrar
// esses "de-para" em parceiro.mapeamentoRegiao; aplicamos antes de buscar a tarifa.
function traduzirRegiaoParaTabela(parceiro, uf, regiaoAbrangencia) {
  const ufN = (uf || '').toUpperCase().trim();
  const regN = normalizaRegiao(regiaoAbrangencia);
  const map = (parceiro.mapeamentoRegiao || []).find(m =>
    (m.uf || '').toUpperCase().trim() === ufN && normalizaRegiao(m.de) === regN
  );
  return map ? map.para : regiaoAbrangencia;
}

function encontrarTarifa(motor, uf, regiao) {
  const ufN = (uf || '').toUpperCase().trim();
  const regN = normalizaRegiao(regiao);
  return (motor.tarifas || []).find(t =>
    (t.uf || '').toUpperCase().trim() === ufN && normalizaRegiao(t.regiao) === regN
  ) || null;
}

function calcFaixaPeso(peso, tarifaRow, faixasPeso, baseExcedente) {
  if (peso === null || peso === undefined || isNaN(peso)) return { valor: null, explicacao: 'Peso não informado no CT-e.' };
  const valores = tarifaRow.valores || [];
  for (let i = 0; i < faixasPeso.length; i++) {
    if (peso <= faixasPeso[i]) {
      const de = i === 0 ? 0 : faixasPeso[i - 1];
      return { valor: clamp2(valores[i] ?? 0), explicacao: `Peso ${fmtNum(peso)}kg está na faixa ${de>0?`de ${de} a `:'até '}${faixasPeso[i]}kg → valor fixo de tabela: ${fmtBRL(valores[i] ?? 0)}.` };
    }
  }
  const ultimaFaixa = faixasPeso[faixasPeso.length - 1];
  const valorUltimo = valores[valores.length - 1] ?? 0;
  const excedenteRate = tarifaRow.excedente || 0;
  if (baseExcedente === 'por_fracao_100') {
    const fracoes = Math.ceil((peso - ultimaFaixa) / 100);
    const valor = clamp2(valorUltimo + fracoes * excedenteRate);
    return { valor, explicacao: `Peso ${fmtNum(peso)}kg acima de ${ultimaFaixa}kg: ${fmtBRL(valorUltimo)} (faixa base) + ${fracoes} fração(ões) de 100kg excedente × ${fmtBRL(excedenteRate)} = ${fmtBRL(valor)}.` };
  }
  const excesso = peso - ultimaFaixa;
  const valor = clamp2(valorUltimo + excesso * excedenteRate);
  return { valor, explicacao: `Peso ${fmtNum(peso)}kg acima de ${ultimaFaixa}kg: ${fmtBRL(valorUltimo)} (faixa base) + ${fmtNum(excesso)}kg excedente × ${fmtBRL(excedenteRate)}/kg = ${fmtBRL(valor)}.` };
}

function getRegraValorBruto(regra, campo, tarifaRow) {
  const porLinha = regra[campo + 'PorLinha'];
  if (porLinha && tarifaRow && tarifaRow.extras) {
    const v = tarifaRow.extras[regra.id + '_' + campo];
    if (v !== undefined && v !== null && v !== '') return v;
  }
  const g = regra[campo];
  return (g === undefined || g === null || g === '') ? null : g;
}
function getRegraValor(regra, campo, tarifaRow, fallback) {
  const bruto = getRegraValorBruto(regra, campo, tarifaRow);
  if (bruto === null) return fallback;
  let n = parseNumeroPlanilha(bruto, { percentual: campo === 'pct' });
  if (isNaN(n)) return fallback;
  if (campo === 'pct' && regra.tipo === 'percentual_com_minimo') n = normalizaPercentualCarga(n);
  if (campo === 'pct' && regra.tipo === 'percentual_sobre_subtotal' && n > 1) n = n / 100;
  return n;
}

function calcRegraAdicional(regra, ctx) {
  switch (regra.tipo) {
    case 'percentual_com_minimo': {
      // regra criada pelo "+ Adicionar regra" nascia sem o campo base (a tela mostrava
      // "Valor da carga" só porque é a única opção) -> base 0 -> sempre caía no mínimo
      const campoBase = regra.base || 'vCarga';
      const base = ctx[campoBase] || 0;
      const pct = getRegraValor(regra, 'pct', ctx.tarifaRow, 0);
      const min = getRegraValor(regra, 'min', ctx.tarifaRow, 0);
      const bruto = pct * base;
      const valor = clamp2(Math.max(bruto, min));
      const nomeBase = campoBase === 'vCarga' ? 'valor da carga' : campoBase;
      if (!(pct > 0)) {
        const onde = ctx.tarifaRow ? `${ctx.tarifaRow.uf} / ${ctx.tarifaRow.regiao}` : 'esta região';
        return { valor, aplicavel: true, semPercentual: true, explicacao: `⚠ Percentual de ${regra.nome} não encontrado na tabela do parceiro para ${onde} (célula vazia ou em formato não reconhecido) — só o mínimo de ${fmtBRL(min)} foi aplicado. Confira a coluna do percentual em Parceiros e reimporte a tabela.` };
      }
      const explicacao = min > 0 && bruto < min
        ? `${fmtNum(pct*100,2)}% sobre o ${nomeBase} (${fmtBRL(base)}) = ${fmtBRL(bruto)}, abaixo do mínimo de ${fmtBRL(min)} → aplica o mínimo: ${fmtBRL(valor)}.`
        : `${fmtNum(pct*100,2)}% sobre o ${nomeBase} (${fmtBRL(base)}) = ${fmtBRL(valor)}${min>0?` (mínimo seria ${fmtBRL(min)}, não precisou aplicar)`:''}.`;
      return { valor, aplicavel: true, explicacao };
    }
    case 'fixo_por_cte': {
      const v = getRegraValor(regra, 'valor', ctx.tarifaRow, 0);
      return { valor: clamp2(v), aplicavel: true, explicacao: `Valor fixo de tabela por CT-e: ${fmtBRL(v)}.` };
    }
    case 'por_fracao_100kg': {
      if (ctx.peso === null || ctx.peso === undefined) return { valor: 0, aplicavel: false, explicacao: 'Peso não informado — não foi possível calcular.' };
      const v = getRegraValor(regra, 'valor', ctx.tarifaRow, 0);
      const fracoes = Math.ceil(ctx.peso / 100);
      const valor = clamp2(v * fracoes);
      return { valor, aplicavel: true, explicacao: `${fmtBRL(v)} por fração de 100kg × ${fracoes} fração(ões) (peso ${fmtNum(ctx.peso)}kg) = ${fmtBRL(valor)}.` };
    }
    case 'percentual_sobre_subtotal': {
      const pct = getRegraValor(regra, 'pct', ctx.tarifaRow, 0);
      const valor = clamp2(pct * (ctx.subtotalAtual || 0));
      return { valor, aplicavel: true, explicacao: `${fmtNum(pct*100,2)}% sobre o subtotal já calculado até aqui (${fmtBRL(ctx.subtotalAtual||0)}) = ${fmtBRL(valor)}.` };
    }
    case 'lista_abrangencia': {
      const flag = ctx.abrangenciaRow ? Number(ctx.abrangenciaRow.tda) : 0;
      if (!flag) return { valor: 0, aplicavel: false, explicacao: 'A faixa de CEP encontrada na abrangência não tem sinalizador dessa taxa — não aplicável para este destino.' };
      const v = getRegraValor(regra, 'valor', ctx.tarifaRow, flag);
      return { valor: clamp2(v), aplicavel: true, explicacao: `Faixa de CEP sinalizada na abrangência com valor ${fmtBRL(flag)}${v!==flag?`, mas a regra usa o valor configurado ${fmtBRL(v)}`:''}.` };
    }
    case 'manual':
    default:
      return { valor: null, aplicavel: null, manual: true, explicacao: regra.obs || 'Regra marcada como manual — não é calculada automaticamente.' };
  }
}

// Resultado da validação de 1 CT-e contra a receita de 1 parceiro
function calcularParceiro(cte, parceiro, abrangenciaIndex, enderecoConsulta = null, pesoOverride = null) {
  const motor = parceiro.motor || {};
  // normalmente consulta pelo destinatário (fluxo de saída); em devoluções, o "destino" do
  // CT-e é sempre a origem do parceiro (ex: Garuva), então quem importa pra achar a tarifa
  // é o remetente — enderecoConsulta permite substituir por esse endereço quando aplicável.
  const ufConsulta = enderecoConsulta?.uf || cte.destUF;
  const cepConsulta = enderecoConsulta?.cep || cte.destCEP;
  const abrRow = lookupAbrangencia(abrangenciaIndex, ufConsulta, cepConsulta);
  const regiaoAbrangencia = abrRow ? abrRow.regiao : null;
  const regiao = regiaoAbrangencia ? traduzirRegiaoParaTabela(parceiro, ufConsulta, regiaoAbrangencia) : null;
  const tarifaRow = regiao ? encontrarTarifa(motor, ufConsulta, regiao) : null;

  if (!tarifaRow) {
    return {
      status: abrRow ? 'SEM_TARIFA' : 'SEM_ABRANGENCIA',
      regiaoEncontrada: regiao || regiaoAbrangencia,
      abrRow,
      componentes: [],
      subtotalCalculado: null,
      totalCalculado: null,
    };
  }

  // peso considerado: normalmente o "peso base de cálculo" que a própria transportadora
  // declarou no CT-e; pesoOverride permite substituir por um peso recalculado por nós
  // (maior entre peso real e peso cubado, usando nossa própria base de dimensões de produto)
  const peso = pesoOverride ?? (cte.pesoBC ?? cte.pesoReal ?? null);
  const fretePesoInfo = calcFaixaPeso(peso, tarifaRow, motor.faixasPeso || [], motor.baseExcedente || 'por_kg');
  const fretePeso = fretePesoInfo.valor;

  const ctx = { vCarga: cte.vCarga || 0, peso, tarifaRow, abrangenciaRow: abrRow, subtotalAtual: fretePeso || 0 };
  const componentes = [{ nome: 'FRETE PESO', valor: fretePeso, aplicavel: true, tipo: 'faixa_peso', explicacao: fretePesoInfo.explicacao }];

  for (const regra of (parceiro.regrasAdicionais || [])) {
    const r = calcRegraAdicional(regra, ctx);
    componentes.push({ nome: regra.nome, valor: r.valor, aplicavel: r.aplicavel, manual: !!r.manual, tipo: regra.tipo, explicacao: r.explicacao });
    if (r.aplicavel && typeof r.valor === 'number') ctx.subtotalAtual += r.valor;
  }

  // TDA automática: a abrangência do parceiro já traz o valor da TDA por faixa de CEP. Se
  // o parceiro não tem uma regra de TDA cadastrada em "Taxas e regras adicionais", usa o
  // valor da própria abrangência em vez de deixar a TDA cobrada como "não encontrado no
  // cadastro". Quando a faixa NÃO tem TDA mas a transportadora cobrou, entra como R$ 0,00
  // pra divergência aparecer na linha certa.
  const temRegraTda = (parceiro.regrasAdicionais || []).some(rg => {
    const n = normalizaNomeComponente(rg.nome);
    return rg.tipo === 'lista_abrangencia' || /^TDA\b/.test(n) || n.includes('DIFICIL ACESSO');
  });
  if (!temRegraTda && abrRow) {
    const valorTda = Number(abrRow.tda) || 0;
    const onde = `CEP ${cepConsulta || '—'} na faixa ${abrRow.cidade ? abrRow.cidade + ' ' : ''}(${abrRow.cepIni}–${abrRow.cepFim})`;
    if (valorTda > 0) {
      componentes.push({ nome: 'TDA', valor: clamp2(valorTda), aplicavel: true, manual: false, tipo: 'lista_abrangencia', explicacao: `TDA da abrangência: ${onde} tem TDA de ${fmtBRL(valorTda)} → valor esperado ${fmtBRL(valorTda)} por CT-e (parceiro sem regra de TDA própria, usado o valor da abrangência).` });
      ctx.subtotalAtual += clamp2(valorTda);
    } else if (encontrarComponenteCobrado(cte, 'TDA').valor !== undefined) {
      componentes.push({ nome: 'TDA', valor: 0, aplicavel: true, manual: false, tipo: 'lista_abrangencia', explicacao: `TDA da abrangência: ${onde} NÃO tem TDA na tabela → o esperado é R$ 0,00.` });
    }
  }

  const manualPendente = componentes.some(c => c.manual);
  const subtotalCalculado = componentes.reduce((acc, c) => acc + (c.aplicavel && typeof c.valor === 'number' ? c.valor : 0), 0);

  let totalCalculado = null;
  const pICMS = cte.pICMS;
  if (pICMS !== null && pICMS !== undefined && pICMS < 100) {
    totalCalculado = clamp2(subtotalCalculado / (1 - pICMS / 100));
  } else {
    totalCalculado = clamp2(subtotalCalculado);
  }

  return {
    status: manualPendente ? 'REVISAO_MANUAL' : 'OK',
    regiaoEncontrada: regiao,
    abrRow,
    componentes,
    subtotalCalculado: clamp2(subtotalCalculado),
    totalCalculado,
  };
}

// Normaliza nome de empresa pra comparação: maiúsculas, sem acento, espaços únicos.
// Não remove sufixos como "LTDA"/"S/A" de propósito — a comparação por "contém" abaixo
// já lida com isso sem precisar de uma lista de sufixos pra manter.
function normalizaNomeParceiro(s) {
  return (s || '').toString().trim().toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ');
}

// Casa cada CT-e com o parceiro certo pelo NOME do emitente — não pelo CNPJ, porque um
// mesmo parceiro comercial pode emitir CT-e por mais de um CNPJ (filiais, empresas do
// mesmo grupo etc.) mas sempre com o nome comercial reconhecível.
// ----- Tabelas em rascunho (versões antigas da tabela de um parceiro) -----
function nomeOriginalParceiro(p) { return p && p.rascunho ? (p.rascunhoDe || p.nome) : (p && p.nome); }
function rascunhosDoParceiro(parceiroOuNome) {
  const alvo = normalizaNomeParceiro(typeof parceiroOuNome === 'string' ? parceiroOuNome : nomeOriginalParceiro(parceiroOuNome));
  return (STATE.parceiros || []).filter(p => p.rascunho && normalizaNomeParceiro(p.rascunhoDe || '') === alvo)
    .sort((a, b) => (b.rascunhoEm || '').localeCompare(a.rascunhoEm || ''));
}
// tabela usada no cálculo de um CT-e: a atual do parceiro, ou um rascunho escolhido na análise
function parceiroCalculo(r) {
  if (r && r.tabelaAlternativa && r.tabelaAlternativa.id) {
    const alt = (STATE.parceiros || []).find(p => p.id === r.tabelaAlternativa.id);
    if (alt) return alt;
  }
  return r.parceiro;
}
function recalcularResultado(r) {
  const p = parceiroCalculo(r);
  if (!p || !p.motor) return;
  const idx = buildAbrangenciaIndex(p.abrangencia || []);
  const enderecoConsulta = r.tipoOperacao === 'devolucao' ? { uf: r.cte.remUF, cep: r.cte.remCEP } : null;
  r.calc = calcularParceiro(r.cte, p, idx, enderecoConsulta);
  r.calculado = r.calc.totalCalculado;
  r.divergencia = (r.calculado !== null) ? clamp2(r.cobrado - r.calculado) : null;
  delete r.pesoCubadoInfo;
  if (r._itensNFe && STATE.produtosMap) recalcularComCubagem([r], STATE.produtosMap);
}
// Troca a tabela usada por uma lista de CT-es (id = rascunho, ou null = tabela atual)
async function aplicarTabelaAosCtes(lista, idTabela) {
  const tabela = idTabela ? (STATE.parceiros || []).find(p => p.id === idTabela) : null;
  let aplicados = 0, ignorados = 0;
  lista.forEach(r => {
    if (tabela && normalizaNomeParceiro(tabela.rascunhoDe || '') !== normalizaNomeParceiro(nomeOriginalParceiro(r.parceiro))) { ignorados++; return; }
    r.tabelaAlternativa = tabela ? { id: tabela.id, nome: tabela.nome } : null;
    recalcularResultado(r);
    aplicados++;
  });
  const v = STATE.ultimaValidacao;
  renderResultadosValidacao();
  if (aplicados && v && v.historicoId) {
    DataLayer.substituirValidacao(v.historicoId, montarRegistroHistorico(v.nomeArquivo, v))
      .then(() => { v._resumoGravado = { ...montarRegistroHistorico(v.nomeArquivo, v).resumo }; })
      .catch(e => { console.error(e); toast(mensagemErroFirebase(e, 'atualizar o Histórico'), 'warn'); });
  }
  return { aplicados, ignorados, tabela };
}

function encontrarParceiroPorCTe(cte, parceirosTodos) {
  // tabelas em rascunho (versões antigas) só são usadas quando escolhidas na análise
  const parceiros = (parceirosTodos || []).filter(p => !p.rascunho);
  const nomeEmit = normalizaNomeParceiro(cte.emitNome);
  if (!nomeEmit) return null;
  // 1ª tentativa: nome igual
  let match = parceiros.find(p => normalizaNomeParceiro(p.nome) === nomeEmit);
  if (match) return match;
  // 2ª tentativa: um nome contém o outro (ex: parceiro "FLYVILLE TRANSPORTES" casa com
  // emitente "FLYVILLE TRANSPORTES LTDA")
  match = parceiros.find(p => {
    const nomeP = normalizaNomeParceiro(p.nome);
    return nomeP && (nomeEmit.includes(nomeP) || nomeP.includes(nomeEmit));
  });
  return match || null;
}

// Extrai UF/município da string livre de "origem" do parceiro (ex: "Garuva - SC")
function parseOrigemParceiro(origemTexto) {
  if (!origemTexto) return { municipio: null, uf: null };
  const partes = origemTexto.split('-').map(s => s.trim()).filter(Boolean);
  if (partes.length >= 2) {
    const ufCand = partes[partes.length - 1].toUpperCase();
    if (ufCand.length === 2) return { municipio: partes.slice(0, -1).join('-').trim().toUpperCase(), uf: ufCand };
  }
  return { municipio: origemTexto.trim().toUpperCase(), uf: null };
}

// Classifica o CT-e pelo sentido do trajeto em relação à origem negociada do parceiro:
// 'saida' = fluxo normal (sai da origem, valida contra a tabela); 'devolucao'/'reversa' =
// volta pra origem (não segue a tabela de saída, precisa ficar fora da validação padrão);
// 'outro' = nem sai nem volta pra origem cadastrada (trajeto atípico).
// Devolução e reversa são a mesma coisa pra fins de precificação — o frete de volta
// custa 100% do valor da mesma tabela de saída, só que consultado pelo REMETENTE (quem
// está devolvendo), já que o "destino" do CT-e nesse caso é sempre a origem do parceiro.
function identificarTipoOperacao(cte, parceiro) {
  // reentrega: identificada pela observação do próprio CT-e (não tem tabela pra isso,
  // então não é calculada de jeito nenhum — só listada pra controle, como devolução era
  // antes de ganhar o cálculo pelo remetente)
  const norm = normalizaNomeParceiro;
  const textoObs = norm((cte.xObs || '') + ' ' + (cte.obsContTextos || ''));
  if (textoObs.includes('REENTREGA')) return 'reentrega';

  const origem = parseOrigemParceiro(parceiro.origem);
  if (!origem.municipio) return 'saida'; // parceiro sem origem cadastrada -> não classifica, trata como normal

  const iniMatch = norm(cte.xMunIni) === norm(origem.municipio) && (!origem.uf || cte.UFIni === origem.uf);
  const fimMatch = norm(cte.xMunFim) === norm(origem.municipio) && (!origem.uf || cte.UFFim === origem.uf);

  if (iniMatch) return 'saida';
  if (fimMatch) return 'devolucao'; // volta pra origem do parceiro (devolução/reversa — tratadas como uma coisa só)
  return 'outro';
}

function validarLoteCtes(ctes, parceiros) {
  // pré-monta índice de abrangência de cada parceiro (uma vez, não por CT-e)
  const indices = {};
  parceiros.forEach(p => { indices[p.id] = buildAbrangenciaIndex(p.abrangencia || []); });

  const resultados = [];
  const semParceiro = [];
  const outrosFluxos = [];
  const reentregas = [];

  for (const cte of ctes) {
    const parceiro = encontrarParceiroPorCTe(cte, parceiros);
    if (!parceiro) { semParceiro.push(cte); continue; }

    const tipoOperacao = identificarTipoOperacao(cte, parceiro);
    if (tipoOperacao === 'reentrega') { reentregas.push({ cte, parceiro }); continue; }
    if (tipoOperacao === 'outro') { outrosFluxos.push({ cte, parceiro }); continue; }

    // devolução: consulta a tarifa pelo REMETENTE (quem devolveu), não pelo destinatário
    // (que aqui é sempre o próprio Grupo TBX/origem do parceiro) — mesma tabela, 100% do valor
    const enderecoConsulta = tipoOperacao === 'devolucao' ? { uf: cte.remUF, cep: cte.remCEP } : null;

    const calc = calcularParceiro(cte, parceiro, indices[parceiro.id], enderecoConsulta);
    const cobrado = cte.vTPrest || 0;
    const calculado = calc.totalCalculado;
    const divergencia = (calculado !== null) ? clamp2(cobrado - calculado) : null;

    const obsCte = (cte.xObs || '') + ' ' + (cte.obsContTextos || '');
    const reposicaoCte = textoTemFluxo(obsCte);
    resultados.push({
      cte, parceiro, calc,
      cobrado, calculado, divergencia,
      tipoOperacao,
      reposicaoCte,
      reposicao: reposicaoCte,
      obsFluxo: reposicaoCte ? (trechoFluxo(obsCte) + ' (observação do CT-e)') : null,
    });
    aplicarRegraReposicao(resultados[resultados.length - 1]);
  }
  return { resultados, semParceiro, outrosFluxos, reentregas };
}

// 10. IMPORTAÇÃO DE PLANILHAS (.xlsx) — leitura genérica via SheetJS
// ---------------------------------------------------------------------
function readWorkbookFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array', cellDates: false });
        resolve(wb);
      } catch (err) { reject(err); }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}
function sheetToGrid(workbook, sheetName) {
  const ws = workbook.Sheets[sheetName];
  if (!ws) return [];
  const grid = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
  // Células mescladas (ex: o mesmo "0,30%" de ADV mesclado pra todas as regiões de uma UF)
  // só guardam o valor na primeira célula — as demais linhas vinham vazias e a regra
  // ficava sem percentual. Replica o valor pro intervalo inteiro da mesclagem.
  const merges = ws['!merges'] || [];
  if (merges.length) {
    const ref = ws['!ref'] ? XLSX.utils.decode_range(ws['!ref']) : { s: { r: 0, c: 0 } };
    merges.forEach(m => {
      // só mesclagens verticais (uma coluna, várias linhas) — as horizontais são títulos
      // de seção ("GENERALIDADES" etc.) e replicá-las criaria linhas de tarifa falsas
      if (m.s.c !== m.e.c || m.e.r === m.s.r) return;
      const r0 = m.s.r - ref.s.r, c0 = m.s.c - ref.s.c;
      const val = (grid[r0] || [])[c0];
      if (val === null || val === undefined || val === '') return;
      for (let r = m.s.r; r <= m.e.r; r++) {
        const ri = r - ref.s.r;
        if (!grid[ri]) grid[ri] = [];
        for (let c = m.s.c; c <= m.e.c; c++) {
          const ci = c - ref.s.c;
          if (grid[ri][ci] === null || grid[ri][ci] === undefined || grid[ri][ci] === '') grid[ri][ci] = val;
        }
      }
    });
  }
  return grid;
}

// Extrai as linhas não vazias de uma grade (array de arrays), a partir de uma
// linha de cabeçalho escolhida pelo usuário, aplicando o mapeamento de colunas.
function extrairLinhasMapeadas(grid, headerRowIdx, mapeamento) {
  // mapeamento: { campo: colIndex }
  const linhas = [];
  for (let r = headerRowIdx + 1; r < grid.length; r++) {
    const row = grid[r] || [];
    const isEmpty = row.every(v => v === null || v === undefined || v === '');
    if (isEmpty) continue;
    const obj = {};
    for (const [campo, col] of Object.entries(mapeamento)) {
      if (col === null || col === undefined || col === '') continue;
      obj[campo] = row[col];
    }
    linhas.push(obj);
  }
  return linhas;
}

function exportResultadosParaXlsx(resultados, semParceiro, parceirosEnvolvidos, outrosFluxos = [], reentregas = []) {
  const wb = XLSX.utils.book_new();

  const headerDetalhe = ['Tipo','Parceiro','Tabela usada','Nº CTe','Nº NF-e','Canal','Pedido','Emissão','Origem','UF Origem','Destino','UF Destino','Região (tabela)','Peso Base Cálc (kg)','Valor Carga (R$)'];
  const nomesRegras = new Set();
  resultados.forEach(r => r.calc.componentes.forEach(c => nomesRegras.add(c.nome)));
  const listaRegras = Array.from(nomesRegras);
  listaRegras.forEach(n => { headerDetalhe.push(`${n} Cobrado`, `${n} Calculado`); });
  headerDetalhe.push('TOTAL Cobrado (R$)', 'TOTAL Calculado (R$)', 'Divergência (R$)', 'Status', 'Frete Cliente (NF-e) (R$)', 'Margem Cliente x Transportadora (R$)');

  const linhasDetalhe = [headerDetalhe];
  resultados
    .slice()
    .sort((a,b) => Math.abs(b.divergencia||0) - Math.abs(a.divergencia||0))
    .forEach(r => {
      const row = [
        r.tipoOperacao === 'devolucao' ? 'Devolução' : r.reposicao ? 'Reposição' : 'Saída',
        r.parceiro.nome, r.tabelaAlternativa ? r.tabelaAlternativa.nome : 'Atual', r.cte.nCT, (r.cte.notasFiscais||[]).map(n=>n.numero).join(', '), r.canal || '', r.pedido || '', r.cte.dhEmi,
        r.cte.xMunIni, r.cte.UFIni, r.cte.xMunFim, r.cte.UFFim,
        r.calc.regiaoEncontrada || '', r.cte.pesoBC ?? r.cte.pesoReal ?? '', r.cte.vCarga ?? '',
      ];
      listaRegras.forEach(n => {
        const comp = r.calc.componentes.find(c => c.nome === n);
        const achado = encontrarComponenteCobrado(r.cte, n);
        row.push(achado.valor !== undefined ? achado.valor : '');
        row.push(comp && comp.aplicavel ? comp.valor : (comp && comp.manual ? 'manual' : ''));
      });
      row.push(r.cobrado, r.calculado, r.divergencia, r.calc.status, r.valorFreteCliente ?? '', r.divergenciaCliente ?? '');
      linhasDetalhe.push(row);
    });

  const wsDetalhe = XLSX.utils.aoa_to_sheet(linhasDetalhe);
  XLSX.utils.book_append_sheet(wb, wsDetalhe, 'Detalhe');

  if (semParceiro.length) {
    const linhasSemParceiro = [['Nº CTe','Emissão','CNPJ Emitente','Emitente','Destino','UF','Valor Cobrado (R$)']];
    semParceiro.forEach(c => linhasSemParceiro.push([c.nCT, c.dhEmi, fmtCNPJ(c.emitCNPJ), c.emitNome, c.destMun, c.destUF, c.vTPrest]));
    const wsSem = XLSX.utils.aoa_to_sheet(linhasSemParceiro);
    XLSX.utils.book_append_sheet(wb, wsSem, 'Sem parceiro cadastrado');
  }

  if (reentregas.length) {
    const headerReentrega = ['Nº CTe','Parceiro','Canal','Emissão','Destino','UF','Valor Cobrado (R$)'];
    const linhasReentrega = [headerReentrega];
    reentregas.forEach(x => linhasReentrega.push([x.cte.nCT, x.parceiro.nome, x.canal || '', x.cte.dhEmi, x.cte.destMun, x.cte.destUF, x.cte.vTPrest]));
    const wsReentrega = XLSX.utils.aoa_to_sheet(linhasReentrega);
    XLSX.utils.book_append_sheet(wb, wsReentrega, 'Reentregas');
  }

  if (outrosFluxos.length) {
    const headerForaFluxo = ['Nº CTe','Parceiro','Emissão','Origem','UF Origem','Destino','UF Destino','Valor Cobrado (R$)'];
    const linhas = [headerForaFluxo];
    outrosFluxos.forEach(x => linhas.push([x.cte.nCT, x.parceiro.nome, x.cte.dhEmi, x.cte.xMunIni, x.cte.UFIni, x.cte.xMunFim, x.cte.UFFim, x.cte.vTPrest]));
    const ws = XLSX.utils.aoa_to_sheet(linhas);
    XLSX.utils.book_append_sheet(wb, ws, 'Outros trajetos');
  }

  const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  return new Blob([wbout], { type: 'application/octet-stream' });
}

// 12. NAVEGAÇÃO
// ---------------------------------------------------------------------
function goToView(name) {
  $$('.view').forEach(v => v.classList.add('hidden'));
  $(`#view-${name}`).classList.remove('hidden');
  $(`#view-${name}`).classList.add('fade-in');
  $$('.nav-btn').forEach(b => {
    const active = b.dataset.view === name || (name === 'parceiro-form' && b.dataset.view === 'parceiros');
    b.classList.toggle('bg-white/10', active);
    b.classList.toggle('text-white', active);
    b.classList.toggle('text-ink-300', !active);
  });
  if (name === 'dashboard') renderDashboard();
  if (name === 'validar') renderValidar();
  if (name === 'parceiros') renderParceirosList();
  if (name === 'parceiro-form') renderParceiroForm();
  if (name === 'historico') renderHistorico();
  if (name === 'tratativas') renderTratativas();
  if (name === 'produtos') renderProdutos();
  window.scrollTo(0, 0);
}

async function carregarRevisoes() {
  try {
    const lista = await DataLayer.listRevisoes();
    STATE.revisoes = {};
    lista.forEach(r => { STATE.revisoes[r.chave] = r; });
    STATE._revisoesCarregadas = true;
    atualizarBadgeTratativas();
  } catch (e) {
    console.error(e);
  }
}

function atualizarBadgeTratativas() {
  const badge = $('#badgeTratativas');
  if (!badge) return;
  const pendentes = Object.values(STATE.revisoes).filter(r => r.classificacao && r.classificacao !== 'sem_erro' && (r.statusTratativa || 'pendente') !== 'resolvido').length;
  if (pendentes > 0) {
    badge.textContent = pendentes;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

async function boot() {
  iniciarSincronizacao();
  try {
    STATE.parceiros = await DataLayer.listParceiros();
  } catch (e) {
    console.error(e);
    toast('Não foi possível carregar os parceiros.', 'error');
  }
  await carregarRevisoes();
  goToView('dashboard');
}

document.addEventListener('DOMContentLoaded', () => {
  initFirebase();
  $$('.nav-btn').forEach(b => b.addEventListener('click', async () => { if (await podeSairDaValidacao()) goToView(b.dataset.view); }));
  $('#btnGoogleLogin').addEventListener('click', doLogin);
  $('#btnLogout').addEventListener('click', async () => { if (await podeSairDaValidacao()) doLogout(); });
  const versaoEl = $('#appVersionLabel');
  if (versaoEl) versaoEl.textContent = 'v' + APP_VERSION;
  console.log('[Validador de Fretes] versão carregada:', APP_VERSION);

  if (OFFLINE_MODE) {
    // sem Firebase configurado -> pula direto pro login local (modo teste)
    watchAuth(); // no-op, mas mantém padrão
  } else {
    watchAuth();
  }
});

  const totalDivergencias = historico.reduce((a,h) => a + (h.resumo?.qtdDivergenciaMaior || 0), 0);
  const valorDivergenteMaior = historico.reduce((a,h) => a + (h.resumo?.valorDivergenteMaior || 0), 0);

  el.innerHTML = `
    <div class="flex items-center justify-between mb-6">
      <div>

      </div>
      <button onclick="goToView('validar')" class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow-sm transition-colors flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>

    </div>

    <div class="grid grid-cols-4 gap-4 mb-8">
      ${statCard('Parceiros cadastrados', parceiros.length, 'brand', `${parceiros.filter(p=>p.ativo!==false).length} ativos`)}
      ${statCard('CT-es já validados', totalCtesValidados.toLocaleString('pt-BR'), 'ink', `em ${historico.length} lote(s)`)}
      ${statCard('Divergências (cobrado maior)', totalDivergencias.toLocaleString('pt-BR'), totalDivergencias>0?'red':'emerald', 'acumulado no histórico')}
      ${statCard('Valor cobrado a maior', fmtBRL(valorDivergenteMaior), valorDivergenteMaior>0?'red':'emerald', 'total identificado')}
    </div>

    <div class="grid grid-cols-3 gap-6">
      <div class="col-span-2 bg-white rounded-2xl shadow-panel border border-ink-100 p-6">
        <div class="flex items-center justify-between mb-4">
          <h2 class="font-semibold text-ink-900">Últimas validações</h2>
          <button onclick="goToView('historico')" class="text-xs text-brand-600 hover:text-brand-700 font-medium">Ver histórico completo →</button>
        </div>
        ${historico.length === 0 ? emptyState('Nenhuma validação ainda', 'Envie um lote de CT-es (.zip) na aba Validar Fretes para começar.') : `
          <div class="divide-y divide-ink-100">
            ${historico.slice(0,6).map(h => `
              <div class="py-3 flex items-center justify-between">
                <div>
                  <div class="text-sm font-medium text-ink-800">${escapeHtml(h.nomeArquivo || 'Lote de CT-es')}</div>
                  <div class="text-xs text-ink-400">${fmtDate(h.criadoEm)} · ${h.resumo?.total ?? 0} CT-es · ${escapeHtml((h.resumo?.parceiros||[]).join(', '))}</div>
                </div>
                <div class="text-right">
                  <div class="text-sm font-semibold num ${h.resumo?.qtdDivergenciaMaior ? 'text-red-600' : 'text-emerald-600'}">${h.resumo?.qtdDivergenciaMaior ? h.resumo.qtdDivergenciaMaior + ' divergência(s)' : 'Tudo conferido'}</div>
                </div>
              </div>
            `).join('')}
          </div>
        `}
      </div>

      <div class="bg-white rounded-2xl shadow-panel border border-ink-100 p-6">
        <h2 class="font-semibold text-ink-900 mb-4">Parceiros</h2>
        ${parceiros.length === 0 ? emptyState('Nenhum parceiro cadastrado', 'Cadastre a primeira transportadora e sua tabela negociada.', 'Cadastrar parceiro', "goToView('parceiros')") : `
          <div class="space-y-2">
            ${parceiros.slice(0,6).map(p => `
              <div class="flex items-center justify-between px-3 py-2 rounded-xl hover:bg-ink-50 cursor-pointer" onclick="editarParceiro('${p.id}')">

                  <div class="w-7 h-7 rounded-lg bg-ink-100 flex items-center justify-center text-[11px] font-bold text-ink-600 shrink-0">${escapeHtml((p.nome||'?').slice(0,2).toUpperCase())}</div>
                  <div class="min-w-0">
                    <div class="text-sm font-medium text-ink-800 truncate">${escapeHtml(p.nome)}</div>
                    <div class="text-[11px] text-ink-400 font-mono truncate">${fmtCNPJ(p.cnpj)}</div>
                  </div>
                </div>
                <span class="tag-dot text-[11px] ${p.ativo===false?'text-ink-300':'text-emerald-600'}" style="--tw-content:''"></span>

          </div>

}

function statCard(label, value, color, sub) {
  const colorMap = { brand:'text-brand-600', ink:'text-ink-700', red:'text-red-600', emerald:'text-emerald-600' };
  return `
    <div class="bg-white rounded-2xl shadow-panel border border-ink-100 p-5">
      <div class="text-xs text-ink-400 font-medium mb-2">${label}</div>
      <div class="text-2xl font-bold num ${colorMap[color]||colorMap.ink}">${value}</div>
      <div class="text-[11px] text-ink-300 mt-1">${sub}</div>
    </div>
  `;
}
function emptyState(title, sub, btnLabel, btnAction) {
  return `
    <div class="text-center py-8">
      <div class="w-11 h-11 mx-auto rounded-xl bg-ink-50 flex items-center justify-center mb-3">
        <svg class="w-5 h-5 text-ink-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 13h6m-6 4h6m2 5H7a2 2 0 01-2-2V4a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V20a2 2 0 01-2 2z"/></svg>
      </div>
      <div class="text-sm font-medium text-ink-700">${title}</div>
      <div class="text-xs text-ink-400 mt-1 max-w-xs mx-auto">${sub}</div>
      ${btnLabel ? `<button onclick="${btnAction}" class="mt-4 text-xs font-medium text-brand-600 hover:text-brand-700">${btnLabel} →</button>` : ''}
    </div>
  `;
}

            <button type="button" data-acao="arquivos" data-alvo="cte" class="btn-upload px-3 py-1.5 rounded-lg border border-ink-200 bg-white text-xs font-medium text-ink-700 hover:border-brand-400 hover:text-brand-700">Selecionar arquivos (.zip ou .xml)</button>
            <button type="button" data-acao="pasta" data-alvo="cte" class="btn-upload px-3 py-1.5 rounded-lg border border-ink-200 bg-white text-xs font-medium text-ink-700 hover:border-brand-400 hover:text-brand-700">Selecionar pasta</button>

    <div id="resultadosBox" class="mt-6"></div>

  // Uma zona de upload = clique abre o seletor de arquivos; os dois botões escolhem entre
  // arquivos (.zip/.xml, vários de uma vez) ou pasta inteira; arrastar aceita tudo junto.
  function ligarZonaUpload(zone, inputArquivos, inputPasta, corClasses, processar) {
    zone.addEventListener('click', (e) => { if (!e.target.closest('.btn-upload')) inputArquivos.click(); });
    zone.querySelectorAll('.btn-upload').forEach(b => b.addEventListener('click', (e) => {
      e.stopPropagation();
      (b.dataset.acao === 'pasta' ? inputPasta : inputArquivos).click();
    }));
    ;['dragover','dragleave','drop'].forEach(evt => zone.addEventListener(evt, (e) => e.preventDefault()));
    zone.addEventListener('dragover', () => zone.classList.add(...corClasses));
    zone.addEventListener('dragleave', () => zone.classList.remove(...corClasses));
    zone.addEventListener('drop', async (e) => {
      zone.classList.remove(...corClasses);
      const arquivos = await arquivosDoDrop(e.dataTransfer);
      if (arquivos.length) processar(arquivos);
      else toast('Nenhum .xml, .zip ou planilha encontrado no que foi solto.', 'warn');
    });
    [inputArquivos, inputPasta].forEach(inp => inp.addEventListener('change', (e) => {
      const arquivos = Array.from(e.target.files || []);
      e.target.value = ''; // permite escolher a mesma pasta/arquivo de novo
      if (arquivos.length) processar(arquivos);
    }));
  }

  ligarZonaUpload($('#uploadZone'), $('#fileZip'), $('#folderCte'), ['border-brand-400','bg-brand-50/30'], (arqs) => processarZip(arqs));
  ligarZonaUpload($('#uploadZoneNFe'), $('#fileZipNFe'), $('#folderNFe'), ['border-purple-400','bg-purple-50/30'], (arqs) => processarArquivosNotas(arqs, 'progressNFeBoxInicial'));
}
