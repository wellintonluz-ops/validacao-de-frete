      </div>
      ${mapaResult.total > 0 ? `
        <div class="mt-3 text-[11px] text-ink-400">
          Conferência (3 primeiros produtos): ${Object.entries(mapaResult.mapa).slice(0,3).map(([sku,dim]) => `${escapeHtml(sku)} = ${fmtNum(dim.volumeM3,4)} m³`).join(' · ')}
        </div>
      ` : ''}
    </div>
  `;
}

async function salvarConfigProdutos() {
  const d = STATE._produtosDraft;
  if (!d || !d.url || !d.grid) { toast('Carregue a planilha antes de salvar.', 'error'); return; }
  if (d.colSku == null) { toast('Selecione a coluna do código do produto (SKU).', 'error'); return; }
  const temCubagem = d.colCubagem != null;
  const temDimensoes = d.colComprimento != null && d.colLargura != null && d.colAltura != null;
  if (!temCubagem && !temDimensoes) {
    toast('Mapeie a coluna de Cubagem pronta, ou as 3 de Comprimento/Largura/Altura.', 'error');
    return;
  }
  const mapaResult = montarMapaProdutos(d.grid, d);
  if (mapaResult.total === 0) { toast('Nenhum produto válido encontrado com esse mapeamento.', 'error'); return; }

  const config = {
    url: d.url, apiKey: d.apiKey,
    colSku: d.colSku, colPeso: d.colPeso ?? null, colCubagem: d.colCubagem ?? null,
    colComprimento: d.colComprimento ?? null, colLargura: d.colLargura ?? null, colAltura: d.colAltura ?? null,
    unidade: d.unidade || 'm',
    total: mapaResult.total,
  };
  try {
    await DataLayer.saveConfigProdutos(config);
    STATE.produtosMap = mapaResult.mapa;
    STATE._produtosDraft = null;
    toast(`Configuração salva — ${mapaResult.total} produtos mapeados.`, 'success');
    renderProdutos();
  } catch (e) {
    console.error(e);
    toast('Não foi possível salvar a configuração.', 'error');
  }
}

// Carrega o mapa de produtos ativo (config salva + dados atuais da planilha) — chamado ao
// importar NF-e em Validar Fretes, pra já ter o mapa pronto sem precisar visitar a tela Produtos
async function carregarMapaProdutosAtivo() {
  if (STATE.produtosMap) return STATE.produtosMap;
  const config = await DataLayer.getConfigProdutos().catch(() => null);
  if (!config || !config.url || !config.apiKey) return null;
  try {
    const grid = await buscarGridProdutos(config.url, config.apiKey);
    const { mapa } = montarMapaProdutos(grid, config);
    STATE.produtosMap = mapa;
    return mapa;
  } catch (e) {
    console.warn('[Produtos] não foi possível carregar a planilha automaticamente:', e);
    return null;
  }
}

// 19. VIEW: TRATATIVAS COM TRANSPORTADORA
// ---------------------------------------------------------------------
const STATUS_TRATATIVA = [
  { valor: 'pendente', label: 'Pendente', cls: 'bg-red-50 text-red-700 border-red-200' },
  { valor: 'em_tratativa', label: 'Em tratativa', cls: 'bg-amber-50 text-amber-700 border-amber-200' },
  { valor: 'resolvido', label: 'Resolvido', cls: 'bg-emerald-50 text-emerald-700 border-emerald-200' },
];

function fmtDataCurta(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return 'desde ' + d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }) + ' ' + d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
  } catch { return ''; }
}
function historicoStatusTexto(r) {
  const datas = r.datasStatus || {};
  const linhas = STATUS_TRATATIVA
    .filter(s => datas[s.valor])
    .map(s => `${s.label}: ${fmtDate(datas[s.valor])}`);
  return linhas.length ? linhas.join('\n') : 'Sem histórico de datas ainda.';
}

async function renderTratativas() {
  const el = $('#tratativasContent');
  el.innerHTML = `<div class="flex items-center justify-between mb-1"><h1 class="text-2xl font-bold text-ink-900">Análises de Divergência</h1><button id="btnExportarTratativas" class="text-sm font-medium text-brand-600 hover:text-brand-700 flex items-center gap-1.5"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H8a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span id="btnExportarTratativasTexto">Exportar Excel</span></button></div><p class="text-sm text-ink-400 mb-6">Todo CT-e analisado, agrupado pelo tipo de erro identificado — pra ver onde está concentrado o problema.</p><div id="resumoForaFluxoAnalises" class="mb-6"></div><div id="tratativasLista">${skeletonRows()}</div>`;
  $('#btnExportarTratativas').addEventListener('click', exportarTratativasXlsx);
  atualizarTextoExportar();

  // resumo de devolução/reentrega (prejuízo direto — valor total cobrado) e trajetos
  // atípicos (sem tabela pra comparar) — somado em todos os lotes
  const historico = await DataLayer.listHistorico().catch(() => []);
  const totalDevolucoes = historico.reduce((a, h) => a + (h.resumo?.devolucoes || 0), 0);
  const valorDevolucoes = historico.reduce((a, h) => a + (h.resumo?.valorDevolucoes || 0), 0);
  const totalOutros = historico.reduce((a, h) => a + (h.resumo?.outrosFluxos || 0), 0);
  const totalReentregas = historico.reduce((a, h) => a + (h.resumo?.reentregas || 0), 0);
  const valorReentregas = historico.reduce((a, h) => a + (h.resumo?.valorReentregas || 0), 0);
  const totalReposicoes = historico.reduce((a, h) => a + (h.resumo?.reposicoes || 0), 0);
  const valorReposicoes = historico.reduce((a, h) => a + (h.resumo?.valorReposicoes || 0), 0);
  const boxForaFluxo = $('#resumoForaFluxoAnalises');
  if (totalDevolucoes > 0 || totalOutros > 0 || totalReentregas > 0 || totalReposicoes > 0) {
    boxForaFluxo.innerHTML = `
      <div class="bg-blue-50 border border-blue-200 rounded-2xl p-4">
        <div class="text-sm font-semibold text-blue-800 mb-2">Acumulado de todos os lotes já processados — prejuízo direto (pago do próprio bolso)</div>
        <div class="grid grid-cols-4 gap-3 text-xs">
          <div><span class="text-amber-700 font-bold text-base">${totalReposicoes}</span> <span class="text-amber-700">reposição(ões) — ${fmtBRL(valorReposicoes)} de prejuízo total</span></div>
          <div><span class="text-brand-700 font-bold text-base">${totalDevolucoes}</span> <span class="text-brand-600">devolução(ões) — ${fmtBRL(valorDevolucoes)} de prejuízo total</span></div>
          <div><span class="text-purple-700 font-bold text-base">${totalReentregas}</span> <span class="text-purple-600">reentrega(s) — ${fmtBRL(valorReentregas)} de prejuízo total</span></div>
          <div><span class="text-ink-600 font-bold text-base">${totalOutros}</span> <span class="text-ink-500">trajeto(s) atípico(s) — sem tabela pra comparar, fora da validação</span></div>
        </div>
      </div>`;
  } else {
    boxForaFluxo.innerHTML = '';
  }

  await carregarRevisoes();
  let analisadasTodas = Object.values(STATE.revisoes).filter(r => r.classificacao);
  // análises gravadas antes do canal existir: completa pela planilha de notas (só na tela)
  const semCanal = analisadasTodas.filter(r => !r.canal && r.notaFiscal);
  if (semCanal.length) {
    const mapa = await DataLayer.buscarPlanilhaNotas(semCanal.map(r => normNumeroNF(r.notaFiscal))).catch(() => ({}));
    semCanal.forEach(r => { const n = mapa[normNumeroNF(r.notaFiscal)]; if (n && n.canal) r.canal = n.canal; });
  }
  const canaisAnalises = Array.from(new Set(analisadasTodas.map(r => r.canal).filter(Boolean))).sort();
  const filtroCanal = STATE._filtroCanalTratativa || '';
  const analisadas = filtroCanal ? analisadasTodas.filter(r => filtroCanal === '__sem__' ? !r.canal : r.canal === filtroCanal) : analisadasTodas;
  const lista = $('#tratativasLista');

  if (analisadas.length === 0) {
    lista.innerHTML = emptyState('Nenhuma análise registrada ainda', 'Quando você classificar uma divergência no detalhe do CT-e (aba Validar Fretes), ela aparece aqui, separada por tipo de erro.');
    return;
  }

  STATE._abaTratativaAtiva = STATE._abaTratativaAtiva || 'todos';
  const abas = [{ valor: 'todos', label: 'Todos os tipos', labelCurta: 'Todos' }, ...CLASSIFICACOES_DIVERGENCIA.filter(c => c.valor !== 'sem_erro')];

  // resumo por tipo — pra ver de cara onde está concentrado o erro
  const resumoPorTipo = abas.map(c => {
    const doTipo = c.valor === 'todos' ? analisadas.filter(r => r.classificacao !== 'sem_erro') : analisadas.filter(r => r.classificacao === c.valor);
    const pendentesDoTipo = doTipo.filter(r => (r.statusTratativa || 'pendente') !== 'resolvido');
    return { ...c, qtd: doTipo.length, qtdPendente: pendentesDoTipo.length, valorTotal: doTipo.reduce((a, r) => a + Math.abs(r.valorRessarcir || 0), 0) };
  });

  lista.innerHTML = `
    <div class="mb-4 flex items-center gap-3 text-xs">
      <span class="font-semibold text-ink-500 uppercase tracking-wide text-[11px]">Canal</span>
      <select id="filtroCanalTratativa" class="border border-ink-200 rounded-lg px-2 py-1.5">
        <option value="">Todos os canais</option>
        ${canaisAnalises.map(c => `<option value="${escapeHtml(c)}" ${filtroCanal === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join('')}
        <option value="__sem__" ${filtroCanal === '__sem__' ? 'selected' : ''}>Sem canal identificado</option>
      </select>
      ${filtroCanal ? `<span class="text-ink-400">${analisadas.length} de ${analisadasTodas.length} análise(s)</span>` : ''}
    </div>
    <div class="grid grid-cols-5 gap-4 mb-6">
      ${resumoPorTipo.map(c => `
        <button onclick="mudarAbaTratativa('${c.valor}')" class="text-left rounded-2xl border p-4 transition-all ${STATE._abaTratativaAtiva===c.valor ? 'bg-ink-900 border-ink-900 text-white' : 'bg-white border-ink-100 hover:border-ink-200 text-ink-900'}">
          <div class="text-xs font-medium mb-1 ${STATE._abaTratativaAtiva===c.valor?'text-ink-300':'text-ink-400'}">${c.labelCurta || c.label}</div>
          <div class="text-xl font-bold num">${c.qtd}</div>
          <div class="text-[11px] mt-0.5 ${STATE._abaTratativaAtiva===c.valor?'text-ink-300':'text-ink-400'}">${c.qtdPendente} em aberto · ${fmtBRL(c.valorTotal)}</div>
        </button>
      `).join('')}
    </div>
    <div id="tabelaTratativaAtiva"></div>
    <p class="text-xs text-ink-300 mt-3">Os valores são sobre o subtotal (sem ICMS), conforme definido na análise de cada CT-e. CT-es classificados como "Sem erro" não aparecem aqui — servem só pra marcar que a divergência foi conferida e é aceitável.</p>
  `;
  const selCanal = $('#filtroCanalTratativa');
  if (selCanal) selCanal.addEventListener('change', () => { STATE._filtroCanalTratativa = selCanal.value; renderTratativas(); });
  renderTabelaTratativa(analisadas);
}

function mudarAbaTratativa(valor) {
  STATE._abaTratativaAtiva = valor;
  STATE._subAbaTratativaAtiva = 'todos'; // reseta o filtro de status ao trocar de tópico
  renderTratativas();
}

function mudarSubAbaTratativa(valor) {
  STATE._subAbaTratativaAtiva = valor;
  renderTabelaTratativa(STATE._analisadasCache || []);
  atualizarTextoExportar();
}

function atualizarTextoExportar() {
  const el = $('#btnExportarTratativasTexto');
  if (!el) return;
  const subAba = STATE._subAbaTratativaAtiva || 'todos';
  const info = STATUS_TRATATIVA.find(s => s.valor === subAba);
  el.textContent = subAba === 'todos' ? 'Exportar Excel (todos)' : `Exportar Excel (${info ? info.label : subAba})`;
}

function renderTabelaTratativa(analisadas) {
  STATE._analisadasCache = analisadas;
  const aba = STATE._abaTratativaAtiva;
  const subAba = STATE._subAbaTratativaAtiva || 'todos';
  const infoAba = aba === 'todos' ? { label: 'Todos os tipos' } : CLASSIFICACOES_DIVERGENCIA.find(c => c.valor === aba);
  const doTipo = (aba === 'todos' ? analisadas.filter(r => r.classificacao !== 'sem_erro') : analisadas.filter(r => r.classificacao === aba)).sort((a, b) => (b.atualizadoEm || '').localeCompare(a.atualizadoEm || ''));
  const box = $('#tabelaTratativaAtiva');
  const labelValor = aba === 'transportadora' ? 'A ressarcir' : 'Diferença';

  if (doTipo.length === 0) {
    box.innerHTML = emptyState(`Nenhum caso em "${infoAba?.label}"`, 'Nada classificado nessa categoria ainda.');
    return;
  }

  // subabas por status — quantidade e valor dentro do tópico atual
  const gruposStatus = STATUS_TRATATIVA.map(s => {
    const doStatus = doTipo.filter(r => (r.statusTratativa || 'pendente') === s.valor);
    return { ...s, qtd: doStatus.length, valorTotal: doStatus.reduce((a, r) => a + Math.abs(r.valorRessarcir || 0), 0) };
  });
  const subabas = [
    { valor: 'todos', label: 'Todos', qtd: doTipo.length, valorTotal: doTipo.reduce((a, r) => a + Math.abs(r.valorRessarcir || 0), 0), cls: 'bg-ink-100 text-ink-700 border-ink-200' },
    ...gruposStatus,
  ];
  const filtrados = subAba === 'todos' ? doTipo : doTipo.filter(r => (r.statusTratativa || 'pendente') === subAba);

  box.innerHTML = `
    <div class="flex flex-wrap gap-2 mb-4">
      ${subabas.map(s => `
        <button onclick="mudarSubAbaTratativa('${s.valor}')" class="text-xs font-medium px-3 py-1.5 rounded-full border transition-all ${subAba===s.valor ? s.cls.replace('50','100') + ' ring-1 ring-offset-1 ring-ink-300' : 'bg-white text-ink-500 border-ink-200 hover:border-ink-300'}">
          ${s.label} · ${s.qtd} · ${fmtBRL(s.valorTotal)}
        </button>
      `).join('')}
    </div>
    ${filtrados.length === 0 ? emptyState('Nada aqui', 'Nenhum caso com esse status neste tópico.') : `
    <div class="bg-white rounded-2xl shadow-panel border border-ink-100 overflow-hidden">
      <table class="w-full text-sm">
        <thead>
          <tr class="bg-ink-50 text-ink-500 text-[11px] uppercase tracking-wide">
            <th class="text-left font-semibold px-4 py-3">CT-e</th>
            <th class="text-left font-semibold px-4 py-3">Emissão</th>
            <th class="text-left font-semibold px-4 py-3">Fatura</th>
            <th class="text-left font-semibold px-4 py-3">Nota Fiscal</th>
            <th class="text-left font-semibold px-4 py-3">Canal</th>
            ${aba === 'todos' ? '<th class="text-left font-semibold px-4 py-3">Tipo de erro</th>' : ''}
            <th class="text-left font-semibold px-4 py-3">Parceiro</th>
            <th class="text-left font-semibold px-4 py-3">Destino</th>
            <th class="text-right font-semibold px-4 py-3">Cobrado</th>
            <th class="text-right font-semibold px-4 py-3">Calculado</th>
            <th class="text-right font-semibold px-4 py-3">${labelValor}</th>
            <th class="text-left font-semibold px-4 py-3">Detalhamento dos erros</th>
            <th class="text-left font-semibold px-4 py-3">Status</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-ink-100">
          ${filtrados.map(r => `
            <tr class="hover:bg-ink-50/60">
              <td class="px-4 py-3 num text-ink-700">${escapeHtml(r.nCT || '—')}</td>
              <td class="px-4 py-3 num text-ink-500 text-xs whitespace-nowrap">${fmtDia(r.dhEmi)}</td>
              <td class="px-4 py-3 num text-ink-600 text-xs">${escapeHtml(r.numeroFatura || '—')}</td>
              <td class="px-4 py-3 num text-ink-600">${escapeHtml(r.notaFiscal || '—')}</td>
              <td class="px-4 py-3 text-ink-600 text-xs">${r.canal ? escapeHtml(r.canal) : '<span class="text-ink-300">—</span>'}</td>
              ${aba === 'todos' ? `<td class="px-4 py-3 text-xs"><span class="px-2 py-0.5 rounded-full border ${(LABEL_CLASSIFICACAO[r.classificacao] || {}).cls || ''}">${escapeHtml((LABEL_CLASSIFICACAO[r.classificacao] || {}).label || r.classificacao)}</span></td>` : ''}
              <td class="px-4 py-3 text-ink-700">${escapeHtml(r.parceiroNome || '—')}</td>
              <td class="px-4 py-3 text-ink-600">${escapeHtml(r.destMun || '')} / ${escapeHtml(r.destUF || '')}</td>
              <td class="px-4 py-3 text-right num text-ink-700">${fmtBRL(r.valorCobradoSubtotal)}</td>
              <td class="px-4 py-3 text-right num text-ink-700">${fmtBRL(r.valorRealSubtotal)}</td>
              <td class="px-4 py-3 text-right num font-semibold text-red-600">${fmtBRL(r.valorRessarcir)}</td>
              <td class="px-4 py-3 text-ink-500 text-xs max-w-[260px] truncate cursor-help" title="${escapeHtml((r.detalhamentoErros||'') + (r.observacao ? '\n\nObservação: '+r.observacao : ''))}">${escapeHtml(r.detalhamentoErros || '—')}</td>
              <td class="px-4 py-3">
                <select onchange="atualizarStatusTratativa('${r.chave}', this.value)" class="text-xs border rounded-full px-2 py-1 ${(STATUS_TRATATIVA.find(s=>s.valor===(r.statusTratativa||'pendente'))||{}).cls}">
                  ${STATUS_TRATATIVA.map(s => `<option value="${s.valor}" ${(r.statusTratativa||'pendente')===s.valor?'selected':''}>${s.label}</option>`).join('')}
                </select>
                <div class="text-[10px] text-ink-300 mt-1 cursor-help" title="${escapeHtml(historicoStatusTexto(r))}">${fmtDataCurta((r.datasStatus||{})[r.statusTratativa||'pendente'])}</div>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
    `}
  `;
}

async function atualizarStatusTratativa(chave, novoStatus) {
  const revisao = STATE.revisoes[chave];
  if (!revisao) return;
  revisao.statusTratativa = novoStatus;
  revisao.datasStatus = revisao.datasStatus || {};
  revisao.datasStatus[novoStatus] = new Date().toISOString(); // sempre atualiza pra "agora" a cada vez que entra nesse status
  try {
    await DataLayer.saveRevisao(revisao);
    STATE.revisoes[chave] = revisao;
    atualizarBadgeTratativas();
    toast('Status atualizado.', 'success');
    renderTratativas();
  } catch (e) {
    console.error(e);
    toast('Não foi possível atualizar o status.', 'error');
  }
}

function exportarTratativasXlsx() {
  const subAba = STATE._subAbaTratativaAtiva || 'todos';
  const infoStatus = STATUS_TRATATIVA.find(s => s.valor === subAba);

  let todas = Object.values(STATE.revisoes).filter(r => r.classificacao && r.classificacao !== 'sem_erro');
  const filtroCanal = STATE._filtroCanalTratativa || '';
  if (filtroCanal) todas = todas.filter(r => filtroCanal === '__sem__' ? !r.canal : r.canal === filtroCanal);
  if (subAba !== 'todos') {
    todas = todas.filter(r => (r.statusTratativa || 'pendente') === subAba);
  }
  if (todas.length === 0) { toast(`Nenhuma análise "${infoStatus ? infoStatus.label : 'Todos'}" pra exportar.`, 'warn'); return; }

  const header = ['Nº CTe', 'Fatura', 'Nota Fiscal', 'Canal', 'Parceiro', 'Emissão', 'Destino', 'UF', 'Valor Cobrado (R$)', 'Valor Calculado (R$)', 'Diferença (R$)', 'Status', 'Data Pendente', 'Data Em Tratativa', 'Data Resolvido', 'Detalhamento dos Erros de Cálculo (Subtotal)', 'Observação'];
  const wb = XLSX.utils.book_new();

  // uma aba por tipo de erro — pra acompanhar onde está concentrado o problema
  // (já filtrado pela subaba de status escolhida em Análises)
  CLASSIFICACOES_DIVERGENCIA.filter(c => c.valor !== 'sem_erro').forEach(cat => {
    const doTipo = todas.filter(r => r.classificacao === cat.valor).sort((a,b) => (b.atualizadoEm||'').localeCompare(a.atualizadoEm||''));
    if (doTipo.length === 0) return;
    const linhas = [header];
    doTipo.forEach(r => {
      const datas = r.datasStatus || {};
      linhas.push([
        r.nCT, r.numeroFatura || '', r.notaFiscal, r.canal || '', r.parceiroNome, r.dhEmi ? fmtDia(r.dhEmi) : '', r.destMun, r.destUF,
        r.valorCobradoSubtotal, r.valorRealSubtotal, r.valorRessarcir,
        (STATUS_TRATATIVA.find(s=>s.valor===(r.statusTratativa||'pendente'))||{}).label,
        datas.pendente ? fmtDate(datas.pendente) : '', datas.em_tratativa ? fmtDate(datas.em_tratativa) : '', datas.resolvido ? fmtDate(datas.resolvido) : '',
        r.detalhamentoErros || '', r.observacao || '',
      ]);
    });
    const ws = XLSX.utils.aoa_to_sheet(linhas);
    XLSX.utils.book_append_sheet(wb, ws, (cat.labelCurta || cat.label).slice(0, 31));
  });

  // aba de resumo, já refletindo o mesmo filtro de status
  const resumoLinhas = [[`Resumo — filtro: ${infoStatus ? infoStatus.label : 'Todos'}`], [], ['Tipo de erro', 'Quantidade', 'Valor total (R$)']];
  CLASSIFICACOES_DIVERGENCIA.filter(c => c.valor !== 'sem_erro').forEach(cat => {
    const doTipo = todas.filter(r => r.classificacao === cat.valor);
    resumoLinhas.push([cat.labelCurta || cat.label, doTipo.length, doTipo.reduce((a,r)=>a+Math.abs(r.valorRessarcir||0),0)]);
  });
  const wsResumo = XLSX.utils.aoa_to_sheet(resumoLinhas);
  XLSX.utils.book_append_sheet(wb, wsResumo, 'Resumo');
  wb.SheetNames.unshift(wb.SheetNames.pop()); // move Resumo pro início

  const sufixo = subAba === 'todos' ? '' : '_' + (infoStatus ? infoStatus.label.replace(/\s+/g, '') : subAba);
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  downloadBlob(new Blob([out], { type: 'application/octet-stream' }), `Analises_Divergencia${sufixo}.xlsx`);
}

</script>
