<script>
'use strict';
/* =========================================================================
   VALIDADOR DE FRETES — Grupo TBX
   Concilia CT-e (XML) emitidos pelos parceiros de transporte contra as
   tabelas de frete negociadas. Motor de cálculo genérico e configurável
   por parceiro (cada transportadora tem sua própria estrutura de tarifa).
   ========================================================================= */

// ---------------------------------------------------------------------
// 1. CONFIGURAÇÃO — troque pelos dados do SEU projeto Firebase antes de publicar
// ---------------------------------------------------------------------
// Versão deste arquivo — muda a cada entrega. Confira na barra lateral (rodapé) se o
// navegador está mesmo rodando essa versão antes de reportar um problema como bug.
const APP_VERSION = '2026-10-01-cores-prejuizo';

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBGctWGTrjLDwObmmSOzmE9Rec8CnHXXYg",
  authDomain: "validacao-de-frete.firebaseapp.com",
  projectId: "validacao-de-frete",
  storageBucket: "validacao-de-frete.firebasestorage.app",
  messagingSenderId: "732502396196",
  appId: "1:732502396196:web:7776a8e220a582bfddb7b1",
  measurementId: "G-VRE5RGH9X1",
};
const ALLOWED_DOMAIN = 'grupotbx.com.br';
const ALLOWED_EMAILS = [
  'wellinton.luz@grupotbx.com.br',
  'sara.silva@grupotbx.com.br',
  'felipe.turek@grupotbx.com.br',
  'eduardo.seremeta@grupotbx.com.br',
];
function emailAutorizado(email) {
  return !!email && ALLOWED_EMAILS.includes(email.toLowerCase().trim());
}
const FIREBASE_READY = FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('COLE_AQUI');

let app, auth, db;
let currentUser = null;
let OFFLINE_MODE = false; // true se Firebase não estiver configurado -> usa armazenamento local do navegador (apenas para teste)

// ---------------------------------------------------------------------
// 2. ESTADO EM MEMÓRIA
// ---------------------------------------------------------------------
const STATE = {
  parceiros: [],          // lista de configs de parceiro (ver seed abaixo p/ formato)
  editingParceiroId: null,
  ultimaValidacao: null,  // { parceiroId, resultados: [...], resumo: {...}, arquivosNaoIdentificados: [...] }
  historico: [],
  revisoes: {}, // por chave do CT-e: { classificacao, observacao, valorRessarcir, status, ... }
};

// ---------------------------------------------------------------------
// 3. UTILITÁRIOS
// ---------------------------------------------------------------------
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const uid = () => 'id_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const onlyDigits = (s) => (s || '').toString().replace(/\D/g, '');
const clamp2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;

function fmtBRL(n) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function fmtNum(n, dec=2) {
  if (n === null || n === undefined || isNaN(n)) return '—';
  return n.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtDia(iso) {
  if (!iso) return '—';
  try { return new Date(iso).toLocaleDateString('pt-BR'); } catch { return iso; }
}
// "FLUXO" nas observações da nota = reposição (produto reenviado ao cliente por conta da TBX)
// Reposição é identificada pela palavra "FLUXO" OU por "REPOSIÇÃO" — esta digitada à mão,
// então aceita variações e erros comuns: sem acento, Ç/C/S/SS/Z trocados, letra faltando ou
// trocada (ex: REPOSICAO, REPOSISAO, REPOSSIÇÃO, REPOZICAO, REPOSCAO, REPOSIÇOES, REPISIÇÃO, REP0SICAO).
function normTextoBusca(txt) {
  return (txt || '').toString().normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase()
    .replace(/(?<=[A-Z])0|0(?=[A-Z])/g, 'O'); // zero digitado no lugar de O
}
function distanciaEdicao(a, b) {
  const m = a.length, n = b.length;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function palavraIndicaReposicao(tok) {
  if (/^FLUXOS?$/.test(tok)) return true;
  if (tok.length < 7 || tok.length > 12 || !tok.startsWith('RE')) return false;
  if (/^(REPOSITOR|RECEPC|REPOST|REPASS|REPOSICION|REPORT|REPETIC|REQUISIC|REPARTIC|REVISA|RELACA|REDACA|REMOCA|REPROVA|REPRODU|RESCISA|REVOGA)/.test(tok)) return false; // palavras parecidas que não são reposição
  if (/^REPO[SZC]{1,2}I?[CSZ]{1,2}[AO]{1,3}(ES|S)?$/.test(tok)) return true;
  const base = tok.replace(/(OES|ES|S)$/, '');
  return distanciaEdicao(base, 'REPOSICAO') <= 2 || distanciaEdicao(tok, 'REPOSICOES') <= 2;
}
function posicaoReposicao(txt) {
  const norm = normTextoBusca(txt);
  const re = /[A-Z]+/g; let m;
  while ((m = re.exec(norm))) { if (palavraIndicaReposicao(m[0])) return m.index; }
  return -1;
}
function textoTemFluxo(txt) { return posicaoReposicao(txt) >= 0; }
function trechoFluxo(txt) {
  const t = (txt || '').toString().replace(/\s+/g, ' ');
  const i = posicaoReposicao(t);
  if (i < 0) return null;
  return (i > 60 ? '…' : '') + t.slice(Math.max(0, i - 60), i + 80) + (i + 80 < t.length ? '…' : '');
}
// Reposição: o cliente NUNCA paga esse frete — frete do cliente = 0 e o valor cobrado inteiro é
// prejuízo, mesmo que a NF tenha frete destacado. O valor da NF fica guardado só como referência.
function aplicarRegraReposicao(r) {
  if (!r || !('cobrado' in r) || !ehReposicao(r)) return;
  if (r.valorFreteCliente != null && r.valorFreteCliente !== 0 && r.freteNfOriginal == null) r.freteNfOriginal = r.valorFreteCliente;
  r.valorFreteCliente = 0;
  r.divergenciaCliente = clamp2(0 - (r.cobrado || 0));
}
// Devolução e reposição: prejuízo total (a TBX paga o frete inteiro, o cliente não paga nada)
function ehPrejuizoTotal(r) { return r.tipoOperacao === 'devolucao' || !!r.reposicao; }
function ehReposicao(r) { return !!r.reposicao && r.tipoOperacao !== 'devolucao'; }

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  } catch { return iso; }
}
function fmtCNPJ(v) {
  const s = onlyDigits(v).padStart(14, '0');
  if (s.length !== 14) return v || '—';
  return `${s.slice(0,2)}.${s.slice(2,5)}.${s.slice(5,8)}/${s.slice(8,12)}-${s.slice(12)}`;
}
function toast(msg, kind='info') {
  const el = $('#toast');
  const colors = { info:'bg-ink-900', success:'bg-emerald-700', error:'bg-red-700', warn:'bg-amber-700' };
  el.className = `fixed bottom-5 right-5 z-50 max-w-sm ${colors[kind]||colors.info} text-white text-sm rounded-xl shadow-2xl px-4 py-3 fade-in`;
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.add('hidden'), 3800);
}
function escapeHtml(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ---------------------------------------------------------------------
// 4. CAMADA DE DADOS — Firestore, com fallback em localStorage se o
//    Firebase ainda não tiver sido configurado (útil pra testar o site
//    localmente antes de publicar). Em produção configure o Firebase.
// ---------------------------------------------------------------------
const LOCAL_KEY = 'tbx_validador_fretes_v1';

function localDB_read() {
  try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || { parceiros: [], historico: [] }; }
  catch { return { parceiros: [], historico: [] }; }
}
function localDB_write(data) {
  localStorage.setItem(LOCAL_KEY, JSON.stringify(data));
}

// O Firestore recusa o documento INTEIRO se qualquer campo estiver `undefined` (ex:
// valorFreteCliente de um CT-e que ainda não tem NF-e casada). Era isso que impedia de
// gravar os CT-es e o detalhe do histórico. Remove os undefined antes de qualquer gravação.
function limparParaFirestore(obj) {
  return JSON.parse(JSON.stringify(obj, (k, v) => (typeof v === 'number' && !isFinite(v)) ? null : v));
}

// Divide o detalhe linha a linha do lote em partes de até ~700KB (limite do Firestore é
// 1MB por documento), pra lotes grandes também poderem ser reabertos pelo Histórico.
function dividirDetalheEmPartes(registro, limite = 700000) {
  const partes = [];
  let atual = { resultados: [], semParceiro: [], outrosFluxos: [], reentregas: [] };
  let tamanho = 0;
  ['resultados', 'semParceiro', 'outrosFluxos', 'reentregas'].forEach(campo => {
    (registro[campo] || []).forEach(item => {
      const t = JSON.stringify(item).length;
      if (tamanho + t > limite && tamanho > 0) {
        partes.push(atual);
        atual = { resultados: [], semParceiro: [], outrosFluxos: [], reentregas: [] };
        tamanho = 0;
      }
      atual[campo].push(item);
      tamanho += t;
    });
  });
  partes.push(atual);
  return partes;
}

// Quando a cota do Firebase estoura (plano gratuito: ~20 mil gravações e ~50 mil leituras
// por dia), o SDK não devolve erro na hora — fica tentando de novo em segundo plano e a
// tela parece "travada". Isso limita a espera e traduz o erro pra algo acionável.
function comTimeout(promessa, ms, rotulo) {
  return Promise.race([
    promessa,
    new Promise((_, rej) => setTimeout(() => { const e = new Error(`Tempo esgotado ao ${rotulo || 'gravar no banco'}`); e.code = 'timeout'; rej(e); }, ms)),
  ]);
}
function mensagemErroFirebase(e, acao) {
  const code = (e && (e.code || '')) + ' ' + (e && e.message || '');
  if (/resource-exhausted|quota/i.test(code)) return `Não foi possível ${acao}: o Firebase atingiu o limite diário do plano gratuito. O limite zera por volta das 4h (horário de Brasília) — ou ative o plano Blaze no console do Firebase.`;
  if (/timeout/i.test(code)) return `Não foi possível confirmar (${acao}): o banco não respondeu — provavelmente o limite diário do Firebase foi atingido ou a internet caiu. A gravação ficou na fila deste navegador e é enviada sozinha quando o Firebase voltar a aceitar; se tentar de novo, não duplica.`;
  if (/permission/i.test(code)) return `Não foi possível ${acao}: sem permissão no banco (confira se está logado com um e-mail autorizado).`;
  return `Não foi possível ${acao}. Detalhe no console (F12).`;
}

const DataLayer = {
  async listParceiros() {
    if (OFFLINE_MODE) return localDB_read().parceiros;
    const sinc = await dadosSincronizados('parceiros');
    if (sinc) return sinc;

  },
  async saveParceiro(parceiro) {
    if (OFFLINE_MODE) {
      const data = localDB_read();
      const idx = data.parceiros.findIndex(p => p.id === parceiro.id);
      if (idx >= 0) data.parceiros[idx] = parceiro; else data.parceiros.push(parceiro);
      localDB_write(data);
      return parceiro;
    }
    const { id, ...restBruto } = parceiro;
    const rest = limparParaFirestore(restBruto);
    rest.atualizadoEm = new Date().toISOString();
    if (id && !id.startsWith('novo_')) {
      await db.collection('parceiros').doc(id).set(rest, { merge: false });
      return { id, ...rest };

      const ref = await db.collection('parceiros').add(rest);

    }
  },
  async deleteParceiro(id) {
    if (OFFLINE_MODE) {
      const data = localDB_read();
      data.parceiros = data.parceiros.filter(p => p.id !== id);
      localDB_write(data);
      return;
    }
    await db.collection('parceiros').doc(id).delete();
  },
  async listHistorico() {
    if (OFFLINE_MODE) return (localDB_read().historico || []).sort((a,b) => (b.criadoEm||'').localeCompare(a.criadoEm||''));
    const sinc = await dadosSincronizados('historico');
    if (sinc) return sinc;
    const snap = await db.collection('validacoes').orderBy('criadoEm', 'desc').limit(30).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },
  async saveValidacao(registro) {
    registro.criadoEm = new Date().toISOString();
    registro.criadoPor = currentUser ? currentUser.email : 'offline';
    if (OFFLINE_MODE) {
      const data = localDB_read();
      registro.id = uid();
      data.historico = data.historico || [];
      data.historico.unshift(registro);
      data.historico = data.historico.slice(0, 20);
      try {
        localDB_write(data);
      } catch (e) {
        // localStorage cheio — tira o detalhe linha a linha das entradas mais antigas até caber
        console.warn('localStorage cheio, removendo detalhe de entradas antigas do histórico', e);
        for (let i = data.historico.length - 1; i >= 0 && i > 0; i--) {
          delete data.historico[i].resultados;
          delete data.historico[i].semParceiro;
          data.historico[i].detalheDisponivel = false;
          try { localDB_write(data); break; } catch (e2) { /* continua tirando detalhe */ }
        }
      }
      return registro;
    }
    const idFixo = registro._idFixo; delete registro._idFixo;
    const limpo = limparParaFirestore(registro);
    // id gerado antes de gravar: se a pessoa clicar de novo (ou o Firebase reenviar depois
    // de uma falha), grava no MESMO documento em vez de criar um lote duplicado
    const ref = idFixo ? db.collection('validacoes').doc(idFixo) : db.collection('validacoes').doc();
    if (!Array.isArray(limpo.resultados)) {
      await ref.set(limpo);
      return { id: ref.id, ...limpo };
    }
    // resumo no documento principal (é o que a lista do Histórico/Painel lê) e o detalhe
    // linha a linha numa subcoleção, que só é lida quando alguém abre o lote
    const partes = dividirDetalheEmPartes(limpo);
    const { resultados, semParceiro, outrosFluxos, reentregas, ...principal } = limpo;
    principal.detalheDisponivel = true;
    principal.detalheEmPartes = partes.length;
    const batch = db.batch();
    batch.set(ref, principal);
    partes.forEach((pt, i) => batch.set(ref.collection('partes').doc(String(i).padStart(3, '0')), { indice: i, ...pt }));
    await batch.commit();
    return { id: ref.id, ...principal };
  },
  async substituirValidacao(id, registro) {
    registro.recalculadoEm = new Date().toISOString();
    registro.recalculadoPor = currentUser ? currentUser.email : 'offline';
    if (OFFLINE_MODE) {
      const data = localDB_read();
      const item = (data.historico || []).find(h => h.id === id);
      if (item) { Object.assign(item, registro); localDB_write(data); }
      return;
    }
    const limpo = limparParaFirestore(registro);
    const ref = db.collection('validacoes').doc(id);
    // quantas partes existiam antes: vem da lista sincronizada (sem leitura extra)
    const conhecido = (SYNC.dados.historico || []).find(h => h.id === id);
    let partesAntigas = conhecido ? (conhecido.detalheEmPartes || 0) : null;
    if (partesAntigas === null) partesAntigas = (await ref.collection('partes').get()).size;
    const del = firebase.firestore.FieldValue.delete();
    const partes = dividirDetalheEmPartes(limpo);
    const { resultados, semParceiro, outrosFluxos, reentregas, ...principal } = limpo;
    const batch = db.batch();
    batch.update(ref, { ...principal, detalheDisponivel: true, detalheEmPartes: partes.length, resultados: del, semParceiro: del, outrosFluxos: del, reentregas: del });
    partes.forEach((pt, i) => batch.set(ref.collection('partes').doc(String(i).padStart(3, '0')), { indice: i, ...pt }));
    for (let i = partes.length; i < partesAntigas; i++) batch.delete(ref.collection('partes').doc(String(i).padStart(3, '0')));
    await batch.commit();
    if (STATE._detalheCache) delete STATE._detalheCache[id];
  },
  async carregarDetalheHistorico(h) {
    if (!h.detalheEmPartes || OFFLINE_MODE) return h;
    STATE._detalheCache = STATE._detalheCache || {};
    const cache = STATE._detalheCache[h.id];
    if (cache && cache.versao === (h.recalculadoEm || h.criadoEm)) return { ...h, ...JSON.parse(JSON.stringify(cache.dados)) };
    const snap = await db.collection('validacoes').doc(h.id).collection('partes').get();
    const docs = snap.docs.map(d => d.data()).sort((a, b) => a.indice - b.indice);
    if (docs.length < h.detalheEmPartes) throw new Error(`Detalhe incompleto: ${docs.length}/${h.detalheEmPartes} partes`);
    const junta = (campo) => docs.flatMap(d => d[campo] || []);
    const dados = { resultados: junta('resultados'), semParceiro: junta('semParceiro'), outrosFluxos: junta('outrosFluxos'), reentregas: junta('reentregas') };
    STATE._detalheCache[h.id] = { versao: h.recalculadoEm || h.criadoEm, dados: JSON.parse(JSON.stringify(dados)) };
    return { ...h, ...dados };
  },
  // Atualiza só o resumo (ex: totais financeiros) de um lote já salvo — usado quando a
  // pessoa importa as notas fiscais DEPOIS de já ter validado e salvo o lote de CT-es,
  // pra o Histórico não ficar com o "Faturado" desatualizado.
  async atualizarResumoHistorico(id, patchResumo) {
    if (!id) return;
    if (OFFLINE_MODE) {
      const data = localDB_read();
      const item = (data.historico || []).find(h => h.id === id);
      if (item) { item.resumo = { ...item.resumo, ...patchResumo }; localDB_write(data); }
      return;
    }
    // atualiza só os campos do resumo, direto (sem ler o documento antes)
    const upd = {};
    Object.entries(limparParaFirestore(patchResumo)).forEach(([k, val]) => { upd['resumo.' + k] = val; });
    await db.collection('validacoes').doc(id).update(upd);
  },

  // ----- Revisões de divergência (análise + tratativa com transportadora) -----

  // ----- Configuração da planilha de dimensões de produtos (fonte global, não por parceiro) -----

  // ----- CT-es e NF-es importados globalmente (persistem entre lotes/sessões) -----
  // Guardados por CHAVE de acesso (44 dígitos) — é o identificador único oficial da SEFAZ,
  // então serve tanto pra persistir os dados quanto pra bloquear reimportação duplicada.
  // Confere só as chaves do lote atual (em blocos de 30), em vez de ler a coleção inteira
  // de CT-es a cada upload — com milhares de CT-es salvos, ler tudo estourava a cota diária.
  async chavesExistentes(colecao, chaves) {
    const unicas = Array.from(new Set((chaves || []).filter(Boolean)));
    const existentes = new Set();
    if (!unicas.length) return existentes;
    if (OFFLINE_MODE) {
      const data = localDB_read();
      const mapa = colecao === 'ctes' ? (data.ctes || {}) : (data.notasFiscaisSalvas || {});
      unicas.forEach(c => { if (mapa[c]) existentes.add(c); });
      return existentes;
    }
    if (colecao === 'notasFiscais') {
      (await this.listNfesPorChaves(unicas)).forEach(n => existentes.add(n.chave));
      return existentes;
    }
    // CT-es: cada lote salvo registra TODAS as suas chaves num único documento
    // ('registroChaves'), então salvar um lote de 768 CT-es custa 1 gravação, não 768
    const alvo = new Set(unicas);
    for (let i = 0; i < unicas.length; i += 30) {
      const snap = await db.collection('registroChaves').where('chaves', 'array-contains-any', unicas.slice(i, i + 30)).get();
      snap.docs.forEach(d => (d.data().chaves || []).forEach(c => { if (alvo.has(c)) existentes.add(c); }));
    }
    // CT-es salvos pelo formato antigo (um documento por CT-e em 'ctes') continuam valendo
    if (await this._temLegado('ctes')) {
      const restantes = unicas.filter(c => !existentes.has(c));
      for (let i = 0; i < restantes.length; i += 30) {
        const snap = await db.collection('ctes').where(firebase.firestore.FieldPath.documentId(), 'in', restantes.slice(i, i + 30)).get();
        snap.docs.forEach(d => existentes.add(d.id));
      }
    }
    return existentes;
  },
  // existe algum documento no formato antigo? (1 leitura por sessão)
  async _temLegado(colecao) {
    STATE._legado = STATE._legado || {};
    if (!(colecao in STATE._legado)) {
      const snap = await db.collection(colecao).limit(1).get();
      STATE._legado[colecao] = snap.size > 0;
    }
    return STATE._legado[colecao];
  },
  async registrarChavesLote(idLote, nomeLote, chaves) {
    const unicas = Array.from(new Set((chaves || []).filter(Boolean)));

    if (OFFLINE_MODE) {

      localDB_write(data);

    await db.collection('registroChaves').doc(idLote).set({ chaves: unicas, qtd: unicas.length, nomeArquivo: nomeLote, numeroFatura: (STATE.ultimaValidacao && STATE.ultimaValidacao.numeroFatura) || null, criadoEm: new Date().toISOString(), criadoPor: currentUser ? currentUser.email : '' });
  },
  async listChavesCtes() {

  async salvarCtesEmLote(lista) {

  // atualiza (merge) os CT-es já gravados — mantém arquivoOrigem/importadoEm originais
  async atualizarCtesEmLote(lista) {
    if (!lista.length) return;
    if (OFFLINE_MODE) {
      const data = localDB_read();
      data.ctes = data.ctes || {};
      lista.forEach(c => { data.ctes[c.chave] = { ...(data.ctes[c.chave] || {}), ...c }; });
      localDB_write(data);
      return;
    }
    for (let i = 0; i < lista.length; i += 400) {
      const batch = db.batch();
      lista.slice(i, i + 400).forEach(c => batch.set(db.collection('ctes').doc(c.chave), limparParaFirestore(c), { merge: true }));
      await batch.commit();

  },
  // Planilha de notas: guardada em documentos-balde (500 notas cada, pelo número da NF),
  // com os dados em JSON — assim uma planilha de 14 mil linhas vira ~30 gravações em vez
  // de 14 mil, e casar um lote lê só os poucos baldes que interessam. Mantém sempre o
  // PRIMEIRO registro de cada nota (mesma regra de duplicidade dos CT-es/NF-es).
  _baldeNF(n) { return 'b' + Math.floor(parseInt(n, 10) / 500); },
  async salvarPlanilhaNotas(mapa, origem) {
    const porBalde = {};
    Object.values(mapa).forEach(n => { (porBalde[this._baldeNF(n.nNF)] = porBalde[this._baldeNF(n.nNF)] || {})[n.nNF] = n; });
    let novas = 0, jaExistiam = 0;
    const agora = new Date().toISOString();
    if (OFFLINE_MODE) {
      const data = localDB_read();
      data.planilhaNotas = data.planilhaNotas || {};
      Object.values(porBalde).forEach(b => Object.values(b).forEach(n => {
        if (data.planilhaNotas[n.nNF]) jaExistiam++; else { data.planilhaNotas[n.nNF] = { ...n, arquivoOrigem: origem, importadoEm: agora }; novas++; }
      }));
      localDB_write(data);
      return { novas, jaExistiam };
    }
    for (const [idBalde, notasNovas] of Object.entries(porBalde)) {
      const ref = db.collection('planilhaNotas').doc(idBalde);
      const doc = await ref.get();
      const atuais = doc.exists ? JSON.parse(doc.data().dados || '{}') : {};
      let mudou = false;
      Object.values(notasNovas).forEach(n => {
        if (atuais[n.nNF]) {
          jaExistiam++;
          if (!('fluxo' in atuais[n.nNF]) && 'fluxo' in n) { atuais[n.nNF].fluxo = n.fluxo; atuais[n.nNF].obsFluxo = n.obsFluxo ?? null; mudou = true; }
          return;
        }
        atuais[n.nNF] = { ...n, arquivoOrigem: origem, importadoEm: agora };
        novas++; mudou = true;
      });
      if (mudou) await ref.set({ dados: JSON.stringify(atuais), qtd: Object.keys(atuais).length, atualizadoEm: agora });
      (STATE._baldesPlanilha = STATE._baldesPlanilha || {})[idBalde] = atuais; // já fica em cache pra casar sem ler de novo
    }
    return { novas, jaExistiam };
  },
  async buscarPlanilhaNotas(numeros) {
    const unicos = Array.from(new Set((numeros || []).filter(Boolean)));
    if (!unicos.length) return {};
    if (OFFLINE_MODE) {
      const salvas = localDB_read().planilhaNotas || {};
      const out = {}; unicos.forEach(n => { if (salvas[n]) out[n] = salvas[n]; }); return out;
    }
    // baldes já lidos nesta sessão ficam em memória — recalcular/reabrir não lê de novo
    const cache = STATE._baldesPlanilha = STATE._baldesPlanilha || {};
    const baldes = Array.from(new Set(unicos.map(n => this._baldeNF(n))));
    const faltam = baldes.filter(b => !(b in cache));
    for (let i = 0; i < faltam.length; i += 30) {
      const chunk = faltam.slice(i, i + 30);
      const snap = await db.collection('planilhaNotas').where(firebase.firestore.FieldPath.documentId(), 'in', chunk).get();
      chunk.forEach(b => { cache[b] = {}; }); // balde inexistente também fica marcado (não consulta de novo)
      snap.docs.forEach(d => { cache[d.id] = JSON.parse(d.data().dados || '{}'); });
    }
    const out = {};
    unicos.forEach(n => { const dados = cache[this._baldeNF(n)]; if (dados && dados[n]) out[n] = dados[n]; });
    return out;
  },
  async listChavesNfes() {
    if (OFFLINE_MODE) return new Set(Object.keys(localDB_read().notasFiscaisSalvas || {}));
    const snap = await db.collection('notasFiscais').get();
    return new Set(snap.docs.map(d => d.id));
  },
  // Busca só as NF-es específicas que interessam (pelas chaves que os CT-es do lote atual
  // referenciam) — usado pra casar automaticamente com o que já foi salvo antes, sem
  // precisar buscar a coleção inteira nem depender do usuário reimportar o mesmo .zip de NF-e.
  _baldeNfe(chave) { const n = parseInt(String(chave).slice(25, 34), 10); return 'n' + (isNaN(n) ? 0 : Math.floor(n / 500)); },
  async _carregarBaldesNfe(ids) {
    const cache = STATE._nfeBaldes = STATE._nfeBaldes || {};
    const faltam = Array.from(new Set(ids)).filter(b => !(b in cache));
    for (let i = 0; i < faltam.length; i += 30) {
      const chunk = faltam.slice(i, i + 30);
      const snap = await db.collection('nfeBaldes').where(firebase.firestore.FieldPath.documentId(), 'in', chunk).get();
      chunk.forEach(b => { cache[b] = {}; });
      snap.docs.forEach(d => { cache[d.id] = JSON.parse(d.data().dados || '{}'); });
    }
    return cache;
  },
  // Busca só as NF-es que interessam (pelas chaves que os CT-es referenciam). Guardadas em
  // "baldes" de 500 números por documento — um lote inteiro costuma cair em 1 ou 2 baldes.
  async listNfesPorChaves(chaves) {
    const unicas = Array.from(new Set((chaves || []).filter(Boolean)));
    if (!unicas.length) return [];
    if (OFFLINE_MODE) {
      const salvas = localDB_read().notasFiscaisSalvas || {};
      return unicas.map(c => salvas[c]).filter(Boolean);
    }
    const cache = STATE._nfesCache = STATE._nfesCache || {};
    const faltam = unicas.filter(c => !(c in cache));
    if (faltam.length) {
      const baldes = await this._carregarBaldesNfe(faltam.map(c => this._baldeNfe(c)));
      faltam.forEach(c => { const n = baldes[this._baldeNfe(c)][c]; if (n) cache[c] = n; });
      // NF-es salvas no formato antigo (um documento por NF-e)
      const restantes = faltam.filter(c => !(c in cache));
      if (restantes.length && await this._temLegado('notasFiscais')) {
        for (let i = 0; i < restantes.length; i += 30) {
          const snap = await db.collection('notasFiscais').where(firebase.firestore.FieldPath.documentId(), 'in', restantes.slice(i, i + 30)).get();
          snap.docs.forEach(d => { cache[d.id] = d.data(); });
        }
      }
      faltam.forEach(c => { if (!(c in cache)) cache[c] = null; });
    }
    return unicas.map(c => cache[c]).filter(Boolean);
  },
  // Grava as NF-es em grupos de 500 números por documento. Vários grupos ao mesmo tempo
  // (bem mais rápido pra zips com dezenas de milhares de notas), cada grupo com nova tentativa
  // se falhar, e um grupo com erro não interrompe os outros.
  async salvarNfesEmLote(lista, onProgress) {
    if (!lista.length) return { novas: 0, completadas: 0, jaExistiam: 0 };
    if (OFFLINE_MODE) {
      const data = localDB_read();
      data.notasFiscaisSalvas = data.notasFiscaisSalvas || {};
      lista.forEach(n => { data.notasFiscaisSalvas[n.chave] = n; });
      localDB_write(data);
      return { novas: lista.length, completadas: 0, jaExistiam: 0 };
    }
    // só o que o site usa (sem descrição de produto/destinatário) — documentos menores, gravação mais rápida
    const enxuta = (n) => limparParaFirestore({ chave: n.chave, nNF: n.nNF, serie: n.serie, dhEmi: n.dhEmi, vNF: n.vNF, vFrete: n.vFrete,
      itens: (n.itens || []).map(i => ({ cProd: i.cProd, qCom: i.qCom })), fluxo: !!n.fluxo, obsFluxo: n.obsFluxo || null,
      arquivoOrigem: n.arquivoOrigem || null, importadoEm: n.importadoEm || null });
    const porBalde = {};
    lista.filter(n => n.chave).forEach(n => { (porBalde[this._baldeNfe(n.chave)] = porBalde[this._baldeNfe(n.chave)] || []).push(n); });
    const agora = new Date().toISOString();
    const cacheNfe = STATE._nfesCache = STATE._nfesCache || {};
    const tot = { novas: 0, completadas: 0, jaExistiam: 0 };
    const falhas = [];
    const gravarGrupo = async (idBalde, notas) => {
      const ref = db.collection('nfeBaldes').doc(idBalde);
      const doc = await ref.get(); // lê fresco pra não sobrescrever o que outra pessoa salvou
      const atuais = doc.exists ? JSON.parse(doc.data().dados || '{}') : {};
      const c = { novas: 0, completadas: 0, jaExistiam: 0 };
      let mudou = false;
      notas.forEach(n => {
        if (!atuais[n.chave]) { atuais[n.chave] = enxuta(n); mudou = true; c.novas++; }
        else if ('fluxo' in n && (!('fluxo' in atuais[n.chave]) || (n.fluxo && !atuais[n.chave].fluxo))) {
          // nota já existente: mantém o registro original e só completa a leitura das observações
          atuais[n.chave].fluxo = !!n.fluxo; atuais[n.chave].obsFluxo = n.obsFluxo ?? null; mudou = true; c.completadas++;
        } else c.jaExistiam++;
      });
      if (mudou) await ref.set({ dados: JSON.stringify(atuais), qtd: Object.keys(atuais).length, atualizadoEm: agora });
      (STATE._nfeBaldes = STATE._nfeBaldes || {})[idBalde] = atuais;
      notas.forEach(n => { cacheNfe[n.chave] = atuais[n.chave]; });
      return c;
    };
    const fila = Object.entries(porBalde);
    const total = fila.length;
    let feitos = 0;
    const trabalhador = async () => {
      while (fila.length) {
        const [idBalde, notas] = fila.shift();
        let c = null, erro = null;
        for (let tentativa = 1; tentativa <= 3 && !c; tentativa++) {
          try { c = await comTimeout(gravarGrupo(idBalde, notas), 60000, 'gravar um grupo de notas'); }
          catch (e) { erro = e; console.warn(`[NF-e] grupo ${idBalde}, tentativa ${tentativa} falhou:`, e); if (/resource-exhausted|quota|permission/i.test((e.code || '') + (e.message || ''))) break; }
        }
        if (c) { tot.novas += c.novas; tot.completadas += c.completadas; tot.jaExistiam += c.jaExistiam; }
        else falhas.push({ idBalde, qtd: notas.length, erro });
        feitos++;
        if (onProgress) onProgress(feitos, total, falhas.length);
      }
    };
    await Promise.all(Array.from({ length: Math.min(6, total) }, trabalhador));
    if (falhas.length) {
      const e = falhas[0].erro || new Error('falha desconhecida');
      e.message = `${falhas.reduce((a, f) => a + f.qtd, 0)} de ${lista.length} nota(s) não foram gravadas (${falhas.length} de ${total} grupo(s)) — suba o mesmo arquivo de novo que ele completa só o que faltou: ${e.message || e}`;
      e.parcial = tot;
      throw e;
    }
    return tot;
  },
};
