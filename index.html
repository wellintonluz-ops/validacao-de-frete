// Monta um texto automático listando TODOS os componentes que divergem entre cobrado e
// calculado (inclusive o ICMS), pra não depender só do que a pessoa escreveu na observação.
function montarDetalhamentoDivergencias(r) {
  const partes = [];

  // todos os componentes: só entra no relatório quando é cobrado A MAIOR que o calculado —
  // se bate ou o cliente/TBX pagou menos, não é um problema a reportar aqui (o objetivo
  // desse relatório é levantar cobrança indevida da transportadora, não o contrário)
  const divergentesMaior = [];
  r.calc.componentes.forEach(c => {
    if (c.manual) return;
    const achado = encontrarComponenteCobrado(r.cte, c.nome);
    if (achado.valor === undefined || !c.aplicavel || typeof c.valor !== 'number') return;
    const dif = clamp2(achado.valor - c.valor);
    if (dif > 0.05) {
      divergentesMaior.push({ nome: c.nome, dif });
      partes.push(`${c.nome}: cobrado ${fmtBRL(achado.valor)} vs calculado ${fmtBRL(c.valor)} (dif. +${fmtBRL(dif)})`);
    }
  });

  // cubagem própria: só vale a pena registrar quando FRETE PESO está de fato cobrado a
  // maior — se bate ou é cobrado a menor, a cubagem não é o problema, não precisa aparecer
  const freteDivergeMaior = divergentesMaior.find(d => d.nome === 'FRETE PESO');
  if (r.pesoCubadoInfo && freteDivergeMaior) {
    const info = r.pesoCubadoInfo;
    const pesoDeclarado = info.pesoDeclaradoCte;
    const pesoBate = pesoDeclarado != null && Math.abs(info.pesoFinal - pesoDeclarado) <= 0.5;
    if (pesoBate) {
      // peso confere — o problema é a taxa/faixa de excedente, não o peso (resumido)
      partes.push(`Cubagem própria confirma peso ${fmtNum(info.pesoFinal)}kg (igual ao CT-e) — divergência do Frete Peso é de taxa/excedente, não de peso.`);
    } else {
      // peso recalculado diverge do declarado — pode ser esse o motivo da divergência
      partes.push(`Cubagem própria: peso recalculado ${fmtNum(info.pesoFinal)}kg (volume ${fmtNum(info.volumeTotalM3,2)}m³ × fator ${fmtNum(info.fatorCubagem)}) diverge dos ${fmtNum(pesoDeclarado)}kg que a transportadora declarou.`);
    }
  }

  const reconciliacao = calcularReconciliacaoXml(r);
  reconciliacao.residuais.forEach(c => {
    partes.push(`${c.nome}: cobrado ${fmtBRL(c.valor)}, sem regra cadastrada pra comparar`);
  });
  // ICMS de propósito NÃO entra aqui — ele é calculado depois do subtotal (gross-up), é
  // consequência de uma divergência acima, não uma causa em si. O detalhamento fica
  // restrito aos componentes que de fato compõem o subtotal.
  return partes.length ? partes.join(' | ') : 'Nenhum componente cobrado a maior que o calculado.';
}

function montarRevisao(r, classificacao, observacao) {
  const reconciliacao = calcularReconciliacaoXml(r);
  const icmsCobrado = reconciliacao.componenteImposto ? reconciliacao.componenteImposto.valor : r.cte.vICMS;
  const subtotalCobrado = (r.cobrado != null && icmsCobrado != null) ? clamp2(r.cobrado - icmsCobrado) : null;
  const subtotalCalculado = r.calc.subtotalCalculado ?? null;
  const diferencaApurada = (subtotalCobrado != null && subtotalCalculado != null)
    ? clamp2(subtotalCobrado - subtotalCalculado) : null;
  // "Sem erro" = diferença já explicada (desconto, custo já considerado...) -> conta como ZERO,
  // seja positiva ou negativa. A diferença original fica guardada só como referência.
  const valorRessarcir = classificacao === 'sem_erro' ? 0 : diferencaApurada;

  const existente = STATE.revisoes[r.cte.chave];
  const statusAtual = existente?.statusTratativa || 'pendente';
  const datasStatus = { ...(existente?.datasStatus || {}) };
  if (!datasStatus[statusAtual]) datasStatus[statusAtual] = new Date().toISOString(); // primeira vez que essa análise existe

  const revisao = {
    chave: r.cte.chave,
    nCT: r.cte.nCT,
    parceiroNome: r.parceiro.nome,
    destMun: r.cte.destMun,
    destUF: r.cte.destUF,
    dhEmi: r.cte.dhEmi,
    notaFiscal: (r.cte.notasFiscais || [])[0]?.numero || null,
    canal: r.canal || null,
    numeroFatura: (STATE.ultimaValidacao && STATE.ultimaValidacao.numeroFatura) || null,
    tabelaUsada: r.tabelaAlternativa ? r.tabelaAlternativa.nome : null,
    reposicao: !!r.reposicao,
    classificacao,
    observacao,
    detalhamentoErros: montarDetalhamentoDivergencias(r),
    valorCobradoSubtotal: subtotalCobrado,
    valorRealSubtotal: subtotalCalculado,
    valorRessarcir,
    diferencaApurada,
    margemClienteApurada: r.divergenciaCliente ?? null,
    analisado: true,
    statusTratativa: classificacao === 'sem_erro' ? 'resolvido' : statusAtual,
    datasStatus,
  };
  if (classificacao === 'sem_erro' && !revisao.datasStatus.resolvido) revisao.datasStatus.resolvido = new Date().toISOString();
  return revisao;
}

async function salvarAnaliseAtual(idx) {
  const r = STATE.ultimaValidacao.resultados[idx];
  if (!r) return;
  const classificacao = $(`#selClassificacao-${idx}`).value;
  if (!classificacao) { toast('Escolha uma classificação antes de salvar.', 'error'); return; }
  const observacao = $(`#obsAnalise-${idx}`).value.trim();
  const revisao = montarRevisao(r, classificacao, observacao);

  const btnSalvar = document.getElementById(`btnSalvarAnalise-${idx}`);
  if (btnSalvar) { btnSalvar.disabled = true; btnSalvar.textContent = 'Salvando…'; btnSalvar.classList.add('opacity-60'); }
  try {
    await DataLayer.saveRevisao(revisao);
    STATE.revisoes[revisao.chave] = revisao;
    atualizarBadgeTratativas();
    toast(classificacao === 'sem_erro' ? 'Análise salva — marcado como analisado, diferença considerada R$ 0,00 (inclusive no Faturado).' : 'Análise salva.', 'success');
    if (STATE.ultimaValidacao) {
      renderResultadosValidacao();
      atualizarResumoDoLoteNoHistorico();
    }
    const modalAberto = document.querySelector('.fixed.inset-0');
    if (modalAberto) modalAberto.remove();
    abrirDetalheCte(idx);
  } catch (e) {
    console.error(e);
    toast(mensagemErroFirebase(e, 'salvar a análise'), 'error');
    if (btnSalvar) { btnSalvar.disabled = false; btnSalvar.textContent = 'Concluir análise'; btnSalvar.classList.remove('opacity-60'); }
  }
}

// ----- Classificação em massa (caixas de seleção na tabela de resultados) -----
function selecionadosSet() {
  if (!(STATE._selecionados instanceof Set)) STATE._selecionados = new Set();
  return STATE._selecionados;
}
function atualizarBarraSelecao() {
  const sel = selecionadosSet();
  const cont = $('#qtdSelecionados'); if (cont) cont.textContent = sel.size;
  const bar = $('#barraMassa'); if (bar) bar.classList.toggle('ring-2', sel.size > 0);
  const btn = $('#btnAplicarMassa'); if (btn) btn.disabled = sel.size === 0;
  const todos = $('#chkTodos');
  if (todos) {
    const visiveis = $$('.chk-cte');
    const marcados = visiveis.filter(c => c.checked).length;
    todos.checked = visiveis.length > 0 && marcados === visiveis.length;
    todos.indeterminate = marcados > 0 && marcados < visiveis.length;
  }
}
async function aplicarClassificacaoEmMassa() {
  const sel = selecionadosSet();
  const classificacao = $('#selMassaClassificacao')?.value;
  const obsNova = ($('#obsMassa')?.value || '').trim();
  if (!sel.size) { toast('Selecione pelo menos um CT-e na tabela.', 'warn'); return; }
  if (!classificacao) { toast('Escolha a classificação a aplicar.', 'error'); return; }
  const v = STATE.ultimaValidacao;
  const alvos = v.resultados.filter(r => sel.has(r.cte.chave));
  if (!alvos.length) { toast('Os CT-es selecionados não estão mais nesta validação.', 'warn'); sel.clear(); atualizarBarraSelecao(); return; }
  const revisoes = alvos.map(r => montarRevisao(r, classificacao, obsNova || STATE.revisoes[r.cte.chave]?.observacao || ''));
  const btn = $('#btnAplicarMassa');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando…'; }
  try {
    await DataLayer.saveRevisoesEmLote(revisoes);
    revisoes.forEach(rv => { STATE.revisoes[rv.chave] = rv; });
    atualizarBadgeTratativas();
    const info = CLASSIFICACOES_DIVERGENCIA.find(c => c.valor === classificacao);
    sel.clear();
    renderResultadosValidacao();
    atualizarResumoDoLoteNoHistorico();
    toast(`${revisoes.length} CT-e(s) classificado(s) como "${info ? info.labelCurta : classificacao}"${classificacao === 'sem_erro' ? ' — diferença considerada R$ 0,00 (inclusive no Faturado)' : ''}.`, 'success');
  } catch (e) {
    console.error(e);
    toast(mensagemErroFirebase(e, 'salvar as análises'), 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Aplicar aos selecionados'; }
  }
}

function renderInfoCubagem(r) {
  const info = r.pesoCubadoInfo;
  const declarado = info.pesoDeclaradoCte;
  const pesoBate = declarado != null && Math.abs(info.pesoFinal - declarado) <= 0.5;
  const divergePeso = !pesoBate;

  const compFretePeso = r.calc.componentes.find(c => c.nome === 'FRETE PESO');
  const achadoFretePeso = compFretePeso ? encontrarComponenteCobrado(r.cte, 'FRETE PESO') : null;
  const freteDiverge = compFretePeso && achadoFretePeso && achadoFretePeso.valor !== undefined && typeof compFretePeso.valor === 'number' && clamp2(achadoFretePeso.valor - compFretePeso.valor) > 0.05;
  const apontaErroTaxa = pesoBate && freteDiverge;

  const cls = (divergePeso || apontaErroTaxa) ? 'text-amber-800 bg-amber-50 border-amber-200' : 'text-ink-400 bg-ink-50 border-ink-200';
  return `
    <div class="mt-1.5 text-[11px] ${cls} border rounded-lg px-2.5 py-1.5">
      ${divergePeso ? '⚠ ' : ''}Cubagem própria: ${info.itensComDimensao} de ${info.totalItens} item(ns) da NF-e com dimensão cadastrada → volume total ${fmtNum(info.volumeTotalM3, 3)} m³ × fator ${fmtNum(info.fatorCubagem)} = peso cubado ${fmtBRL(info.pesoCubado).replace('R$','')}kg. Peso real: ${fmtNum(declarado != null ? (r.cte.pesoReal ?? 0) : 0)}kg. <strong>Peso usado: ${fmtNum(info.pesoFinal)}kg</strong> (o maior entre os dois)${declarado != null ? `, contra ${fmtNum(declarado)}kg que a transportadora declarou no CT-e` : ''}.
      ${info.semDimensao.length ? `<br>${info.semDimensao.length} produto(s) sem dimensão cadastrada na planilha: ${info.semDimensao.slice(0,5).map(s=>escapeHtml(s)).join(', ')}${info.semDimensao.length>5?'…':''}` : ''}
      ${apontaErroTaxa ? `<br><strong>⚠ O peso bate certinho com o CT-e — a diferença no Frete Peso não é por peso errado, é a taxa/faixa de excedente que não confere com a tabela negociada.</strong>` : ''}
    </div>`;
}

async function trocarTabelaDoCte(idx, idTabela) {
  const r = STATE.ultimaValidacao.resultados[idx];
  if (!r) return;
  const { tabela } = await aplicarTabelaAosCtes([r], idTabela || null);
  document.querySelectorAll('.fixed.inset-0').forEach(m => m.remove());
  abrirDetalheCte(idx);
  toast(tabela ? `CT-e ${r.cte.nCT} recalculado com "${tabela.nome}".` : `CT-e ${r.cte.nCT} voltou pra tabela atual.`, 'success');
}

function abrirDetalheCte(idx) {
  const r = STATE.ultimaValidacao.resultados[idx];
  if (!r) return;
  const reconciliacao = calcularReconciliacaoXml(r);

  const rows = r.calc.componentes.map(c => {
    const achado = encontrarComponenteCobrado(r.cte, c.nome);
    const explicacaoCobrado = achado.valor === undefined ? '' : achado.tipo === 'exato'
      ? `Lido diretamente do componente "${achado.nomeXml}" no XML (nome idêntico ao da regra "${c.nome}").`
      : achado.tipo === 'sinonimo'
        ? `Casado com "${achado.nomeXml}" no XML — reconhecido como sinônimo conhecido de "${c.nome}".`
        : `Casado com "${achado.nomeXml}" no XML — nomes parecidos (um contém o outro), não é igual mas foi o mais próximo encontrado.`;
    const tooltipMatch = explicacaoCobrado ? `title="${escapeHtml(explicacaoCobrado)}"` : '';
    const diverge = achado.valor !== undefined && c.aplicavel && typeof c.valor === 'number' && Math.abs(achado.valor - c.valor) > 0.05;

    const cobradoTxt = achado.valor !== undefined
      ? `<span ${tooltipMatch} class="cursor-help border-b border-dotted ${diverge ? 'border-red-300' : 'border-ink-300'}">${fmtBRL(achado.valor)}</span>`
      : c.manual
        ? `<span class="text-ink-300 cursor-help border-b border-dotted border-ink-200" title="Regra marcada como manual — consta na tabela negociada mas não foi observada sendo cobrada nos CT-es analisados até agora">— não cobrado (regra manual)</span>`
        : `<span class="text-ink-300 cursor-help border-b border-dotted border-ink-200" title="Não encontramos nenhum componente no XML com nome parecido com '${escapeHtml(c.nome)}'">— não encontrado no XML</span>`;
    const tooltipCalculo = c.explicacao ? `title="${escapeHtml(c.explicacao)}"` : '';
    const calculadoTxt = c.manual
      ? `<span ${tooltipCalculo} class="text-amber-600 cursor-help border-b border-dotted border-amber-300">manual</span>`
      : (c.aplicavel ? `<span ${tooltipCalculo} class="cursor-help border-b border-dotted border-ink-300">${fmtBRL(c.valor)}</span>` : `<span ${tooltipCalculo} class="text-ink-300 cursor-help border-b border-dotted border-ink-200">não aplicável</span>`);

    return `
      <tr class="border-t border-ink-100 ${diverge ? 'bg-red-50' : ''}">
        <td class="px-3 py-2 ${diverge ? 'text-red-700 font-medium' : 'text-ink-700'}">${escapeHtml(c.nome)}${diverge ? ' ⚠' : ''}</td>
        <td class="px-3 py-2 text-right num ${diverge ? 'text-red-700 font-semibold' : 'text-ink-600'}">${cobradoTxt}</td>
        <td class="px-3 py-2 text-right num ${diverge ? 'text-red-700 font-semibold' : 'text-ink-600'}">${calculadoTxt}</td>
      </tr>`;
  }).join('');

  // cobranças que existem no XML mas não têm nenhuma regra cadastrada pra elas —
  // entram na MESMA tabela, com "CALCULADO" avisando que falta cadastro (espelhando
  // o aviso "não encontrado no XML" que já existe pro caminho inverso)
  const rowsSemCadastro = reconciliacao.residuais.map(c => `
    <tr class="border-t border-ink-100 bg-amber-50">
      <td class="px-3 py-2 text-amber-800 font-medium">${escapeHtml(c.nome)}</td>
      <td class="px-3 py-2 text-right num text-amber-800 font-semibold">${fmtBRL(c.valor)}</td>
      <td class="px-3 py-2 text-right num"><span class="text-amber-700" title="Essa cobrança existe no XML mas nenhuma regra cadastrada no parceiro corresponde a ela — cadastre em Parceiros pra ela entrar na conta.">— não encontrado no cadastro</span></td>
    </tr>`).join('');

  // o imposto (ICMS) também entra na comparação: o "calculado" é a fatia de imposto que
  // sobra dentro do TOTAL calculado (gross-up sobre o subtotal dos componentes de frete)
  const icmsCalculado = (r.calc.totalCalculado !== null && r.calc.subtotalCalculado !== null)
    ? clamp2(r.calc.totalCalculado - r.calc.subtotalCalculado) : null;
  const icmsCobrado = reconciliacao.componenteImposto ? reconciliacao.componenteImposto.valor : r.cte.vICMS;
  const icmsNome = reconciliacao.componenteImposto ? reconciliacao.componenteImposto.nome : 'ICMS (não discriminado no vPrest)';
  const icmsDiverge = icmsCobrado != null && icmsCalculado != null && Math.abs(icmsCobrado - icmsCalculado) > 0.05;

  // subtotal real cobrado = total do CT-e menos o imposto (assim compara maçã com maçã
  // contra o subtotal calculado, sem o efeito de amplificação do gross-up do ICMS)
  const subtotalCobrado = (r.cobrado != null && icmsCobrado != null) ? clamp2(r.cobrado - icmsCobrado) : null;
  const subtotalDiverge = subtotalCobrado !== null && r.calc.subtotalCalculado !== null && r.calc.subtotalCalculado !== undefined
    && Math.abs(subtotalCobrado - r.calc.subtotalCalculado) > 0.05;

  const explicacaoIcms = (r.cte.pICMS != null && r.calc.subtotalCalculado != null)
    ? `ICMS "por dentro": subtotal calculado (${fmtBRL(r.calc.subtotalCalculado)}) ÷ (1 - ${fmtNum(r.cte.pICMS,1)}%) = ${fmtBRL(r.calc.totalCalculado)} de total, então ICMS = total - subtotal = ${fmtBRL(icmsCalculado)}.`
    : 'Imposto (ICMS) — não precisa de regra cadastrada, é calculado por fórmula (gross-up) sobre o subtotal dos outros componentes.';

  const rowImposto = (icmsCobrado != null || icmsCalculado != null) ? `
    <tr class="border-t border-ink-100 ${icmsDiverge ? 'bg-red-50' : ''}">
      <td class="px-3 py-2 ${icmsDiverge ? 'text-red-700 font-medium' : 'text-ink-500'}" title="${escapeHtml(explicacaoIcms)}">${escapeHtml(icmsNome)}${icmsDiverge ? ' ⚠' : ''}</td>
      <td class="px-3 py-2 text-right num ${icmsDiverge ? 'text-red-700 font-semibold' : 'text-ink-500'}">${icmsCobrado != null ? fmtBRL(icmsCobrado) : '—'}</td>
      <td class="px-3 py-2 text-right num ${icmsDiverge ? 'text-red-700 font-semibold' : 'text-ink-500'} cursor-help border-b border-dotted border-ink-200" title="${escapeHtml(explicacaoIcms)}">${icmsCalculado != null ? fmtBRL(icmsCalculado) : '—'}</td>
    </tr>` : '';

  const notasFiscais = r.cte.notasFiscais || [];
  const nfsTxt = notasFiscais.length
    ? notasFiscais.map(n => `NF-e nº <strong>${n.numero}</strong>`).join(', ')
    : 'nenhuma NF-e vinculada encontrada no XML';
  const emissaoTxt = r.cte.dhEmi ? ` · emitido em <strong>${fmtDia(r.cte.dhEmi)}</strong>` : '';
  const canalTxt = (ehReposicao(r) ? ` · <span class="font-semibold text-amber-700" title="${escapeHtml(r.obsFluxo || '')}">REPOSIÇÃO (prejuízo total)</span>` : '') + (r.canal ? ` · canal <strong>${escapeHtml(r.canal)}</strong>${r.pedido ? ` · pedido ${escapeHtml(r.pedido)}` : ''}` : '');

  const infoNotaCliente = (() => {
    const partes = [];
    if (r.nfeVinculada) partes.push(`Nota do cliente casada: NF ${escapeHtml(r.nfeVinculada.nNF || '')} (${r.nfeVinculada.fonte === 'planilha' ? 'planilha Excel' : 'XML da NF-e'})`);
    else partes.push('Nenhuma nota do cliente (XML ou planilha) casada com este CT-e ainda');
    partes.push(r.reposicao ? `<strong class="text-amber-700">REPOSIÇÃO</strong> — ${escapeHtml(r.obsFluxo || 'FLUXO')}` : '"FLUXO"/"REPOSIÇÃO" não encontrado nas observações da nota/CT-e');
    return `<div class="mt-1.5 text-[11px] text-ink-400 bg-ink-50 border border-ink-200 rounded-lg px-2.5 py-1.5">${partes.join(' · ')}</div>`;
  })();
  const avisoReconciliacao = reconciliacao.temPendencia ? `
    <div class="mt-3 text-xs px-3 py-2.5 rounded-lg bg-amber-50 text-amber-800 border border-amber-200">
      ⚠ <strong>${fmtBRL(reconciliacao.somaResidual)}</strong> em cobrança(s) do XML (linha amarela acima) ainda não têm regra cadastrada — a divergência total pode estar inflada por isso, não necessariamente é cobrança indevida. Cadastre essa taxa em Parceiros pra ela entrar na conta.
    </div>` : '';

  const rawRows = (r.cte.compsBrutos || []).map(c => `
    <tr class="border-t border-ink-50">
      <td class="px-3 py-1.5 text-ink-600">${escapeHtml(c.nome)}</td>
      <td class="px-3 py-1.5 text-right num text-ink-500">${fmtBRL(c.valor)}</td>
    </tr>`).join('') || `<tr><td class="px-3 py-2 text-ink-300 italic" colspan="2">O XML não trouxe nenhum componente (Comp) discriminado.</td></tr>`;

  const chave = r.cte.chave;
  const revisaoExistente = STATE.revisoes[chave] || null;
  const valorRessarcirPreview = (subtotalCobrado != null && r.calc.subtotalCalculado != null)
    ? clamp2(subtotalCobrado - r.calc.subtotalCalculado) : null;
  const secaoAnalise = renderSecaoAnalise(idx, revisaoExistente, subtotalCobrado, r.calc.subtotalCalculado, valorRessarcirPreview);

  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-ink-950/50 p-4';
  modal.innerHTML = `
    <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto fade-in">
      <div class="p-5 border-b border-ink-100 flex items-center justify-between sticky top-0 bg-white">
        <div>
          <div class="text-sm font-semibold text-ink-900">CT-e ${escapeHtml(r.cte.nCT)} · ${escapeHtml(r.parceiro.nome)}</div>
          <div class="text-xs text-ink-400">${escapeHtml(r.cte.destMun)}/${escapeHtml(r.cte.destUF)} · região "${escapeHtml(r.calc.regiaoEncontrada || '—')}" · peso base cálc. ${fmtNum(r.cte.pesoBC ?? r.cte.pesoReal)} kg${r.pesoCubadoInfo ? ` <span class="text-ink-300">(peso usado no cálculo: ${fmtNum(r.pesoCubadoInfo.pesoFinal)} kg — cubagem própria)</span>` : ''}</div>
          <div class="text-xs text-ink-400 mt-0.5">${nfsTxt}${emissaoTxt}${canalTxt} · chave CT-e <span class="font-mono text-[10px]">${escapeHtml(r.cte.chave)}</span></div>
          ${renderAbrangenciaUsada(r)}
          ${infoNotaCliente}
          ${(() => {
            const rasc = rascunhosDoParceiro(r.parceiro);
            if (!rasc.length && !r.tabelaAlternativa) return '';
            return `<div class="mt-1.5 text-[11px] bg-amber-50 border border-amber-200 rounded-lg px-2.5 py-1.5 flex items-center gap-2">
              <span class="text-amber-800 font-medium whitespace-nowrap">Tabela do cálculo:</span>
              <select onchange="trocarTabelaDoCte(${idx}, this.value)" class="flex-1 border border-amber-200 rounded px-1.5 py-1 text-[11px] bg-white">
                <option value="">Tabela atual — ${escapeHtml(nomeOriginalParceiro(r.parceiro))}</option>
                ${rasc.map(t => `<option value="${t.id}" ${r.tabelaAlternativa && r.tabelaAlternativa.id === t.id ? 'selected' : ''}>${escapeHtml(t.nome)}</option>`).join('')}
              </select>
            </div>`;
          })()}
          ${r.pesoCubadoInfo ? renderInfoCubagem(r) : ''}
        </div>
        <button onclick="this.closest('.fixed').remove()" class="text-ink-400 hover:text-ink-700 text-xl leading-none shrink-0 ml-2">&times;</button>
      </div>
      <div class="p-5">
        <table class="w-full text-sm">
          <thead><tr class="text-[11px] uppercase text-ink-400"><th class="text-left px-3 pb-2">Componente</th><th class="text-right px-3 pb-2">Cobrado</th><th class="text-right px-3 pb-2">Calculado <span title="Passe o mouse sobre os valores calculados pra ver a fórmula usada" class="normal-case cursor-help">ⓘ</span></th></tr></thead>
          <tbody>${rows}${rowsSemCadastro}</tbody>
          <tfoot>
            <tr class="border-t-2 border-ink-200 font-semibold ${subtotalDiverge ? 'text-red-700' : ''}">
              <td class="px-3 py-2">Subtotal (sem ICMS)</td>
              <td class="px-3 py-2 text-right num">${subtotalCobrado !== null ? fmtBRL(subtotalCobrado) : '—'}</td>

            : r.divergenciaCliente > 0.05
              ? `Margem de R$ ${fmtNum(r.divergenciaCliente)} — o cliente pagou mais de frete do que a transportadora cobrou da TBX.`

        ${avisoReconciliacao}

        <details class="mt-4">
          <summary class="text-xs font-medium text-ink-500 cursor-pointer hover:text-ink-700">Ver exatamente como veio no XML do CT-e (componentes de vPrest)</summary>
          <table class="w-full text-xs mt-2 border border-ink-100 rounded-lg overflow-hidden">
            <thead><tr class="bg-ink-50 text-[10px] uppercase text-ink-400"><th class="text-left px-3 py-1.5">xNome (como está no XML)</th><th class="text-right px-3 py-1.5">vComp</th></tr></thead>

        </details>

        ${secaoAnalise}
      </div>
    </div>
  `;
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
  document.body.appendChild(modal);
}

// Compara a versão do parceiro salvo com a versão mais recente do modelo (TRILOG/FLYVILLE),
// pra você saber se está desatualizado só de olhar a lista, sem precisar validar nada.
function rotuloVersaoModelo(p) {
  const seedsPorNome = { 'TRILOG EXPRESS': seedParceiroTrilog, 'FLYVILLE TRANSPORTES': seedParceiroFlyville, 'ARLETE': seedParceiroArlete };
  const seedFn = seedsPorNome[normalizaNomeParceiro(p.nome)];
  if (!seedFn) return p.versaoModelo ? escapeHtml(p.versaoModelo) : '<span class="text-ink-300">—</span>';
  const versaoAtual = seedFn().versaoModelo;
  if (!p.versaoModelo) return `<span class="text-amber-600" title="Nunca foi carregado de um modelo, ou é de uma versão muito antiga">sem versão ⚠</span>`;
  if (p.versaoModelo === versaoAtual) return `<span class="text-emerald-600">${escapeHtml(p.versaoModelo)} ✓</span>`;
  return `<span class="text-amber-600" title="Versão mais recente disponível: ${escapeHtml(versaoAtual)}">${escapeHtml(p.versaoModelo)} ⚠ desatualizado</span>`;
}

async function novoParceiro(modelo) {
  STATE.editingParceiroId = null;
  const seeds = { trilog: seedParceiroTrilog, flyville: seedParceiroFlyville, arlete: seedParceiroArlete };
  if (seeds[modelo]) {
    const seed = seeds[modelo]();
    const existente = STATE.parceiros.find(p => normalizaNomeParceiro(p.nome) === normalizaNomeParceiro(seed.nome));
    if (existente) {
      const atualizar = confirm(`Já existe um parceiro cadastrado com esse nome ("${existente.nome}"). Deseja substituir a configuração dele pelo modelo mais recente (tarifas, regras e abrangência)? Qualquer ajuste manual feito nele será perdido.`);
      if (!atualizar) { editarParceiro(existente.id); return; }
      seed.id = existente.id;
    }
    STATE.editingParceiroId = seed.id && !seed.id.startsWith('novo_') ? seed.id : null;
    // salva na hora — não depende do usuário lembrar de clicar em "Salvar parceiro" na tela seguinte
    // (isso vale tanto pra criar quanto pra atualizar um parceiro já existente)
    try {
      const salvo = await DataLayer.saveParceiro(seed);
      STATE.parceiros = await DataLayer.listParceiros();
      const conferido = STATE.parceiros.find(p => p.id === salvo.id) || STATE.parceiros.find(p => normalizaNomeParceiro(p.nome) === normalizaNomeParceiro(seed.nome));
      const okTarifas = conferido && (conferido.motor?.tarifas || []).length === (seed.motor.tarifas || []).length;
      const okAbrangencia = conferido && (conferido.abrangencia || []).length === (seed.abrangencia || []).length;
      if (conferido && okTarifas && okAbrangencia) {
        toast(`Parceiro "${seed.nome}" salvo: ${seed.motor.tarifas.length} tarifas, ${seed.abrangencia.length} faixas de CEP.`, 'success');
      } else {
        toast(`Parceiro salvo, mas os números não batem com o esperado (${conferido ? (conferido.abrangencia||[]).length : '?'} de ${seed.abrangencia.length} faixas de CEP) — confira antes de validar.`, 'warn');
      }
      STATE._parceiroDraft = JSON.parse(JSON.stringify(conferido || seed));
      STATE.editingParceiroId = salvo.id;
    } catch (e) {
      console.error(e);
      toast('Não foi possível salvar automaticamente — confira os dados e clique em Salvar.', 'error');
      STATE._parceiroDraft = JSON.parse(JSON.stringify(seed));
    }
    goToView('parceiro-form');
    return;
  }
  STATE._parceiroDraft = {
    id: 'novo_' + uid(),
    nome: '', cnpj: '', origem: 'Garuva - SC', ativo: true,
    motor: { faixasPeso: [30,50,70,100], baseExcedente: 'por_kg', tarifas: [] },
    regrasAdicionais: [],
    abrangencia: [],
  };
  goToView('parceiro-form');
}

function editarParceiro(id) {
  const p = STATE.parceiros.find(p => p.id === id);
  if (!p) return;
  STATE.editingParceiroId = id;
  STATE._parceiroDraft = JSON.parse(JSON.stringify(p));
  goToView('parceiro-form');
}

async function moverParaRascunho(id) {
  const p = STATE.parceiros.find(x => x.id === id);
  if (!p || p.rascunho) return;
  const hoje = new Date();
  const dia = String(hoje.getDate()).padStart(2, '0') + '/' + String(hoje.getMonth() + 1).padStart(2, '0');
  let novoNome = `${p.nome} rascunho ${dia}`;
  let k = 2;
  while (STATE.parceiros.some(x => normalizaNomeParceiro(x.nome) === normalizaNomeParceiro(novoNome))) novoNome = `${p.nome} rascunho ${dia} (${k++})`;
  if (!confirm(`Mover a tabela de "${p.nome}" para rascunho?\n\nEla passa a se chamar "${novoNome}", deixa de ser usada automaticamente na validação e fica disponível pra ser escolhida na análise dos CT-es antigos. Depois você cadastra a tabela nova com o nome "${p.nome}".`)) return;
  const rasc = JSON.parse(JSON.stringify(p));
  rasc.nome = novoNome;
  rasc.rascunho = true;
  rasc.rascunhoDe = p.nome;
  rasc.rascunhoEm = hoje.toISOString();
  rasc.ativo = false;
  try {
    await DataLayer.saveParceiro(rasc);
    STATE.parceiros = await DataLayer.listParceiros();
    toast(`"${p.nome}" movida para rascunho como "${novoNome}".`, 'success');
    if (confirm(`Cadastrar agora a tabela nova de "${p.nome}"?\n\nEla começa como cópia da tabela antiga (mesmas regras, tarifas e abrangência) — é só importar as planilhas atualizadas por cima e salvar.`)) {
      const nova = JSON.parse(JSON.stringify(p));
      nova.id = 'novo_' + uid();
      delete nova.rascunho; delete nova.rascunhoDe; delete nova.rascunhoEm; delete nova.atualizadoEm;
      nova.ativo = true;
      STATE.editingParceiroId = null;
      STATE._parceiroDraft = nova;
      goToView('parceiro-form');
    } else {
      renderParceirosList();
    }
  } catch (e) {
    console.error(e);
    toast(mensagemErroFirebase(e, 'mover a tabela para rascunho'), 'error');
  }
}

async function excluirParceiro(id) {
  const p = STATE.parceiros.find(p => p.id === id);
  if (!confirm(`Excluir o parceiro "${p?.nome}"? Essa ação não pode ser desfeita.`)) return;
  await DataLayer.deleteParceiro(id);
  STATE.parceiros = await DataLayer.listParceiros();
  renderParceirosList();
  toast('Parceiro excluído.', 'success');
}

            <input id="fFatorCubagem" type="number" step="0.01" value="${p.fatorCubagem ?? ''}" placeholder="Ex: 300" class="mt-1 w-40 border border-ink-200 rounded-lg px-3 py-2 text-sm font-mono">
            <p class="text-[11px] text-ink-300 mt-1">Usado pra recalcular o peso cubado a partir das dimensões dos produtos (comprimento × largura × altura, em metros, × esse fator). O peso considerado no cálculo é sempre o maior entre peso real e peso cubado. Deixe em branco pra não recalcular (usa só o peso declarado no CT-e).</p>
          </div>
        </div>

        <!-- GRADE DE TARIFAS -->
        <div class="bg-white rounded-2xl shadow-panel border border-ink-100 p-6">
          <div class="flex items-center justify-between mb-1">
            <h2 class="font-semibold text-ink-900">Tabela de tarifas por UF / Região</h2>
            <button onclick="adicionarLinhaTarifa()" class="text-xs font-medium text-brand-600 hover:text-brand-700">+ Adicionar linha</button>
          </div>
          <p class="text-xs text-ink-400 mb-4">Uma linha por UF + Região de destino. Importe direto da planilha do parceiro ou digite manualmente.</p>
          <div class="flex items-center gap-2 mb-3">
            <button onclick="abrirImportador('tarifas')" class="text-xs font-medium bg-ink-50 hover:bg-ink-100 text-ink-700 px-3 py-1.5 rounded-lg border border-ink-200">📄 Importar de planilha (.xlsx)</button>
          </div>
          <div id="tarifaGridBox" class="overflow-x-auto"></div>
        </div>

        <!-- REGRAS ADICIONAIS -->
        <div class="bg-white rounded-2xl shadow-panel border border-ink-100 p-6">
          <div class="flex items-center justify-between mb-1">
            <h2 class="font-semibold text-ink-900">Taxas e regras adicionais</h2>
            <button onclick="adicionarRegra()" class="text-xs font-medium text-brand-600 hover:text-brand-700">+ Adicionar regra</button>
          </div>
          <p class="text-xs text-ink-400 mb-4">ADV, GRIS, pedágio, despacho, TDA, TAS, TEC… cada uma com seu próprio tipo de cálculo.</p>
          <div id="regrasBox" class="space-y-3"></div>
        </div>

        <!-- ABRANGÊNCIA -->
        <div class="bg-white rounded-2xl shadow-panel border border-ink-100 p-6">
          <div class="flex items-center justify-between mb-1">
            <h2 class="font-semibold text-ink-900">Abrangência (faixas de CEP → Região)</h2>
            <button onclick="abrirImportador('abrangencia')" class="text-xs font-medium bg-ink-50 hover:bg-ink-100 text-ink-700 px-3 py-1.5 rounded-lg border border-ink-200">📄 Importar de planilha (.xlsx)</button>
          </div>
          <p class="text-xs text-ink-400 mb-4">Define para qual "Região" (usada na tabela acima) cada CEP de destino pertence. Normalmente é a aba "Abrangência" da planilha do parceiro.</p>
          <div id="abrangenciaResumo"></div>
        </div>

        <!-- MAPEAMENTO DE REGIÃO -->
        <div class="bg-white rounded-2xl shadow-panel border border-ink-100 p-6">
          <div class="flex items-center justify-between mb-1">
            <h2 class="font-semibold text-ink-900">Mapeamento de nomes de região</h2>
            <button onclick="adicionarMapeamentoRegiao()" class="text-xs font-medium text-brand-600 hover:text-brand-700">+ Adicionar</button>
          </div>
          <p class="text-xs text-ink-400 mb-4">Use quando a aba de abrangência e a aba de tarifas nomeiam a mesma região de jeitos diferentes — ex: abrangência diz "CAPITAL", mas a tabela de tarifas usa o nome da cidade, tipo "CUIABÁ".</p>
          <div id="mapeamentoRegiaoBox"></div>
        </div>

        <!-- TAXA POR CIDADE (TDA / difícil acesso) -->
        <div class="bg-white rounded-2xl shadow-panel border border-ink-100 p-6">
          <div class="flex items-center justify-between mb-1">
            <h2 class="font-semibold text-ink-900">Taxa de difícil acesso por cidade (opcional)</h2>
            <button onclick="abrirImportador('tda_cidade')" class="text-xs font-medium bg-ink-50 hover:bg-ink-100 text-ink-700 px-3 py-1.5 rounded-lg border border-ink-200">📄 Importar de planilha (.xlsx)</button>
          </div>
          <p class="text-xs text-ink-400 mb-4">Alguns parceiros colocam a taxa de difícil acesso numa aba separada (UF + Cidade + Valor, geralmente aba "TDA"), em vez de uma coluna na abrangência. Importe aqui — o sistema mescla o valor na região certa da abrangência acima pelo nome da cidade. Use a regra "TDA" (tipo "valor fixo, só se a região tiver o sinalizador") lá em cima pra ativar o cálculo.</p>
          <div id="tdaCidadeResumo"></div>
        </div>

      </div>

      <!-- BARRA LATERAL -->
      <div class="sticky top-8 space-y-4">
        <div class="bg-white rounded-2xl shadow-panel border border-ink-100 p-5">
          <button onclick="salvarParceiro()" class="w-full bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold py-2.5 rounded-xl shadow-sm transition-colors">Salvar parceiro</button>
          <button onclick="goToView('parceiros')" class="w-full mt-2 text-sm text-ink-500 hover:text-ink-700 py-2">Cancelar</button>
        </div>
        <div class="bg-ink-950 text-ink-200 rounded-2xl p-5 text-xs leading-relaxed">
          <div class="font-semibold text-white mb-2">⚠ Antes de confiar no motor</div>
          Sempre que cadastrar um parceiro novo, valide o resultado contra CT-es reais já pagos (como fizemos com a TRILOG). Diferenças de R$ 0,00 em pelo menos ~95% dos CT-es é o sinal de que a receita está correta.
        </div>
        ${p.notasCalibracao ? `
        <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-2xl p-5 text-xs leading-relaxed">
          <div class="font-semibold mb-2">📋 Notas da calibração deste parceiro</div>
          ${p.notasCalibracao}
        </div>` : ''}
      </div>
    </div>

    <div id="importadorModal"></div>
  `;

  renderTarifaGrid();
  renderRegrasBox();
  renderAbrangenciaResumo();
  renderMapeamentoRegiaoBox();
  renderTdaCidadeResumo();
}

// ----- Faixas de peso -----
function aplicarFaixasPeso() {
  const p = STATE._parceiroDraft;
  const faixas = $('#fFaixas').value.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n)).sort((a,b) => a-b);
  const baseExcedente = $('#fBaseExcedente').value;
  const nAntigo = (p.motor.faixasPeso || []).length;
  p.motor.faixasPeso = faixas;
  p.motor.baseExcedente = baseExcedente;
  // ajusta o tamanho do array `valores` de cada linha de tarifa para bater com o novo nº de faixas
  (p.motor.tarifas || []).forEach(t => {
    const novos = faixas.map((_, i) => t.valores?.[i] ?? 0);
    t.valores = novos;
  });
  renderTarifaGrid();
  toast(`${faixas.length} faixa(s) de peso aplicada(s).`, 'success');
}

// ----- Grade de tarifas -----
function adicionarLinhaTarifa() {
  const p = STATE._parceiroDraft;
  const n = (p.motor.faixasPeso || []).length;
  p.motor.tarifas.push({ uf:'', regiao:'', valores: new Array(n).fill(0), excedente: 0, extras: {} });
  renderTarifaGrid();
}
function removerLinhaTarifa(i) {
  STATE._parceiroDraft.motor.tarifas.splice(i, 1);
  renderTarifaGrid();
}
function atualizarTarifaCampo(i, campo, valor) {
  STATE._parceiroDraft.motor.tarifas[i][campo] = valor;
}
function atualizarTarifaValor(i, j, valor) {
  STATE._parceiroDraft.motor.tarifas[i].valores[j] = parseFloat(valor) || 0;
}
function atualizarTarifaExtra(i, chave, valor) {
  STATE._parceiroDraft.motor.tarifas[i].extras = STATE._parceiroDraft.motor.tarifas[i].extras || {};
  if (valor === '') { STATE._parceiroDraft.motor.tarifas[i].extras[chave] = null; return; }
  let n = parseNumeroPlanilha(valor, { percentual: /_pct$/.test(chave) });
  if (/_pct$/.test(chave) && !isNaN(n)) {
    const regra = (STATE._parceiroDraft.regrasAdicionais || []).find(r => chave === r.id + '_pct');
    if (regra && regra.tipo === 'percentual_com_minimo') n = normalizaPercentualCarga(n);
  }
  STATE._parceiroDraft.motor.tarifas[i].extras[chave] = isNaN(n) ? null : n;
}

function colunasExtrasPorLinha() {
  // regras que têm algum campo "por linha" -> viram colunas extras na grade
  const p = STATE._parceiroDraft;
  const cols = [];
  (p.regrasAdicionais || []).forEach(r => {
    if (r.pctPorLinha) cols.push({ chave: r.id + '_pct', label: `${r.nome} %` });
    if (r.minPorLinha) cols.push({ chave: r.id + '_min', label: `${r.nome} mín.` });
    if (r.valorPorLinha) cols.push({ chave: r.id + '_valor', label: `${r.nome} R$` });
  });
  return cols;
}

function renderTarifaGrid() {
  const box = $('#tarifaGridBox');
  if (!box) return;
  const p = STATE._parceiroDraft;
  const faixas = p.motor.faixasPeso || [];
  const extrasCols = colunasExtrasPorLinha();
  const tarifas = p.motor.tarifas || [];

  if (tarifas.length === 0) {
    box.innerHTML = emptyState('Nenhuma linha de tarifa', 'Adicione uma linha manualmente ou importe da planilha do parceiro.');
    return;
  }

  const theadFaixas = faixas.map((f, i) => `<th class="text-right font-semibold px-2 py-2 whitespace-nowrap">≤ ${f}kg</th>`).join('');
  const theadExtras = extrasCols.map(c => `<th class="text-right font-semibold px-2 py-2 whitespace-nowrap">${escapeHtml(c.label)}</th>`).join('');

  box.innerHTML = `
    <table class="grid-table w-full text-xs border-collapse">
      <thead>
        <tr class="bg-ink-50 text-ink-500">
          <th class="text-left font-semibold px-2 py-2">UF</th>
          <th class="text-left font-semibold px-2 py-2">Região</th>
          ${theadFaixas}
          <th class="text-right font-semibold px-2 py-2 whitespace-nowrap">Excedente</th>
          ${theadExtras}
          <th class="px-2 py-2"></th>
        </tr>
      </thead>
      <tbody>
        ${tarifas.map((t, i) => `
          <tr>
            <td class="p-0"><input value="${escapeHtml(t.uf||'')}" onchange="atualizarTarifaCampo(${i},'uf',this.value.toUpperCase())" class="w-14 px-2 py-1.5 text-xs border-0 focus:bg-brand-50 uppercase"></td>
            <td class="p-0"><input value="${escapeHtml(t.regiao||'')}" onchange="atualizarTarifaCampo(${i},'regiao',this.value)" class="w-32 px-2 py-1.5 text-xs border-0 focus:bg-brand-50"></td>
            ${faixas.map((f,j) => `<td class="p-0"><input type="number" step="0.01" value="${t.valores?.[j] ?? 0}" onchange="atualizarTarifaValor(${i},${j},this.value)" class="w-20 px-2 py-1.5 text-xs text-right border-0 focus:bg-brand-50 num"></td>`).join('')}
            <td class="p-0"><input type="number" step="0.0001" value="${t.excedente ?? 0}" onchange="atualizarTarifaCampo(${i},'excedente',parseFloat(this.value)||0)" class="w-20 px-2 py-1.5 text-xs text-right border-0 focus:bg-brand-50 num"></td>
            ${extrasCols.map(c => `<td class="p-0"><input type="number" step="0.0001" value="${t.extras?.[c.chave] ?? ''}" onchange="atualizarTarifaExtra(${i},'${c.chave}',this.value)" class="w-20 px-2 py-1.5 text-xs text-right border-0 focus:bg-brand-50 num" placeholder="—"></td>`).join('')}
            <td class="p-0 text-center"><button onclick="removerLinhaTarifa(${i})" class="text-ink-300 hover:text-red-600 px-2">&times;</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

// ----- Regras adicionais -----
const TIPOS_REGRA = [
  { value:'percentual_com_minimo', label:'% sobre um valor, com mínimo (ex: ADV, GRIS)' },
  { value:'fixo_por_cte', label:'Valor fixo por CT-e (ex: Despacho, TAS)' },
  { value:'por_fracao_100kg', label:'Valor × fração de 100kg (ex: Pedágio)' },
  { value:'percentual_sobre_subtotal', label:'% sobre o subtotal já calculado (ex: TEC, Taxa Emergencial)' },
  { value:'lista_abrangencia', label:'Valor fixo, só se a região tiver o sinalizador (ex: TDA)' },
  { value:'manual', label:'Não calcular — só exibir para conferência manual' },
];

function adicionarRegra() {
  const p = STATE._parceiroDraft;
  p.regrasAdicionais = p.regrasAdicionais || [];
  p.regrasAdicionais.push({ id: 'r' + uid(), nome: 'Nova taxa', tipo: 'fixo_por_cte', base: 'vCarga', valor: 0, valorPorLinha: false });
  renderRegrasBox();
  renderTarifaGrid();
}
function removerRegra(i) {
  STATE._parceiroDraft.regrasAdicionais.splice(i, 1);
  renderRegrasBox();
  renderTarifaGrid();
}
function atualizarRegraCampo(i, campo, valor) {
  const regra = STATE._parceiroDraft.regrasAdicionais[i];
  regra[campo] = valor;
  if (!regra.base) regra.base = 'vCarga';
  renderRegrasBox();
  renderTarifaGrid();
}

function renderRegrasBox() {
  const box = $('#regrasBox');
  if (!box) return;
  const regras = STATE._parceiroDraft.regrasAdicionais || [];
  if (regras.length === 0) {
    box.innerHTML = emptyState('Nenhuma regra adicional', 'ADV, GRIS, pedágio, despacho… adicione conforme a tabela do parceiro.');
    return;
  }
  box.innerHTML = regras.map((r, i) => `
    <div class="border border-ink-200 rounded-xl p-4">
      <div class="flex items-center gap-3 mb-3">
        <input value="${escapeHtml(r.nome)}" onchange="atualizarRegraCampo(${i},'nome',this.value)" class="flex-1 font-medium text-sm border border-ink-200 rounded-lg px-3 py-1.5" placeholder="Nome da taxa (ex: GRIS)">
        <select onchange="atualizarRegraCampo(${i},'tipo',this.value)" class="text-xs border border-ink-200 rounded-lg px-2 py-1.5 max-w-[280px]">
          ${TIPOS_REGRA.map(t => `<option value="${t.value}" ${r.tipo===t.value?'selected':''}>${t.label}</option>`).join('')}
        </select>
        <button onclick="removerRegra(${i})" class="text-ink-300 hover:text-red-600 text-sm px-1">&times;</button>
      </div>
      ${renderCamposRegra(r, i)}
    </div>
  `).join('');
}

function renderCamposRegra(r, i) {
  const chk = (checked) => checked ? 'checked' : '';
  if (r.tipo === 'percentual_com_minimo') {
    return `
      <div class="grid grid-cols-4 gap-3 text-xs items-end">
        <div>
          <label class="text-ink-500">Base do percentual</label>
          <select onchange="atualizarRegraCampo(${i},'base',this.value)" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5">
            <option value="vCarga" ${r.base==='vCarga'?'selected':''}>Valor da carga (NF)</option>
          </select>
        </div>
        <div>
          <label class="text-ink-500">Percentual (ex: 0.003 = 0,3%)</label>
          <input type="number" step="0.0001" value="${r.pct ?? ''}" ${r.pctPorLinha?'disabled placeholder="vem da grade"':''} onchange="atualizarRegraCampo(${i},'pct',parseFloat(this.value))" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 num disabled:bg-ink-50">
        </div>
        <div>
          <label class="text-ink-500">Mínimo (R$)</label>
          <input type="number" step="0.01" value="${r.min ?? ''}" ${r.minPorLinha?'disabled placeholder="vem da grade"':''} onchange="atualizarRegraCampo(${i},'min',parseFloat(this.value))" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 num disabled:bg-ink-50">
        </div>
        <div class="flex flex-col gap-1">
          <label class="flex items-center gap-1.5 text-ink-500"><input type="checkbox" ${chk(r.pctPorLinha)} onchange="atualizarRegraCampo(${i},'pctPorLinha',this.checked)"> % varia por região</label>
          <label class="flex items-center gap-1.5 text-ink-500"><input type="checkbox" ${chk(r.minPorLinha)} onchange="atualizarRegraCampo(${i},'minPorLinha',this.checked)"> mínimo varia por região</label>
        </div>
      </div>`;
  }
  if (r.tipo === 'fixo_por_cte' || r.tipo === 'por_fracao_100kg' || r.tipo === 'lista_abrangencia') {
    const labelValor = r.tipo === 'por_fracao_100kg' ? 'Valor por fração de 100kg (R$)' : 'Valor (R$)';
    return `
      <div class="grid grid-cols-3 gap-3 text-xs items-end">
        <div>
          <label class="text-ink-500">${labelValor}</label>
          <input type="number" step="0.01" value="${r.valor ?? ''}" ${r.valorPorLinha?'disabled placeholder="vem da grade"':''} onchange="atualizarRegraCampo(${i},'valor',parseFloat(this.value))" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 num disabled:bg-ink-50">
        </div>
        <div class="flex items-end pb-1.5">
          <label class="flex items-center gap-1.5 text-ink-500"><input type="checkbox" ${chk(r.valorPorLinha)} onchange="atualizarRegraCampo(${i},'valorPorLinha',this.checked)"> valor varia por região</label>
        </div>
        ${r.tipo === 'lista_abrangencia' ? `<p class="text-[11px] text-ink-400 col-span-1">Aplica só quando a coluna "TDA" da abrangência tiver valor diferente de zero.</p>` : ''}
      </div>`;
  }
  if (r.tipo === 'percentual_sobre_subtotal') {
    return `
      <div class="grid grid-cols-3 gap-3 text-xs items-end">
        <div>
          <label class="text-ink-500">Percentual (ex: 0.045 = 4,5%)</label>
          <input type="number" step="0.0001" value="${r.pct ?? ''}" ${r.pctPorLinha?'disabled placeholder="vem da grade"':''} onchange="atualizarRegraCampo(${i},'pct',parseFloat(this.value))" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 num disabled:bg-ink-50">
        </div>
        <div class="flex items-end pb-1.5">
          <label class="flex items-center gap-1.5 text-ink-500"><input type="checkbox" ${chk(r.pctPorLinha)} onchange="atualizarRegraCampo(${i},'pctPorLinha',this.checked)"> % varia por região</label>
        </div>
        <p class="text-[11px] text-ink-400">Aplicado sobre a soma dos componentes já calculados antes desta regra (ordem da lista acima).</p>
      </div>`;
  }
  // manual
  return `
    <div class="text-xs">
      <label class="text-ink-500">Observação (aparece no relatório)</label>
      <textarea onchange="atualizarRegraCampo(${i},'obs',this.value)" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5" rows="2" placeholder="Por que não é calculado automaticamente?">${escapeHtml(r.obs||'')}</textarea>
    </div>`;
}

// ----- Abrangência: resumo -----
function renderAbrangenciaResumo() {
  const box = $('#abrangenciaResumo');
  if (!box) return;
  const rows = STATE._parceiroDraft.abrangencia || [];
  if (rows.length === 0) {
    box.innerHTML = emptyState('Nenhuma faixa de CEP importada', 'Importe a aba de abrangência da planilha do parceiro para o site conseguir identificar a região de cada CT-e.');
    return;
  }
  const ufs = Array.from(new Set(rows.map(r => r.uf))).sort();
  const regioesPorUf = ufs.map(uf => `${uf}: ${Array.from(new Set(rows.filter(r=>r.uf===uf).map(r=>r.regiao))).join(', ')}`);
  box.innerHTML = `
    <div class="flex items-center gap-2 text-sm text-ink-700 mb-2">
      <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span class="font-medium">${rows.length}</span> faixas de CEP em <span class="font-medium">${ufs.length}</span> UF(s)
    </div>
    <div class="text-xs text-ink-400 space-y-0.5">${regioesPorUf.map(s => `<div>${escapeHtml(s)}</div>`).join('')}</div>
    <button onclick="STATE._parceiroDraft.abrangencia=[]; renderAbrangenciaResumo(); renderTdaCidadeResumo();" class="mt-3 text-xs text-red-500 hover:text-red-700">Limpar abrangência</button>
  `;
}

// ----- Mapeamento de nomes de região -----
function adicionarMapeamentoRegiao() {
  const p = STATE._parceiroDraft;
  p.mapeamentoRegiao = p.mapeamentoRegiao || [];
  p.mapeamentoRegiao.push({ uf: '', de: '', para: '' });
  renderMapeamentoRegiaoBox();
}
function removerMapeamentoRegiao(i) {
  STATE._parceiroDraft.mapeamentoRegiao.splice(i, 1);
  renderMapeamentoRegiaoBox();
}
function atualizarMapeamentoRegiaoCampo(i, campo, valor) {
  STATE._parceiroDraft.mapeamentoRegiao[i][campo] = valor;
}
function renderMapeamentoRegiaoBox() {
  const box = $('#mapeamentoRegiaoBox');
  if (!box) return;
  const lista = STATE._parceiroDraft.mapeamentoRegiao || [];
  if (lista.length === 0) {
    box.innerHTML = '<p class="text-xs text-ink-300 italic">Nenhum mapeamento cadastrado — só é necessário se a busca de tarifa vier como "sem tarifa p/ região" na validação.</p>';
    return;
  }
  box.innerHTML = `
    <div class="space-y-2">
      ${lista.map((m,i) => `
        <div class="flex items-center gap-2">
          <input value="${escapeHtml(m.uf)}" onchange="atualizarMapeamentoRegiaoCampo(${i},'uf',this.value.toUpperCase())" placeholder="UF" class="w-16 border border-ink-200 rounded-lg px-2 py-1.5 text-xs uppercase">
          <input value="${escapeHtml(m.de)}" onchange="atualizarMapeamentoRegiaoCampo(${i},'de',this.value)" placeholder="Nome na abrangência (ex: CAPITAL)" class="flex-1 border border-ink-200 rounded-lg px-2 py-1.5 text-xs">
          <svg class="w-4 h-4 text-ink-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
          <input value="${escapeHtml(m.para)}" onchange="atualizarMapeamentoRegiaoCampo(${i},'para',this.value)" placeholder="Nome na tabela (ex: CUIABÁ)" class="flex-1 border border-ink-200 rounded-lg px-2 py-1.5 text-xs">

function colLetra(idx) {
  let n = idx, s = '';
  do { s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; } while (n >= 0);
  return s;
}

function adivinharLinhaCabecalho(grid) {
  for (let r = 0; r < Math.min(grid.length, 30); r++) {
    const row = grid[r] || [];
    const textos = row.filter(v => typeof v === 'string' && v.trim().length > 1);
    if (textos.length >= 3) return r;
  }
  return 0;
}

// ---------------------------------------------------------------------
// 10b. DETECÇÃO AUTOMÁTICA DO "PADRÃO TABELA" DO GRUPO TBX
// ---------------------------------------------------------------------
// A partir de jul/2026 as planilhas dos parceiros passaram a seguir um layout
// padronizado (arquivo "000 - Padrão Tabela"). Quando o cabeçalho bate com esse
// padrão, pré-preenche o mapeamento de colunas sozinho — a pessoa só confere e
// ajusta o que for específico daquele parceiro, em vez de mapear tudo na mão.
// Algumas planilhas têm DUAS abas de abrangência: uma base de referência geral (ex:
// "ABRANGÊNCIA", com acento, cheia de colunas extra tipo COD IBGE/UNIDADE/LOCAL) e a
// aba específica do parceiro pra importar de fato (ex: "ABRANGENCIA", sem acento, só
// com UF/CIDADE/CEP/CLASSIFICAÇÃO/PRAZO/TDA). Prefere sempre a batida exata (ignorando
// acento) antes de cair pra busca aproximada, senão pega a errada.
function escolherAbaAbrangencia(sheetNames) {
  // compara o texto ORIGINAL (sem tirar acento) — "ABRANGENCIA" e "ABRANGÊNCIA" são nomes
  // de aba diferentes de propósito, tirar o acento pra comparar faria as duas parecerem
  // iguais e pegaria sempre a primeira da lista (podendo ser a errada)
  const exata = sheetNames.find(n => n.trim().toUpperCase() === 'ABRANGENCIA');
  if (exata) return exata;
  return sheetNames.find(n => /abrang/i.test(n)) || sheetNames[0];
}

function normalizaCabecalho(s) {
  return (s || '').toString()
    .replace(/['"]/g, ' ')
    .replace(/[\r\n]+/g, ' ')
    .trim().toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ');
}

function detectarMapeamentoTarifasPadrao(headerRowVals) {
  const norm = headerRowVals.map(v => normalizaCabecalho(v));
  const acha = (pred) => norm.findIndex(pred);
  const mapeamento = {};
  const idxUf = acha(h => h === 'UF');
  const idxRegiao = acha(h => h.includes('CLASSIFICA'));
  if (idxUf < 0 || idxRegiao < 0) return null; // não é o padrão — não força nada

  mapeamento.uf = idxUf;
  mapeamento.regiao = idxRegiao;

  // faixas de peso: todas as colunas rotuladas "KG", na ordem em que aparecem
  const colunasKg = [];
  // reconhece tanto "KG" genérico (planilha em branco) quanto "30KG"/"50 KG" etc.
  // (planilha já preenchida, com o limiar embutido no próprio cabeçalho)
  norm.forEach((h, i) => { if (/^\d*\s*KG$/.test(h)) colunasKg.push(i); });
  colunasKg.forEach((col, i) => { mapeamento['faixa_' + i] = col; });

  mapeamento.excedente = acha(h => h.includes('FRETE') && h.includes('EXCEDENTE'));

  const regrasDetectadas = [];
  const idxGrisPct = norm.findIndex(h => h.includes('GRIS') && !h.includes('MINIMO'));
  const idxGrisMin = norm.findIndex(h => h.includes('GRIS') && h.includes('MINIMO'));
  if (idxGrisPct >= 0) regrasDetectadas.push({ nome: 'GRIS', tipo: 'percentual_com_minimo', base: 'vCarga', colPct: idxGrisPct, colMin: idxGrisMin >= 0 ? idxGrisMin : null });

  const idxAdvPct = norm.findIndex(h => h.includes('ADVALOR') && !h.includes('MINIMO'));
  const idxAdvMin = norm.findIndex(h => h.includes('ADVALOR') && h.includes('MINIMO'));
  if (idxAdvPct >= 0) regrasDetectadas.push({ nome: 'ADV', tipo: 'percentual_com_minimo', base: 'vCarga', colPct: idxAdvPct, colMin: idxAdvMin >= 0 ? idxAdvMin : null });

  const idxPedagio = norm.findIndex(h => h.includes('PEDAGIO'));
  if (idxPedagio >= 0) regrasDetectadas.push({ nome: 'PEDAGIO', tipo: 'por_fracao_100kg', colValor: idxPedagio });

  [['TAS', 'TAS'], ['DESPACHO', 'DESPACHO'], ['COLETA', 'COLETA'], ['TRT', 'TRT']].forEach(([chave, nome]) => {
    const i = norm.findIndex(h => h.includes('TAXA') && h.includes(chave));
    if (i >= 0) regrasDetectadas.push({ nome, tipo: 'fixo_por_cte', colValor: i });
  });

  // colunas "(INFORMAR TAXA)" — slots livres pro parceiro ter taxas extras; entram como
  // regra em branco (a pessoa só precisa dar um nome e conferir o tipo)
  let nInformar = 0;
  norm.forEach((h, i) => {
    if (h.includes('INFORMAR') && h.includes('TAXA')) {
      nInformar++;
      regrasDetectadas.push({ nome: '', tipo: 'fixo_por_cte', colValor: i });
    }
  });

  return { mapeamento, numFaixas: colunasKg.length, regrasDetectadas };
}

function detectarMapeamentoAbrangenciaPadrao(headerRowVals) {
  const norm = headerRowVals.map(v => normalizaCabecalho(v));
  const acha = (pred) => norm.findIndex(pred);
  const idxUf = acha(h => h === 'UF');
  const idxCepIni = acha(h => h.includes('CEP') && h.includes('INICIAL'));
  const idxCepFim = acha(h => h.includes('CEP') && h.includes('FINAL'));
  if (idxUf < 0 || idxCepIni < 0 || idxCepFim < 0) return null;
  return {
    uf: idxUf,
    cidade: acha(h => h.includes('CIDADE') || h.includes('MUNICIPIO')),
    cepIni: idxCepIni,
    cepFim: idxCepFim,
    regiao: acha(h => h.includes('CLASSIFICA') || h === 'REGIAO' || (h.includes('CAPITAL') && h.includes('INTERIOR'))),
    prazo: acha(h => h.includes('PRAZO')),
    tda: acha(h => h === 'TDA'),
  };
}

// Aplica a detecção automática ao estado atual do importador (chamada sempre que a
// planilha, a aba ou a linha de cabeçalho mudam). Só mexe no que detectou — não some
// com nada que a pessoa já tinha ajustado manualmente antes.
function aplicarDeteccaoAutomatica(st) {
  st._deteccaoAutomatica = false;
  const headerVals = (st.grid[st.headerRow] || []);
  if (st.tipo === 'tarifas') {
    const det = detectarMapeamentoTarifasPadrao(headerVals);
    if (!det) return;
    st.mapeamento = { ...st.mapeamento, ...det.mapeamento };
    st.numFaixas = det.numFaixas || st.numFaixas;
    det.regrasDetectadas.forEach(rd => {
      let alvo = rd.nome ? st.regrasImport.find(r => r.nome && normalizaNomeComponente(r.nome) === normalizaNomeComponente(rd.nome)) : null;
      if (!alvo) {
        alvo = { id: 'r' + uid(), nome: rd.nome, tipo: rd.tipo, base: rd.base || 'vCarga', obs: '', colPct: null, colMin: null, colValor: null, _existente: {} };
        st.regrasImport.push(alvo);
      }
      if (rd.colPct !== undefined && rd.colPct >= 0) alvo.colPct = rd.colPct;
      if (rd.colMin !== undefined && rd.colMin >= 0) alvo.colMin = rd.colMin;
      if (rd.colValor !== undefined && rd.colValor >= 0) alvo.colValor = rd.colValor;
    });
    st._deteccaoAutomatica = true;
  } else if (st.tipo === 'abrangencia') {
    const det = detectarMapeamentoAbrangenciaPadrao(headerVals);
    if (!det) return;
    Object.entries(det).forEach(([k, v]) => { if (v >= 0) st.mapeamento[k] = v; });
    st._deteccaoAutomatica = true;
  }
}

// ----- Regras dentro do assistente de importação -----
function adicionarRegraImport() {
  STATE._import.regrasImport.push({ id: 'r' + uid(), nome: '', tipo: 'percentual_com_minimo', base: 'vCarga', obs: '', colPct: null, colMin: null, colValor: null, _existente: {} });
  renderImportadorBody();
}
function removerRegraImport(i) {
  STATE._import.regrasImport.splice(i, 1);
  renderImportadorBody();
}
function atualizarRegraImportCampo(i, campo, valor) {
  STATE._import.regrasImport[i][campo] = valor;
  renderImportadorBody();
}

function renderRegrasImportSection(colOptions) {

      </div>

              <input value="${escapeHtml(r.nome)}" onchange="atualizarRegraImportCampo(${i},'nome',this.value)" placeholder="Nome (ex: GRIS)" class="flex-1 text-sm font-medium border border-ink-200 rounded-lg px-2.5 py-1.5">
              <select onchange="atualizarRegraImportCampo(${i},'tipo',this.value)" class="text-xs border border-ink-200 rounded-lg px-2 py-1.5 max-w-[260px]">
                ${TIPOS_REGRA.map(t => `<option value="${t.value}" ${r.tipo===t.value?'selected':''}>${t.label}</option>`).join('')}
              </select>
              <button onclick="removerRegraImport(${i})" class="text-ink-300 hover:text-red-600 px-1">&times;</button>
            </div>

        ${regras.length === 0 ? '<p class="text-xs text-ink-300 italic">Nenhuma regra ainda — clique em "+ Adicionar regra".</p>' : ''}
      </div>
    </div>
  `;

function renderCamposRegraImport(r, i, colOptions) {
  const selPct = `<select onchange="atualizarRegraImportCampo(${i},'colPct',this.value?parseInt(this.value):null)" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 text-xs">${colOptions(r.colPct)}</select>`;
  const selMin = `<select onchange="atualizarRegraImportCampo(${i},'colMin',this.value?parseInt(this.value):null)" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 text-xs">${colOptions(r.colMin)}</select>`;
  const selValor = `<select onchange="atualizarRegraImportCampo(${i},'colValor',this.value?parseInt(this.value):null)" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 text-xs">${colOptions(r.colValor)}</select>`;

  if (r.tipo === 'percentual_com_minimo') {
    return `
      <div class="grid grid-cols-2 gap-3 text-xs">
        <div><label class="text-ink-500">Coluna do percentual</label>${selPct}${r._existente?.pct!=null && r.colPct==null ? `<p class="text-[10px] text-ink-300 mt-0.5">Sem coluna mapeada, mantém o valor global atual (${r._existente.pct}).</p>` : ''}</div>
        <div><label class="text-ink-500">Coluna do mínimo (opcional)</label>${selMin}${r._existente?.min!=null && r.colMin==null ? `<p class="text-[10px] text-ink-300 mt-0.5">Sem coluna mapeada, mantém o valor global atual (R$ ${r._existente.min}).</p>` : ''}</div>
      </div>`;
  }
  if (r.tipo === 'fixo_por_cte' || r.tipo === 'por_fracao_100kg' || r.tipo === 'lista_abrangencia') {
    const label = r.tipo === 'por_fracao_100kg' ? 'Coluna do valor por fração de 100kg' : r.tipo === 'lista_abrangencia' ? 'Coluna do valor (opcional — se vazio, usa o valor do sinalizador da abrangência)' : 'Coluna do valor fixo';
    return `<div class="text-xs"><label class="text-ink-500">${label}</label>${selValor}${r._existente?.valor!=null && r.colValor==null ? `<p class="text-[10px] text-ink-300 mt-0.5">Sem coluna mapeada, mantém o valor global atual (R$ ${r._existente.valor}).</p>` : ''}</div>`;
  }
  if (r.tipo === 'percentual_sobre_subtotal') {
    return `<div class="text-xs"><label class="text-ink-500">Coluna do percentual</label>${selPct}</div>`;
  }
  return `<div class="text-xs"><label class="text-ink-500">Observação</label><input onchange="atualizarRegraImportCampo(${i},'obs',this.value)" value="${escapeHtml(r.obs||'')}" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5"></div>`;
}

function confirmarImportacao() {
  const st = STATE._import;
  const p = STATE._parceiroDraft;
  const linhas = extrairLinhasMapeadas(st.grid, st.headerRow, st.mapeamento);

  if (st.tipo === 'tarifas') {
    const nFaixas = st.numFaixas;
    // linha bruta da planilha correspondente a cada `linhas[k]`, na mesma ordem, pra ler as colunas das regras
    const linhasBrutas = (st.grid || []).slice(st.headerRow + 1).filter(row => !(row || []).every(v => v === null || v === undefined || v === ''));

    const novas = linhas.map((l, k) => {
      const valores = [];
      for (let i = 0; i < nFaixas; i++) valores.push(parseNumeroPlanilha(l['faixa_'+i]) || 0);
      const extras = {};
      (st.regrasImport || []).forEach(r => {
        if (!r.nome) return;
        const row = linhasBrutas[k] || [];
        const num = (v, pct) => { const n = parseNumeroPlanilha(v, { percentual: pct }); return isNaN(n) ? null : n; };
        if (r.colPct != null) {
          let n = num(row[r.colPct], true);
          if (n !== null && r.tipo === 'percentual_com_minimo') n = normalizaPercentualCarga(n);
          if (n !== null && r.tipo === 'percentual_sobre_subtotal' && n > 1) n = n / 100;
          if (n !== null) extras[r.id+'_pct'] = n;
        }
        if (r.colMin != null) { const n = num(row[r.colMin], false); if (n !== null) extras[r.id+'_min'] = n; }
        if (r.colValor != null) { const n = num(row[r.colValor], false); if (n !== null) extras[r.id+'_valor'] = n; }
      });
      return {
        uf: (l.uf || '').toString().toUpperCase().trim(),
        regiao: (l.regiao || '').toString().trim(),
        valores,
        excedente: parseNumeroPlanilha(l.excedente) || 0,
        extras,
      };
    }).filter(t => t.uf && t.regiao);

    if (novas.length === 0) { toast('Nenhuma linha válida encontrada com esse mapeamento.', 'error'); return; }
    if (p.motor.tarifas.length > 0 && !confirm(`Isso vai substituir as ${p.motor.tarifas.length} linhas atuais da grade por ${novas.length} novas linhas. Continuar?`)) return;
    p.motor.tarifas = novas;

    // cria/atualiza as regras adicionais definidas no importador
    const novasRegras = (st.regrasImport || []).filter(r => r.nome && r.nome.trim()).map(r => {
      const existente = (p.regrasAdicionais || []).find(x => x.id === r.id) || {};
      const regra = { ...existente, id: r.id, nome: r.nome.trim(), tipo: r.tipo, base: r.base || 'vCarga', obs: r.obs || existente.obs || '' };
      if (r.tipo === 'percentual_com_minimo') {
        if (r.colPct != null) regra.pctPorLinha = true;
        if (r.colMin != null) regra.minPorLinha = true;
      } else if (r.tipo === 'fixo_por_cte' || r.tipo === 'por_fracao_100kg' || r.tipo === 'lista_abrangencia') {
        if (r.colValor != null) regra.valorPorLinha = true;
      } else if (r.tipo === 'percentual_sobre_subtotal') {
        if (r.colPct != null) regra.pctPorLinha = true;
      }
      return regra;
    });
    p.regrasAdicionais = novasRegras;

    renderTarifaGrid();
    renderRegrasBox();
    toast(`${novas.length} linhas de tarifa e ${novasRegras.length} regra(s) importadas.`, 'success');
    const faltando = novasRegras.filter(r => r.pctPorLinha).map(r => ({ nome: r.nome, n: novas.filter(t => !(t.extras[r.id + '_pct'] > 0)).length })).filter(x => x.n > 0);
    if (faltando.length) {
      setTimeout(() => toast(`Atenção: ${faltando.map(f => `${f.nome} sem percentual em ${f.n} linha(s)`).join(' · ')} — nessas regiões só o mínimo será cobrado. Confira a grade abaixo.`, 'warn'), 400);
    }
  } else if (st.tipo === 'abrangencia') {
    const novas = linhas.map(l => ({
      uf: (l.uf || '').toString().toUpperCase().trim(),
      cidade: (l.cidade || '').toString().trim(),
      cepIni: parseInt(onlyDigits(l.cepIni), 10),
      cepFim: parseInt(onlyDigits(l.cepFim), 10),
      regiao: (l.regiao || '').toString().trim(),
      tda: parseFloat(l.tda) || 0,
      prazo: parseFloat(l.prazo) || null,
    })).filter(a => a.uf && !isNaN(a.cepIni) && !isNaN(a.cepFim));

    if (novas.length === 0) {
      const semUf = linhas.filter(l => !((l.uf||'').toString().trim())).length;
      const semCepIni = linhas.filter(l => isNaN(parseInt(onlyDigits(l.cepIni), 10))).length;
      const semCepFim = linhas.filter(l => isNaN(parseInt(onlyDigits(l.cepFim), 10))).length;
      console.warn('[Importador abrangência] mapeamento usado:', mapeamento);
      console.warn('[Importador abrangência] linhas lidas (bruto):', linhas.slice(0, 3));

      // heurística: será que os valores de UF/cidade/CEP estão em colunas trocadas?
      // procura, entre as próprias colunas mapeadas, se alguma tem cara de CEP (8 dígitos)
      // ou de UF (2 letras) que faria mais sentido no lugar de outra.
      const pareceCep = (v) => /^\d{7,8}$/.test(onlyDigits(v || ''));
      const pareceUf = (v) => /^[A-Za-zÀ-ú]{2}$/.test((v||'').toString().trim());
      const amostra = linhas[0] || {};
      let dica = '';
      if (pareceCep(amostra.uf) || pareceCep(amostra.cidade)) {
        dica = ' O valor que caiu na coluna "UF" ou "Cidade" parece um CEP (ex: "' + (amostra.uf ?? amostra.cidade) + '") — as colunas do cabeçalho da planilha provavelmente não batem com a ordem real dos dados. Confira se CEP inicial/CEP final não estão nas colunas que o cabeçalho chama de "UF"/"Cidade".';
      }
      toast(`Nenhuma linha válida em ${linhas.length} lida(s): ${semUf} sem UF, ${semCepIni} com CEP inicial inválido, ${semCepFim} com CEP final inválido.${dica} Veja o console (F12) pra detalhes.`, 'error');
      return;
    }
    if (p.abrangencia.length > 0 && !confirm(`Isso vai substituir as ${p.abrangencia.length} faixas de CEP atuais por ${novas.length} novas. Continuar?`)) return;
    p.abrangencia = novas;
    renderAbrangenciaResumo();
    renderTdaCidadeResumo();
    toast(`${novas.length} faixas de CEP importadas.`, 'success');
  } else if (st.tipo === 'tda_cidade') {
    const normCidade = (s) => (s||'').toString().trim().toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    const taxas = linhas.map(l => ({
      uf: (l.uf || '').toString().toUpperCase().trim(),
      cidade: normCidade(l.cidade),
      valor: parseFloat(l.valor) || 0,
    })).filter(t => t.uf && t.cidade);

    if (taxas.length === 0) { toast('Nenhuma linha válida encontrada com esse mapeamento.', 'error'); return; }
    if (!p.abrangencia || p.abrangencia.length === 0) { toast('Importe primeiro a abrangência (faixas de CEP) — a taxa é mesclada nela pelo nome da cidade.', 'error'); return; }

    let casadas = 0;
    taxas.forEach(t => {
      p.abrangencia.forEach(a => {
        if ((a.uf||'').toUpperCase().trim() === t.uf && normCidade(a.cidade) === t.cidade) {
          a.tda = t.valor;
          casadas++;
        }
      });
    });
    const naoCasadas = taxas.length - casadas;
    renderAbrangenciaResumo();
    renderTdaCidadeResumo();
    toast(`${casadas} faixa(s) de CEP receberam taxa. ${taxas.length} cidade(s) lidas da planilha${casadas < taxas.length ? ' — algumas não encontraram cidade correspondente na abrangência' : ''}.`, casadas>0?'success':'warn');
  }
  fecharImportador();
}

// ----- Salvar parceiro -----
async function salvarParceiro() {
  const p = STATE._parceiroDraft;
  p.nome = $('#fNome').value.trim();
  p.cnpj = onlyDigits($('#fCnpj').value);
  p.origem = $('#fOrigem').value.trim();
  p.ativo = $('#fAtivo').checked;
  const fatorInput = $('#fFatorCubagem').value;
  p.fatorCubagem = fatorInput ? parseFloat(fatorInput) : null;

  if (!p.nome) { toast('Informe o nome do parceiro — é ele que casa o CT-e ao parceiro (não o CNPJ, já que um parceiro pode emitir por mais de um CNPJ).', 'error'); return; }
  if (p.cnpj && p.cnpj.length !== 14) { toast('O CNPJ informado está incompleto (precisa ter 14 dígitos) — ou deixe em branco, ele é só informativo.', 'error'); return; }
  const duplicado = STATE.parceiros.find(x => normalizaNomeParceiro(x.nome) === normalizaNomeParceiro(p.nome) && x.id !== p.id);
  if (duplicado) { toast(`Já existe um parceiro com esse nome: ${duplicado.nome}. Renomeie um dos dois pra evitar ambiguidade na hora de casar o CT-e.`, 'error'); return; }

  try {
    const salvo = await DataLayer.saveParceiro(p);
    STATE.parceiros = await DataLayer.listParceiros();
    STATE.editingParceiroId = null;
    STATE._parceiroDraft = null;
    toast('Parceiro salvo com sucesso.', 'success');
    goToView('parceiros');
  } catch (e) {
    console.error(e);
    toast('Não foi possível salvar. Confira o console para detalhes.', 'error');
  }
}

// Reabre a tela de comparação (igual a aba Validar Fretes) a partir de um lote do histórico
async function abrirHistoricoDetalhe(indice) {
  if (!(await podeSairDaValidacao())) return;
  let h = STATE.historico[indice];
  if (h && h.detalheEmPartes && !h.resultados) {
    toast('Carregando detalhe do lote…', 'info');
    try { h = await DataLayer.carregarDetalheHistorico(h); STATE.historico[indice] = h; }
    catch (e) { console.error(e); toast('Não foi possível carregar o detalhe desse lote.', 'error'); return; }
  }
  if (!h || !h.resultados) { toast('Detalhe não disponível para este lote.', 'warn'); return; }
  STATE.ultimaValidacao = {
    historicoId: h.id || null,
    nomeArquivo: h.nomeArquivo,
    numeroFatura: h.numeroFatura || null,
    duplicadosIgnorados: h.resumo?.duplicadosIgnorados || 0,
    resultados: h.resultados,
    semParceiro: h.semParceiro || [],
    outrosFluxos: h.outrosFluxos || [],
    reentregas: h.reentregas || [],
  };
  STATE.ultimaValidacao._resumoGravado = { ...(h.resumo || {}) };
  STATE._filtroAtual = 'todos';
  STATE._filtrosRes = {};
  STATE._selecionados = new Set();
  goToView('validar');
  setTimeout(() => atualizarResumoDoLoteNoHistorico(), 50);
  // a view de Validar Fretes normalmente é montada vazia (esperando upload); aqui já
  // temos os resultados prontos, então renderiza a comparação direto por cima
  setTimeout(() => renderResultadosValidacao(), 0);
}

          ${historico.map((h, i) => {
            const temDetalhe = h.detalheDisponivel && (Array.isArray(h.resultados) || h.detalheEmPartes > 0);

function skeletonRows() {
  return `<div class="space-y-2">${Array.from({length:4}).map(()=>'<div class="h-12 skeleton rounded-xl"></div>').join('')}</div>`;
}

async function carregarPreviaProdutos() {
  const url = $('#fUrlProdutos').value.trim();
  const apiKey = $('#fApiKeyProdutos').value.trim();
  if (!url) { toast('Cole o link da planilha.', 'error'); return; }
  if (!apiKey) { toast('Cole a chave de API do Google (veja "Como conseguir" abaixo do campo).', 'error'); return; }
  const box = $('#previaProdutosBox');
  box.innerHTML = `<div class="bg-white rounded-2xl border border-ink-100 p-4 text-sm text-ink-400">Carregando…</div>`;
  try {
    const grid = await buscarGridProdutos(url, apiKey);
    STATE._produtosDraft.url = url;
    STATE._produtosDraft.apiKey = apiKey;
    STATE._produtosDraft.grid = grid;
    // tenta detectar automaticamente as colunas por palavras-chave comuns, olhando a
    // primeira linha que pareça um cabeçalho (mesmo que se repita depois no meio dos dados)
    const linhaCabecalho = grid.find(row => (row || []).some(v => normalizaCabecalho(v).includes('LARGURA'))) || [];
    const header = linhaCabecalho.map(v => normalizaCabecalho(v));
    const achaCol = (...termos) => header.findIndex(h => termos.some(t => h.includes(t)));
    if (STATE._produtosDraft.colSku === undefined) STATE._produtosDraft.colSku = achaCol('SKU', 'CODIGO') >= 0 ? achaCol('SKU', 'CODIGO') : 0;
    if (STATE._produtosDraft.colPeso === undefined) { const c = achaCol('PESO'); STATE._produtosDraft.colPeso = c >= 0 ? c : null; }
    if (STATE._produtosDraft.colLargura === undefined) STATE._produtosDraft.colLargura = achaCol('LARGURA', 'LARG');
    if (STATE._produtosDraft.colAltura === undefined) STATE._produtosDraft.colAltura = achaCol('ALTURA', 'ALT');
    if (STATE._produtosDraft.colComprimento === undefined) STATE._produtosDraft.colComprimento = achaCol('COMPRIMENTO', 'COMP');
    if (STATE._produtosDraft.colCubagem === undefined) { const c = achaCol('CUBAGEM', 'M3', 'M³', 'VOLUME'); STATE._produtosDraft.colCubagem = c >= 0 ? c : null; }
    renderPreviaProdutos();
  } catch (e) {
    console.error(e);
    box.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-700 rounded-2xl p-4 text-sm">Não foi possível carregar: ${escapeHtml(e.message)}</div>`;
  }
}

function renderPreviaProdutos() {
  const d = STATE._produtosDraft;
  const box = $('#previaProdutosBox');
  const grid = d.grid || [];
  const previewRows = grid.slice(0, 16);
  const maxCols = Math.min(16, Math.max(...previewRows.map(r => r.length), 1));
  const colOptions = (selecionado, opcional) => {
    let opts = opcional ? `<option value="">(não tenho essa coluna)</option>` : `<option value="">(nenhuma)</option>`;
    for (let c = 0; c < maxCols; c++) {
      opts += `<option value="${c}" ${String(selecionado)===String(c)?'selected':''}>Coluna ${colLetra(c)}</option>`;
    }
    return opts;
  };

  const mapaResult = montarMapaProdutos(grid, d);
  const usaCubagemPronta = d.colCubagem !== null && d.colCubagem !== undefined && d.colCubagem !== '';

  box.innerHTML = `
    <div class="bg-white rounded-2xl shadow-panel border border-ink-100 p-6">
      <h2 class="font-semibold text-ink-900 mb-1">Prévia e mapeamento de colunas</h2>
      <p class="text-xs text-ink-400 mb-3">Não precisa marcar linha de cabeçalho — o site identifica sozinho quais linhas são dado de produto (ignora linhas de título de seção automaticamente).</p>
      <div class="mb-4 overflow-x-auto border border-ink-100 rounded-lg max-h-64">
        <table class="text-[11px] w-full">
          <thead class="sticky top-0 bg-ink-50"><tr><td class="px-2 py-1"></td>${Array.from({length:maxCols}).map((_,c)=>`<td class="px-2 py-1 font-semibold text-ink-500">${colLetra(c)}</td>`).join('')}</tr></thead>
          <tbody>
            ${previewRows.map((row, r) => `
              <tr>
                <td class="px-2 py-1 text-ink-300 border-r border-ink-100">${r+1}</td>
                ${Array.from({length:maxCols}).map((_,c) => `<td class="px-2 py-1 border-r border-ink-50 whitespace-nowrap">${row[c] !== undefined && row[c] !== null ? escapeHtml(String(row[c]).slice(0,24)) : ''}</td>`).join('')}
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
      <div class="grid grid-cols-3 gap-3 mb-3">
        <div>
          <label class="text-xs text-ink-500">Código do produto (SKU) *</label>
          <select onchange="STATE._produtosDraft.colSku=this.value?parseInt(this.value):null; renderPreviaProdutos();" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 text-xs">${colOptions(d.colSku)}</select>
        </div>
        <div>
          <label class="text-xs text-ink-500">Peso do produto (kg) <span class="text-ink-300">(opcional)</span></label>
          <select onchange="STATE._produtosDraft.colPeso=this.value?parseInt(this.value):null; renderPreviaProdutos();" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 text-xs">${colOptions(d.colPeso, true)}</select>
        </div>
        <div>
          <label class="text-xs text-ink-500">Cubagem/Volume já pronto (m³) <span class="text-ink-300">(preferível, se tiver)</span></label>
          <select onchange="STATE._produtosDraft.colCubagem=this.value?parseInt(this.value):null; renderPreviaProdutos();" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 text-xs">${colOptions(d.colCubagem, true)}</select>
        </div>
      </div>
      <div class="${usaCubagemPronta ? 'opacity-40 pointer-events-none' : ''} grid grid-cols-4 gap-3 border-t border-ink-100 pt-3">
        <div>
          <label class="text-xs text-ink-500">Comprimento ${!usaCubagemPronta?'*':''}</label>
          <select onchange="STATE._produtosDraft.colComprimento=this.value?parseInt(this.value):null; renderPreviaProdutos();" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 text-xs">${colOptions(d.colComprimento, true)}</select>
        </div>
        <div>
          <label class="text-xs text-ink-500">Largura ${!usaCubagemPronta?'*':''}</label>
          <select onchange="STATE._produtosDraft.colLargura=this.value?parseInt(this.value):null; renderPreviaProdutos();" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 text-xs">${colOptions(d.colLargura, true)}</select>
        </div>
        <div>
          <label class="text-xs text-ink-500">Altura ${!usaCubagemPronta?'*':''}</label>
          <select onchange="STATE._produtosDraft.colAltura=this.value?parseInt(this.value):null; renderPreviaProdutos();" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 text-xs">${colOptions(d.colAltura, true)}</select>
        </div>
        <div>
          <label class="text-xs text-ink-500">Unidade das dimensões</label>
          <select onchange="STATE._produtosDraft.unidade=this.value; renderPreviaProdutos();" class="mt-1 w-full border border-ink-200 rounded-lg px-2 py-1.5 text-xs">

        ${mapaResult.total > 0
          ? `✓ ${mapaResult.total} produto(s) reconhecidos com volume válido.${mapaResult.linhasSecao ? ` ${mapaResult.linhasSecao} linha(s) de cabeçalho de seção ignoradas automaticamente.` : ''}${mapaResult.semDim ? ` ${mapaResult.semDim} linha(s) com SKU mas dimensão/cubagem inválida.` : ''}`
